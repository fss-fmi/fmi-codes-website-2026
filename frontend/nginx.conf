server {
    listen 80;
    server_name _;

    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json application/xml image/svg+xml;

    # Proxy API requests to the Flask backend
    location /api/ {
        proxy_pass http://backend:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Vite names these files by their content hash, so a name never changes meaning. A missing
    # one is a 404, never index.html: mid-rollout it means the other version, and asset-guard.js
    # reloads on it. add_header without "always" keeps the 404 itself uncached.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Every HTML response lands here: "/" through index and client routes through the fallback.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /asset-guard.js {
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — all other routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
