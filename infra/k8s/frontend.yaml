apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fmi-codes
  labels:
    app.kubernetes.io/name: fmi-codes-frontend
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fmi-codes-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fmi-codes-frontend
        app.kubernetes.io/part-of: fmi-codes-website-2026
        app.kubernetes.io/managed-by: kubectl
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: fssfmi/fmi-codes-frontend:latest
          securityContext:
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: fmi-codes
  labels:
    app.kubernetes.io/name: fmi-codes-frontend
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fmi-codes-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
