apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: fmi-codes-staging
resources:
  - ../../../base/ingress
patches:
  - path: certificate-delete.yaml
    target:
      kind: Certificate
      name: fmi-codes-tls
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: fmi-codes
