apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fmi-codes
spec:
  tls:
    - hosts:
        - staging.fmicodes.com
      secretName: fmi-codes-tls
  rules:
    - host: staging.fmicodes.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
