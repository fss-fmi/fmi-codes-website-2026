global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 16.4.0-debian-12-r14

volumePermissions:
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r30

fullnameOverride: postgres

auth:
  username: fmi_app
  database: fmi_hackathon_2026_staging
  existingSecret: fmi-codes-db
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  initdb:
    scriptsConfigMap: postgres-initdb
  persistence:
    enabled: true
    size: 8Gi
  # Staging's 2 backend pods during a rollout need 138 of these (tests/test_capacity_budget.py).
  # Re-run deploy-stateful.sh to apply; it restarts Postgres.
  extendedConfiguration: |
    max_connections = 150
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

architecture: standalone
