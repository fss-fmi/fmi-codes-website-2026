apiVersion: v1
kind: ConfigMap
metadata:
  name: security-headers
  namespace: fmi-codes
  labels:
    app.kubernetes.io/name: fmi-codes-ingress
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
data:
  X-Frame-Options: "DENY"
  X-Content-Type-Options: "nosniff"
  Referrer-Policy: "strict-origin-when-cross-origin"
  Permissions-Policy: "camera=(), microphone=(), geolocation=()"
  Content-Security-Policy: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self';"
  Strict-Transport-Security: "max-age=31536000; includeSubDomains; preload"
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: fmi-codes-letsencrypt
  labels:
    app.kubernetes.io/name: fmi-codes-ingress
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: fss.fmi.uni.sofia@gmail.com
    privateKeySecretRef:
      name: fmi-codes-letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fmi-codes-tls
  namespace: fmi-codes
  labels:
    app.kubernetes.io/name: fmi-codes-ingress
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
spec:
  secretName: fmi-codes-tls
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: ECDSA
    size: 256
  dnsNames:
    - fmicodes.com
  issuerRef:
    name: fmi-codes-letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fmi-codes
  namespace: fmi-codes
  labels:
    app.kubernetes.io/name: fmi-codes-ingress
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - fmicodes.com
      secretName: fmi-codes-tls
  rules:
    - host: fmicodes.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001
          - path: /static
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 5001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
