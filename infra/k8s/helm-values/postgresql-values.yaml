global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 16.4.0-debian-12-r14

volumePermissions:
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r30

fullnameOverride: postgres

auth:
  username: fmi_app
  database: fmi_hackathon_2026
  existingSecret: fmi-codes-db
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  initdb:
    scriptsConfigMap: postgres-initdb
  persistence:
    enabled: true
    size: 8Gi
  # The backend's pools (DB_POOL_MAX per worker) plus a rollout's surge pod, the migrate
  # initContainer and backups must fit (tests/test_capacity_budget.py). Re-run
  # deploy-stateful.sh to apply; it restarts Postgres, so not during registration (#219).
  extendedConfiguration: |
    max_connections = 150
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

architecture: standalone
