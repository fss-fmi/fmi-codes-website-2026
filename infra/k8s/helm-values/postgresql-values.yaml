global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 16.4.0-debian-12-r14

volumePermissions:
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r30

fullnameOverride: postgres

auth:
  username: fmi_app
  database: fmi_hackathon_2026
  existingSecret: fmi-codes-db
  secretKeys:
    adminPasswordKey: postgres-password
    userPasswordKey: password

primary:
  initdb:
    scriptsConfigMap: postgres-initdb
  persistence:
    enabled: true
    size: 8Gi
  # Every backend pod's pools during a rollout, the migrate initContainer and backups must fit
  # (tests/test_capacity_budget.py), and memory grows with connections. No CPU limit: team
  # changes queue on one advisory lock, so a throttled Postgres slows every queued request.
  # Re-run deploy-stateful.sh to apply; it restarts Postgres, so not during registration (#219).
  extendedConfiguration: |
    max_connections = 250
  resources:
    requests:
      cpu: "1"
      memory: 512Mi
    limits:
      memory: 2Gi

architecture: standalone
