fullnameOverride: kps
alertmanager:
  enabled: false
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    size: 1Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  grafana.ini:
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    security:
      content_security_policy: true
      content_security_policy_template: |-
        script-src 'self' 'unsafe-eval' 'unsafe-inline' 'strict-dynamic' $NONCE;object-src 'none';font-src 'self';style-src 'self' 'unsafe-inline' blob:;img-src * data:;base-uri 'self';connect-src 'self' grafana.com ws://$ROOT_PATH wss://$ROOT_PATH;manifest-src 'self';media-src 'none';form-action 'self' $FORM_ACTION_ADDITIONAL_HOSTS;
  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      nginx.ingress.kubernetes.io/configuration-snippet: |
        more_set_headers "Content-Security-Policy: $upstream_http_content_security_policy";
    hosts:
      - grafana.fmicodes.com
    path: /
    pathType: Prefix
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: fmi-codes
          orgId: 1
          folder: FMI Codes
          type: file
          disableDeletion: true
          editable: false
          options:
            path: /var/lib/grafana/dashboards/fmi-codes
  dashboards:
    fmi-codes:
      fmi-production:
        json: |
          {
            "title": "FMI Production",
            "uid": "fmi-prod",
            "schemaVersion": 38,
            "version": 1,
            "refresh": "30s",
            "time": { "from": "now-1h", "to": "now" },
            "panels": [
              {
                "id": 1,
                "title": "Request Rate",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                "targets": [
                  {
                    "expr": "rate(flask_http_request_total{namespace=\"fmi-codes\"}[5m])",
                    "legendFormat": "{{method}} {{path}} {{status}}",
                    "refId": "A"
                  }
                ],
                "fieldConfig": { "defaults": { "unit": "reqps" } }
              },
              {
                "id": 2,
                "title": "Request Duration (p50 / p95 / p99)",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                "targets": [
                  {
                    "expr": "histogram_quantile(0.50, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                    "legendFormat": "p50",
                    "refId": "A"
                  },
                  {
                    "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                    "legendFormat": "p95",
                    "refId": "B"
                  },
                  {
                    "expr": "histogram_quantile(0.99, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                    "legendFormat": "p99",
                    "refId": "C"
                  }
                ],
                "fieldConfig": { "defaults": { "unit": "s" } }
              },
              {
                "id": 3,
                "title": "Error Rate",
                "type": "timeseries",
                "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                "targets": [
                  {
                    "expr": "rate(flask_http_request_exceptions_total{namespace=\"fmi-codes\"}[5m])",
                    "legendFormat": "{{method}} {{path}}",
                    "refId": "A"
                  }
                ],
                "fieldConfig": { "defaults": { "unit": "reqps" } }
              }
            ]
          }
prometheus:
  prometheusSpec:
    retention: "14d"
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 800Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
prometheus-node-exporter:
  hostRootFsMount:
    enabled: false
  resources:
    requests:
      cpu: 20m
      memory: 32Mi
    limits:
      memory: 64Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 48Mi
    limits:
      memory: 128Mi
