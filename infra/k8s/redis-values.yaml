architecture: replication

fullnameOverride: redis

global:
  security:
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/redis
  tag: 7.4.3-debian-12-r0

auth:
  enabled: true
  existingSecret: fmi-codes-redis
  existingSecretPasswordKey: redis-password

master:
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

replica:
  replicaCount: 3
  persistence:
    enabled: true
    size: 2Gi
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi

sentinel:
  enabled: true
  masterSet: mymaster
  quorum: 2
  downAfterMilliseconds: 5000
  failoverTimeout: 10000
  parallelSyncs: 1
  image:
    registry: docker.io
    repository: bitnamilegacy/redis-sentinel
    tag: 7.4.3-debian-12-r0
  service:
    type: ClusterIP
    ports:
      sentinel: 26379
  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      memory: 128Mi

kubectl:
  image:
    registry: docker.io
    repository: bitnamilegacy/kubectl
    tag: 1.33.0-debian-12-r0

volumePermissions:
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r43

sysctl:
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r43

commonConfiguration: |-
  appendonly yes
  save ""
