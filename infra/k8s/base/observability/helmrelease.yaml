apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kps
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: monitoring
  storageNamespace: monitoring
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "87.19.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  values:
    fullnameOverride: kps
    alertmanager:
      enabled: false
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 1Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      readinessProbe:
        httpGet:
          path: /api/health
          port: grafana
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      grafana.ini:
        users:
          allow_sign_up: false
        auth.anonymous:
          enabled: false
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: fmi-codes
              orgId: 1
              folder: FMI Codes
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/fmi-codes
      dashboards:
        fmi-codes:
          fmi-production:
            json: |
              {
                "title": "FMI Production",
                "uid": "fmi-prod",
                "schemaVersion": 38,
                "version": 1,
                "refresh": "30s",
                "time": { "from": "now-1h", "to": "now" },
                "panels": [
                  {
                    "id": 1,
                    "title": "Request Rate",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                    "targets": [
                      {
                        "expr": "rate(flask_http_request_total{namespace=\"fmi-codes\"}[5m])",
                        "legendFormat": "{{method}} {{path}} {{status}}",
                        "refId": "A"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "reqps" } }
                  },
                  {
                    "id": 2,
                    "title": "Request Duration (p50 / p95 / p99)",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                    "targets": [
                      {
                        "expr": "histogram_quantile(0.50, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                        "legendFormat": "p50",
                        "refId": "A"
                      },
                      {
                        "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                        "legendFormat": "p95",
                        "refId": "B"
                      },
                      {
                        "expr": "histogram_quantile(0.99, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                        "legendFormat": "p99",
                        "refId": "C"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "s" } }
                  },
                  {
                    "id": 3,
                    "title": "Error Rate",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                    "targets": [
                      {
                        "expr": "rate(flask_http_request_exceptions_total{namespace=\"fmi-codes\"}[5m])",
                        "legendFormat": "{{method}} {{path}}",
                        "refId": "A"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "reqps" } }
                  }
                ]
              }
          fmi-staging:
            json: |
              {
                "title": "FMI Staging",
                "uid": "fmi-staging",
                "schemaVersion": 38,
                "version": 1,
                "refresh": "30s",
                "time": { "from": "now-1h", "to": "now" },
                "panels": [
                  {
                    "id": 1,
                    "title": "Request Rate",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                    "targets": [
                      {
                        "expr": "rate(flask_http_request_total{namespace=\"fmi-codes-staging\"}[5m])",
                        "legendFormat": "{{method}} {{path}} {{status}}",
                        "refId": "A"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "reqps" } }
                  },
                  {
                    "id": 2,
                    "title": "Request Duration (p50 / p95 / p99)",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                    "targets": [
                      {
                        "expr": "histogram_quantile(0.50, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes-staging\"}[5m])) by (le))",
                        "legendFormat": "p50",
                        "refId": "A"
                      },
                      {
                        "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes-staging\"}[5m])) by (le))",
                        "legendFormat": "p95",
                        "refId": "B"
                      },
                      {
                        "expr": "histogram_quantile(0.99, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes-staging\"}[5m])) by (le))",
                        "legendFormat": "p99",
                        "refId": "C"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "s" } }
                  },
                  {
                    "id": 3,
                    "title": "Error Rate",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                    "targets": [
                      {
                        "expr": "rate(flask_http_request_exceptions_total{namespace=\"fmi-codes-staging\"}[5m])",
                        "legendFormat": "{{method}} {{path}}",
                        "refId": "A"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "reqps" } }
                  }
                ]
              }
    prometheus:
      prometheusSpec:
        retention: "14d"
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        resources:
          requests:
            cpu: 100m
            memory: 400Mi
          limits:
            memory: 800Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ['ReadWriteOnce']
              resources:
                requests:
                  storage: 5Gi
    prometheus-node-exporter:
      hostRootFsMount:
        enabled: false
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 48Mi
        limits:
          memory: 128Mi
