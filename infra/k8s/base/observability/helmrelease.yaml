apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: flux-system
spec:
  interval: 1h
  url: https://prometheus-community.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kps
  namespace: flux-system
spec:
  interval: 5m
  # Without it Flux names the release monitoring-kps, and the subcharts (Grafana,
  # kube-state-metrics, node-exporter) take their names from the release, not fullnameOverride.
  # The Grafana Ingress, rotate-secret.sh and the runbook all expect kps-grafana.
  releaseName: kps
  targetNamespace: monitoring
  storageNamespace: monitoring
  install:
    crds: CreateReplace
    # Grafana can't start until deploy-observability.sh applies grafana-admin, which on a fresh
    # cluster usually happens after Flux's first install attempt. Keep retrying instead of
    # stalling for good on that first timeout.
    remediation:
      retries: -1
  upgrade:
    crds: CreateReplace
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "87.19.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 1h
  values:
    fullnameOverride: kps
    alertmanager:
      enabled: true
      # global and templates keep the chart defaults (Helm merges this map over them).
      # Staging's namespace goes to the staging channel. Everything else, shared alerts
      # included, goes to the channel of the env this cluster serves: `cluster_url` holds the
      # prod webhook on the server and the staging one on a staging-only box.
      config:
        # A list replaces the chart's, so its four default rules are repeated here.
        inhibit_rules:
          - source_matchers: [severity = critical]
            target_matchers: [severity =~ warning|info]
            equal: [namespace, alertname]
          - source_matchers: [severity = warning]
            target_matchers: [severity = info]
            equal: [namespace, alertname]
          - source_matchers: [alertname = InfoInhibitor]
            target_matchers: [severity = info]
            equal: [namespace]
          - target_matchers: [alertname = InfoInhibitor]
          # One crash loop is one message: the pod it keeps from becoming ready and the rollout
          # it holds up would otherwise post on their own a few minutes later.
          - source_matchers: [alertname =~ "KubeInitContainerCrashLooping|KubePodCrashLooping"]
            target_matchers: [alertname = KubePodNotReady]
            equal: [namespace, pod]
          - source_matchers: [alertname =~ "KubeInitContainerCrashLooping|KubePodCrashLooping"]
            target_matchers:
              - alertname =~ "KubeDeploymentReplicasMismatch|KubeDeploymentRolloutStuck|KubeStatefulSetReplicasMismatch"
            equal: [namespace]
        route:
          receiver: slack
          group_by: [alertname, namespace]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            # Watchdog always fires by design and InfoInhibitor only exists to mute info alerts.
            - receiver: 'null'
              matchers:
                - alertname =~ "Watchdog|InfoInhibitor"
            - receiver: 'null'
              matchers:
                - severity = "info"
            - receiver: slack-staging
              matchers:
                - namespace = "fmi-codes-staging"
        receivers:
          - name: 'null'
          - name: slack
            slack_configs:
              # Read on every send, so rotating the webhook needs no restart.
              - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/cluster_url
                send_resolved: true
                # The default links to Alertmanager's in-cluster URL, which nobody can open, and
                # the operator drops an empty value.
                title_link: https://fss-fmi.github.io/fmi-codes-website-2026/runbook/#cluster-alerts
                color: '{{ template "fmi.color" . }}'
                title: '{{ template "fmi.title" . }}'
                text: '{{ template "fmi.text" . }}'
          - name: slack-staging
            slack_configs:
              - api_url_file: /etc/alertmanager/secrets/alertmanager-slack/staging_url
                send_resolved: true
                title_link: https://fss-fmi.github.io/fmi-codes-website-2026/runbook/#cluster-alerts
                color: '{{ template "fmi.color" . }}'
                title: '{{ template "fmi.title" . }}'
                text: '{{ template "fmi.text" . }}'
      templateFiles:
        # Node alerts carry namespace=monitoring (the exporter's), so anything outside the two
        # app namespaces is titled `cluster`; the description names the namespace.
        fmi-codes.tmpl: |-
          {{ define "fmi.env" }}{{ if eq .CommonLabels.namespace "fmi-codes" }}prod{{ else if eq .CommonLabels.namespace "fmi-codes-staging" }}staging{{ else }}cluster{{ end }}{{ end }}
          {{ define "fmi.color" }}{{ if eq .Status "resolved" }}good{{ else if eq .CommonLabels.severity "critical" }}danger{{ else }}warning{{ end }}{{ end }}
          {{ define "fmi.title" }}{{ if eq .Status "resolved" }}✅ Resolved{{ else }}🚨 {{ .CommonLabels.severity | title }}{{ end }}: {{ .CommonLabels.alertname }} · {{ template "fmi.env" . }}{{ end }}
          {{ define "fmi.text" }}{{ $alerts := .Alerts.Firing }}{{ if eq .Status "resolved" }}{{ $alerts = .Alerts.Resolved }}{{ end }}{{ range $alerts }}• *{{ .Annotations.summary }}* {{ .Annotations.description }}{{ with .Annotations.runbook_url }} <{{ . }}|runbook>{{ end }}
          {{ end }}{{ end }}
      alertmanagerSpec:
        # The pod can't start without this Secret, so deploy-observability.sh must have applied
        # it first. Don't count on the release failing without it: the pod is created by the
        # operator, not Helm, so check the pod.
        secrets:
          - alertmanager-slack
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 64Mi
    # k3s runs these inside its own process and exposes no endpoints for them, so their
    # monitors only produce permanent "down" alerts. Disabling them also drops their rules.
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false
    kubeEtcd:
      enabled: false
    customRules:
      KubePodCrashLooping:
        for: 5m
      KubePodNotReady:
        for: 10m
      KubeJobFailed:
        for: 1m
    additionalPrometheusRulesMap:
      fmi-codes:
        groups:
          - name: fmi-codes.containers
            rules:
              - alert: ContainerOOMKilled
                expr: |-
                  increase(kube_pod_container_status_restarts_total{job="kube-state-metrics"}[10m]) >= 1
                  and on (namespace, pod, container)
                  kube_pod_container_status_last_terminated_reason{job="kube-state-metrics", reason="OOMKilled"} == 1
                labels:
                  severity: warning
                annotations:
                  summary: Container was OOMKilled.
                  description: '{{ $labels.namespace }}/{{ $labels.pod }} ({{ $labels.container }}) ran out of memory and was restarted in the last 10 minutes.'
              # KubePodCrashLooping only looks at regular containers. A crash-looping
              # initContainer (the backend's migrate step) leaves the pod in Init.
              - alert: KubeInitContainerCrashLooping
                expr: max_over_time(kube_pod_init_container_status_waiting_reason{job="kube-state-metrics", reason="CrashLoopBackOff"}[5m]) >= 1
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: Init container is crash looping.
                  description: '{{ $labels.namespace }}/{{ $labels.pod }} (init container {{ $labels.container }}) is in CrashLoopBackOff, so the pod never starts.'
          - name: fmi-codes.backend
            rules:
              # Health probes aren't counted (excluded_paths in backend/app/__init__.py), so with
              # no real traffic the ratio is 0/0 and never fires.
              - alert: BackendHighErrorRate
                expr: |-
                  sum by (namespace) (rate(flask_http_request_total{status=~"5.."}[5m]))
                  /
                  sum by (namespace) (rate(flask_http_request_total[5m]))
                  > 0.05
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: Backend is answering with 5xx errors.
                  description: '{{ $value | humanizePercentage }} of backend requests in {{ $labels.namespace }} returned a 5xx over the last 5 minutes.'
    grafana:
      admin:
        existingSecret: grafana-admin
        userKey: admin-user
        passwordKey: admin-password
      persistence:
        enabled: true
        size: 1Gi
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 512Mi
      readinessProbe:
        httpGet:
          path: /api/health
          port: grafana
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 5
        failureThreshold: 5
      grafana.ini:
        users:
          allow_sign_up: false
        auth.anonymous:
          enabled: false
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: fmi-codes
              orgId: 1
              folder: FMI Codes
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/fmi-codes
      dashboards:
        fmi-codes:
          fmi-production:
            json: |
              {
                "title": "FMI Production",
                "uid": "fmi-prod",
                "schemaVersion": 38,
                "version": 1,
                "refresh": "30s",
                "time": { "from": "now-1h", "to": "now" },
                "panels": [
                  {
                    "id": 1,
                    "title": "Request Rate",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                    "targets": [
                      {
                        "expr": "sum by (method, status) (rate(flask_http_request_total{namespace=\"fmi-codes\"}[5m]))",
                        "legendFormat": "{{method}} {{status}}",
                        "refId": "A"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "reqps" } }
                  },
                  {
                    "id": 2,
                    "title": "Request Duration (p50 / p95 / p99)",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                    "targets": [
                      {
                        "expr": "histogram_quantile(0.50, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                        "legendFormat": "p50",
                        "refId": "A"
                      },
                      {
                        "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                        "legendFormat": "p95",
                        "refId": "B"
                      },
                      {
                        "expr": "histogram_quantile(0.99, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes\"}[5m])) by (le))",
                        "legendFormat": "p99",
                        "refId": "C"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "s" } }
                  },
                  {
                    "id": 3,
                    "title": "5xx Share",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                    "targets": [
                      {
                        "expr": "sum(rate(flask_http_request_total{namespace=\"fmi-codes\", status=~\"5..\"}[5m])) / sum(rate(flask_http_request_total{namespace=\"fmi-codes\"}[5m]))",
                        "legendFormat": "5xx share",
                        "refId": "A"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 } }
                  }
                ]
              }
          fmi-staging:
            json: |
              {
                "title": "FMI Staging",
                "uid": "fmi-staging",
                "schemaVersion": 38,
                "version": 1,
                "refresh": "30s",
                "time": { "from": "now-1h", "to": "now" },
                "panels": [
                  {
                    "id": 1,
                    "title": "Request Rate",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
                    "targets": [
                      {
                        "expr": "sum by (method, status) (rate(flask_http_request_total{namespace=\"fmi-codes-staging\"}[5m]))",
                        "legendFormat": "{{method}} {{status}}",
                        "refId": "A"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "reqps" } }
                  },
                  {
                    "id": 2,
                    "title": "Request Duration (p50 / p95 / p99)",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
                    "targets": [
                      {
                        "expr": "histogram_quantile(0.50, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes-staging\"}[5m])) by (le))",
                        "legendFormat": "p50",
                        "refId": "A"
                      },
                      {
                        "expr": "histogram_quantile(0.95, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes-staging\"}[5m])) by (le))",
                        "legendFormat": "p95",
                        "refId": "B"
                      },
                      {
                        "expr": "histogram_quantile(0.99, sum(rate(flask_http_request_duration_seconds_bucket{namespace=\"fmi-codes-staging\"}[5m])) by (le))",
                        "legendFormat": "p99",
                        "refId": "C"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "s" } }
                  },
                  {
                    "id": 3,
                    "title": "5xx Share",
                    "type": "timeseries",
                    "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
                    "targets": [
                      {
                        "expr": "sum(rate(flask_http_request_total{namespace=\"fmi-codes-staging\", status=~\"5..\"}[5m])) / sum(rate(flask_http_request_total{namespace=\"fmi-codes-staging\"}[5m]))",
                        "legendFormat": "5xx share",
                        "refId": "A"
                      }
                    ],
                    "fieldConfig": { "defaults": { "unit": "percentunit", "min": 0 } }
                  }
                ]
              }
    prometheus:
      prometheusSpec:
        retention: "14d"
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
        serviceMonitorNamespaceSelector: {}
        resources:
          requests:
            cpu: 100m
            memory: 400Mi
          limits:
            memory: 800Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              accessModes: ['ReadWriteOnce']
              resources:
                requests:
                  storage: 5Gi
    prometheus-node-exporter:
      hostRootFsMount:
        enabled: false
      resources:
        requests:
          cpu: 20m
          memory: 32Mi
        limits:
          memory: 64Mi
    kube-state-metrics:
      resources:
        requests:
          cpu: 20m
          memory: 48Mi
        limits:
          memory: 128Mi
