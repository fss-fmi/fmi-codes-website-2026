apiVersion: v1
kind: ConfigMap
metadata:
  name: fmi-codes-backend-config
  namespace: fmi-codes
  labels:
    app.kubernetes.io/name: fmi-codes-backend
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
data:
  FLASK_ENV: "production"
  DB_HOST: "postgres.fmi-codes.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "fmi_hackathon_2026"
  DB_USER: "fmi_app"
  REDIS_SENTINELS: "redis.fmi-codes.svc.cluster.local:26379"
  REDIS_MASTER_NAME: "mymaster"
  REDIS_URL: ""
  FRONTEND_ORIGIN: "https://fmicodes.com"
  MENTORS_STAY_TUNED: "false"
  REGISTRATION_OPEN: "false"
  RANKINGS_LIVE: "false"
  REQUIRE_EMAIL_VERIFICATION: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fmi-codes
  labels:
    app.kubernetes.io/name: fmi-codes-backend
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: fmi-codes-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fmi-codes-backend
        app.kubernetes.io/part-of: fmi-codes-website-2026
        app.kubernetes.io/managed-by: kubectl
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      # Brings the schema up to date before new code starts. A failed migration
      # keeps the new pods from starting, so the old ReplicaSet keeps serving.
      initContainers:
        - name: migrate
          image: fssfmi/fmi-codes-backend:latest # {"$imagepolicy": "flux-system:fmi-codes-backend"}
          imagePullPolicy: IfNotPresent
          # Images built before the runner existed (e.g. prod until its next promote)
          # don't ship database/migrate.py; skip instead of blocking the rollout.
          command: ["sh", "-c"]
          args:
            - |
              if [ -f database/migrate.py ]; then
                exec python -m database.migrate --notify changes
              fi
              echo "database/migrate.py not in this image; skipping migrations"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          envFrom:
            - configMapRef:
                name: fmi-codes-backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-db
                  key: password
            # Optional so a missing key can never block a rollout; unset just skips the message.
            - name: SLACK_MIGRATIONS_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-app
                  key: SLACK_MIGRATIONS_WEBHOOK_URL
                  optional: true
            - name: MIGRATION_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 256Mi
      containers:
        - name: backend
          image: fssfmi/fmi-codes-backend:latest # {"$imagepolicy": "flux-system:fmi-codes-backend"}
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: fmi-codes-backend-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-db
                  key: password
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-redis
                  key: redis-password
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-app
                  key: SECRET_KEY
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-app
                  key: JWT_SECRET_KEY
            - name: ADMIN_PASSWORD_HASH
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-app
                  key: ADMIN_PASSWORD_HASH
            - name: MAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-app
                  key: MAIL_PASSWORD
            - name: DISCORD_BUG_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-app
                  key: DISCORD_BUG_WEBHOOK_URL
            # Optional so a missing key can never block a rollout; unset just skips Slack.
            - name: SLACK_BUG_WEBHOOK_URL
              valueFrom:
                secretKeyRef:
                  name: fmi-codes-app
                  key: SLACK_BUG_WEBHOOK_URL
                  optional: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 6
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fmi-codes
  labels:
    app.kubernetes.io/name: fmi-codes-backend
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fmi-codes-backend
  ports:
    - name: http
      port: 5001
      targetPort: http
