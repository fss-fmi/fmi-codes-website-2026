apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: tailscale
  namespace: flux-system
spec:
  interval: 1h
  url: https://pkgs.tailscale.com/helmcharts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: flux-system
spec:
  interval: 5m
  targetNamespace: tailscale
  storageNamespace: tailscale
  # The operator pod waits for the operator-oauth Secret (applied by deploy-observability.sh,
  # never by Flux). Without disableWait a cluster that has no Tailscale credentials yet would
  # fail the release on every reconcile; with it the pod just starts once the Secret exists.
  install:
    crds: CreateReplace
    disableWait: true
  upgrade:
    crds: CreateReplace
    disableWait: true
  chart:
    spec:
      chart: tailscale-operator
      version: "1.102.4"
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 1h
  values:
    operatorConfig:
      hostname: fmi-codes-operator
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
