services:
  db:
    container_name: fmi-codes-db
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Persistent storage — data survives container restarts
      - postgres_data:/var/lib/postgresql/data
      # Init scripts: Postgres runs these once on first startup, in order
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    # M6: No host port mapping in production — DB is internal only.
    #     Access via: docker exec fmi-codes-db psql ...
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis-master:
    container_name: fmi-codes-redis-master
    image: redis:7-alpine
    # H7/H1: Shared Redis for rate-limiter storage (H7) and JWT revocation blocklist (H1).
    #         No host port mapping — internal network only.
    # In real production HA is handled by a Helm-managed Sentinel chart; this compose
    # mirrors that topology (1 master + 2 replicas + 3 sentinels) for a prod-like
    # local/staging bring-up so failover can be exercised before k8s deploy.
    command: redis-server --appendonly yes
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-1:
    container_name: fmi-codes-redis-replica-1
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-replica-2:
    container_name: fmi-codes-redis-replica-2
    image: redis:7-alpine
    command: redis-server --replicaof redis-master 6379 --appendonly yes
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  sentinel-1:
    container_name: fmi-codes-sentinel-1
    image: redis:7-alpine
    # Sentinel rewrites its own config at runtime, so mount the template read-only
    # and copy it to a writable path before launching.
    command: >
      sh -c "cp /etc/redis/sentinel.conf.tpl /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf.tpl:ro
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -p 26379 sentinel master mymaster | grep -q "mymaster"']
      interval: 5s
      timeout: 3s
      retries: 10

  sentinel-2:
    container_name: fmi-codes-sentinel-2
    image: redis:7-alpine
    command: >
      sh -c "cp /etc/redis/sentinel.conf.tpl /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf.tpl:ro
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -p 26379 sentinel master mymaster | grep -q "mymaster"']
      interval: 5s
      timeout: 3s
      retries: 10

  sentinel-3:
    container_name: fmi-codes-sentinel-3
    image: redis:7-alpine
    command: >
      sh -c "cp /etc/redis/sentinel.conf.tpl /data/sentinel.conf && redis-sentinel /data/sentinel.conf"
    volumes:
      - ./redis/sentinel.conf:/etc/redis/sentinel.conf.tpl:ro
    depends_on:
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -p 26379 sentinel master mymaster | grep -q "mymaster"']
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    container_name: fmi-codes-app
    # Prod runs the immutable image published by the CD pipeline
    # (.github/workflows/docker-cd.yaml). Local builds live in docker-compose.dev.yml.
    image: fssfmi/fmi-codes-backend:latest
    # M6: No host port mapping in production — traffic flows through Nginx only.
    environment:
      FLASK_ENV: ${FLASK_ENV}
      FLASK_DEBUG: ${FLASK_DEBUG}
      DB_HOST: db # "db" is the service name above — Docker resolves it automatically
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      MENTORS_STAY_TUNED: ${MENTORS_STAY_TUNED}
      REGISTRATION_OPEN: ${REGISTRATION_OPEN}
      RANKINGS_LIVE: ${RANKINGS_LIVE}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-false}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_USE_TLS: ${MAIL_USE_TLS}
      DISCORD_BUG_WEBHOOK_URL: ${DISCORD_BUG_WEBHOOK_URL}
      SLACK_BUG_WEBHOOK_URL: ${SLACK_BUG_WEBHOOK_URL}
      REDIS_SENTINELS: sentinel-1:26379,sentinel-2:26379,sentinel-3:26379
      REDIS_MASTER_NAME: mymaster
      # REDIS_URL: redis://redis-master:6379  # optional single-instance override; unset REDIS_SENTINELS/REDIS_MASTER_NAME to use it
    networks:
      default:
        aliases:
          - backend
    depends_on:
      db:
        condition: service_healthy # App won't start until Postgres is ready
      sentinel-1:
        condition: service_healthy
      sentinel-2:
        condition: service_healthy
      sentinel-3:
        condition: service_healthy

  frontend:
    container_name: fmi-codes-frontend
    image: fssfmi/fmi-codes-frontend:latest
    ports:
      - '80:80'
    depends_on:
      - app

volumes:
  postgres_data:
