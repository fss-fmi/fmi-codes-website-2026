<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ranking</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #050816;
        --bg-card: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.06);
        --border-glow: rgba(96, 165, 250, 0.25);
        --text: #e2e8f0;
        --muted: #64748b;
        --accent: #60a5fa;
        --accent-2: #22d3ee;
        --purple: #a78bfa;
        --pink: #f472b6;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-border: rgba(255, 255, 255, 0.08);
        --glow: 0 20px 60px rgba(0, 0, 0, 0.45);
        --gold: #f59e0b;
        --silver: #94a3b8;
        --bronze: #b45309;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 80px 16px 48px;
        display: flex;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }

      /* Island Navbar */
      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(5, 6, 13, 0.6);
        backdrop-filter: blur(20px) saturate(1.8);
        -webkit-backdrop-filter: blur(20px) saturate(1.8);
        border: none;
        border-radius: 0;
        z-index: 1000;
        box-shadow: none;
        transition:
          background 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .navbar::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #60a5fa 20%,
          #22d3ee 40%,
          #a78bfa 60%,
          #f472b6 80%,
          transparent 100%
        );
        background-size: 200% 100%;
        animation: navGradientFlow 6s linear infinite;
        opacity: 0.5;
      }
      @keyframes navGradientFlow {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
      .navbar-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 16px 48px;
        display: flex;
        align-items: center;
        gap: 36px;
      }
      .navbar-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 60px;
      }
      .navbar-logo a {
        display: inline-flex;
        align-items: center;
        transition: filter 0.3s;
      }
      .navbar-logo a:hover {
        filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.4));
      }
      .navbar-logo img {
        height: 44px;
        width: auto;
        display: block;
      }
      .logo-text {
        font-size: 20px;
        font-weight: 800;
        background: linear-gradient(120deg, #60a5fa, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 2px;
      }
      .nav-links {
        display: flex;
        gap: 24px;
        align-items: center;
        flex: 1;
        justify-content: center;
      }
      .nav-link {
        color: #e5e7eb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s ease;
        position: relative;
      }
      .nav-link:hover {
        color: #60a5fa;
      }
      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(120deg, #60a5fa, #22d3ee);
        transition: width 0.2s ease;
      }
      .nav-link:hover::after {
        width: 100%;
      }
      .nav-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 140px;
        justify-content: flex-end;
      }
      .settings-btn {
        background: none;
        border: none;
        font-size: 18px;
        cursor: pointer;
        padding: 6px 10px;
        border-radius: 6px;
        transition: all 0.2s ease;
      }
      .settings-btn:hover {
        background: rgba(96, 165, 250, 0.1);
      }
      .login-btn {
        background: linear-gradient(120deg, #60a5fa, #22d3ee);
        border: none;
        color: #0b1021;
        padding: 8px 18px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
      }
      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
      }

      .container {
        width: 100%;
        max-width: 1100px;
        display: grid;
        gap: 20px;
      }

      /* Podium */
      .podium {
        display: grid;
        grid-template-columns: 1fr 1.3fr 1fr;
        gap: 20px;
        align-items: end;
      }
      .podium-card {
        border: 1px solid var(--panel-border);
        border-radius: 16px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.06), rgba(255, 255, 255, 0.02));
        box-shadow: var(--glow);
        padding: 28px;
        text-align: center;
        position: relative;
        overflow: hidden;
        min-height: 280px;
      }
      .podium-card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 20% 20%, rgba(96, 165, 250, 0.12), transparent 45%);
        pointer-events: none;
      }
      .podium-card.first {
        transform: translateY(-20px);
        border-color: rgba(245, 158, 11, 0.45);
      }
      .podium-card.second {
        transform: translateY(-8px);
        border-color: rgba(148, 163, 184, 0.4);
      }
      .podium-card.third {
        transform: translateY(-4px);
        border-color: rgba(180, 83, 9, 0.4);
      }

      .badge {
        position: absolute;
        top: 12px;
        left: 12px;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 800;
        font-size: 12px;
      }
      .badge.first {
        background: rgba(245, 158, 11, 0.15);
        color: #ffdd7d;
        border: 1px solid rgba(245, 158, 11, 0.4);
      }
      .badge.second {
        background: rgba(148, 163, 184, 0.15);
        color: #dee5f2;
        border: 1px solid rgba(148, 163, 184, 0.4);
      }
      .badge.third {
        background: rgba(180, 83, 9, 0.15);
        color: #ffd1a3;
        border: 1px solid rgba(180, 83, 9, 0.4);
      }

      .team-image {
        width: 140px;
        height: 140px;
        border-radius: 50%;
        border: 2px solid var(--panel-border);
        object-fit: cover;
        background: #111827;
        margin: 8px auto 12px;
      }
      .team-name {
        font-size: 22px;
        font-weight: 800;
        letter-spacing: 0.3px;
      }
      .points {
        margin-top: 10px;
        color: #cbd5e1;
        font-weight: 800;
        font-size: 16px;
      }

      /* Others list */
      .list {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }
      .list-item {
        border: 1px solid var(--panel-border);
        border-radius: 12px;
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
        box-shadow: var(--glow);
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .rank {
        font-weight: 800;
        color: #94a3b8;
      }
      .name {
        font-weight: 700;
      }

      @media (max-width: 768px) {
        body {
          padding: 76px 12px 36px;
        }
        .navbar-container {
          padding: 10px 16px;
        }
        .podium {
          grid-template-columns: 1fr;
          gap: 14px;
        }
        .podium-card {
          min-height: 220px;
          padding: 22px;
        }
        .podium-card.first,
        .podium-card.second,
        .podium-card.third {
          transform: none;
        }
        .team-image {
          width: 110px;
          height: 110px;
        }
        .team-name {
          font-size: 20px;
        }
        .list {
          grid-template-columns: 1fr;
        }
      }
      /* Background layers */
      .dot-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
        -webkit-mask-image: radial-gradient(
          ellipse 80% 60% at 50% 40%,
          black 30%,
          transparent 100%
        );
      }
      .spotlight {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
          600px circle at var(--mx, 50%) var(--my, 30%),
          rgba(96, 165, 250, 0.07),
          rgba(34, 211, 238, 0.04) 40%,
          transparent 70%
        );
        transition: background 0.3s ease;
      }
      .blobs {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.15;
        will-change: transform;
      }
      .blob-1 {
        width: 700px;
        height: 700px;
        background: #60a5fa;
        top: -15%;
        left: -10%;
        animation: blobFloat1 18s ease-in-out infinite;
      }
      .blob-2 {
        width: 500px;
        height: 500px;
        background: #22d3ee;
        top: 40%;
        right: -12%;
        animation: blobFloat2 22s ease-in-out infinite;
      }
      .blob-3 {
        width: 450px;
        height: 450px;
        background: #a78bfa;
        bottom: -10%;
        left: 25%;
        animation: blobFloat3 20s ease-in-out infinite;
      }
      @keyframes blobFloat1 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(120px, 80px) scale(1.1);
        }
      }
      @keyframes blobFloat2 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-80px, -60px) scale(1.15);
        }
      }
      @keyframes blobFloat3 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(70px, -50px) scale(1.08);
        }
      }
      .noise {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 128px 128px;
      }
      .page-wrap {
        position: relative;
        z-index: 2;
        width: 100%;
      }
      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .container {
        animation: fadeSlideUp 0.7s ease both;
      }
    </style>
  </head>
  <body>
    <div class="dot-grid"></div>
    <div class="spotlight"></div>
    <div class="blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="noise"></div>
    <div class="page-wrap">
      <!-- Navigation Bar -->
      <nav class="navbar">
        <div class="navbar-container">
          <div class="navbar-logo">
            <a href="/"><img src="/static/images/FSS_logo_vector_trans_white.svg" alt="FSS" /></a>
          </div>
          <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/regulations" class="nav-link">Regulations</a>
            <a href="/schedule" class="nav-link">Schedule</a>
            <a href="/mentors" class="nav-link">Mentors</a>
            <a href="/ranking" class="nav-link">Ranking</a>
          </div>
          <div class="nav-actions">
            <a href="/login" class="login-btn">Login</a>
          </div>
        </div>
      </nav>

      <div class="container">
        <div id="podium" class="podium"></div>
        <div id="list" class="list"></div>
      </div>

      <script>
        function createImage(src) {
          const img = document.createElement('img');
          img.className = 'team-image';
          img.src =
            src ||
            'https://images.unsplash.com/photo-1541534401786-2077eed87a72?w=256&h=256&fit=crop&crop=faces';
          img.alt = 'Team image';
          return img;
        }

        function podiumCard(rankClass, label, team) {
          const card = document.createElement('div');
          card.className = `podium-card ${rankClass}`;
          card.innerHTML = `<div class="badge ${rankClass}">${label}</div>`;
          card.appendChild(createImage(team.image));
          const name = document.createElement('div');
          name.className = 'team-name';
          name.textContent = team.team;
          const pts = document.createElement('div');
          pts.className = 'points';
          pts.textContent = `${team.points} pts`;
          card.appendChild(name);
          card.appendChild(pts);
          return card;
        }

        async function loadRanking() {
          const podium = document.getElementById('podium');
          const list = document.getElementById('list');
          podium.innerHTML = '';
          list.innerHTML = '';

          try {
            const res = await fetch('/api/ranking');
            const data = await res.json();
            let teams = data && data.success && Array.isArray(data.rankings) ? data.rankings : [];
            teams = teams.sort((a, b) => (b.points || 0) - (a.points || 0));

            const top = teams.slice(0, 3);
            const others = teams.slice(3);

            // Render podium: second, first, third visually
            const order = [
              { cls: 'second', label: '2nd' },
              { cls: 'first', label: '1st' },
              { cls: 'third', label: '3rd' },
            ];
            order.forEach((o, i) => {
              const t = top[i] || { team: 'TBD', points: 0 };
              podium.appendChild(podiumCard(o.cls, o.label, t));
            });

            // Render others
            others.forEach((t, idx) => {
              const item = document.createElement('div');
              item.className = 'list-item';
              const left = document.createElement('div');
              left.style.display = 'flex';
              left.style.gap = '10px';
              left.style.alignItems = 'center';

              const rank = document.createElement('span');
              rank.className = 'rank';
              rank.textContent = `${idx + 4}.`;
              const name = document.createElement('span');
              name.className = 'name';
              name.textContent = t.team;

              left.appendChild(rank);
              left.appendChild(name);

              const pts = document.createElement('span');
              pts.className = 'points';
              pts.textContent = `${t.points} pts`;

              item.appendChild(left);
              item.appendChild(pts);
              list.appendChild(item);
            });
          } catch (e) {
            const err = document.createElement('div');
            err.style.color = '#cbd5e1';
            err.style.textAlign = 'center';
            err.style.padding = '24px 0';
            err.textContent = 'Error loading ranking.';
            document.querySelector('.container').appendChild(err);
          }
        }

        document.addEventListener('DOMContentLoaded', loadRanking);
      </script>
      <script>
        function ensureMentorLink(text, href) {
          const navLinks = document.querySelector('.nav-links');
          let link = document.querySelector('.nav-links .mentor-link');
          if (!link) {
            link = document.createElement('a');
            link.className = 'nav-link mentor-link';
            navLinks.appendChild(link);
          }
          link.textContent = text;
          link.href = href;
        }

        async function setMentorLinkBySelection() {
          try {
            const res = await fetch('/api/mentors/available');
            if (!res.ok) return;
            const data = await res.json();
            const selectedCount = Array.isArray(data.selected) ? data.selected.length : 0;
            if (selectedCount > 0) {
              ensureMentorLink('Selected Mentors', '/selectedMentors');
            } else {
              ensureMentorLink('Choose Mentor', '/chooseMentor');
            }
          } catch {}
        }

        function updateNavbar() {
          const teamName = window.loggedInTeam || '';
          const navActions = document.querySelector('.nav-actions');
          if (teamName) {
            navActions.innerHTML = `
          <button onclick="logout()" class="login-btn" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">Logout</button>
        `;
            setMentorLinkBySelection();
          }
        }
        async function logout() {
          try {
            const response = await fetch('/api/logout', { method: 'POST' });
            if (response.ok) window.location.reload();
          } catch (error) {
            console.error('Logout failed:', error);
          }
        }
        updateNavbar();
      </script>
    </div>
    <!-- /page-wrap -->
    <script>
      document.addEventListener('mousemove', (e) => {
        const s = document.querySelector('.spotlight');
        if (s) {
          s.style.setProperty('--mx', e.clientX + 'px');
          s.style.setProperty('--my', e.clientY + 'px');
        }
      });
    </script>
  </body>
</html>
