{% extends "base.html" %} {% block title %}Regulations — Mission Control{% endblock %} {% block head
%}
<style>
  :root {
    --bg: #050816;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #60a5fa;
    --accent-2: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
    --emerald: #34d399;
    --panel-border: rgba(255, 255, 255, 0.08);
    --card-glow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html {
    scroll-behavior: smooth;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
  }

  /* ── Background layers (Dotted Grid & Original Blob Colors) ── */
  .dot-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
  }
  .spotlight {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(
      600px circle at var(--mx, 50%) var(--my, 30%),
      rgba(96, 165, 250, 0.07),
      rgba(34, 211, 238, 0.04) 40%,
      transparent 70%
    );
    transition: background 0.3s ease;
  }
  .blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.13;
    will-change: transform;
  }
  .blob-1 {
    width: 700px;
    height: 700px;
    background: #7dd3fc;
    top: -15%;
    left: -10%;
    animation: blobFloat1 18s ease-in-out infinite;
  }
  .blob-2 {
    width: 500px;
    height: 500px;
    background: #f9a8d4;
    top: 40%;
    right: -12%;
    animation: blobFloat2 22s ease-in-out infinite;
  }
  .blob-3 {
    width: 450px;
    height: 450px;
    background: #a78bfa;
    bottom: -10%;
    left: 25%;
    animation: blobFloat3 20s ease-in-out infinite;
  }
  @keyframes blobFloat1 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(120px, 80px) scale(1.1);
    }
  }
  @keyframes blobFloat2 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(-80px, -60px) scale(1.15);
    }
  }
  @keyframes blobFloat3 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(70px, -50px) scale(1.08);
    }
  }
  .noise {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 128px 128px;
  }

  .page-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    padding-top: 76px;
  }

  /* ── Header ── */
  .admin-header {
    max-width: 1200px;
    width: 100%;
    margin: 0 auto;
    padding: 40px 24px 20px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .admin-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .admin-eyebrow::before,
  .admin-eyebrow::after {
    content: '';
    display: inline-block;
    width: 20px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    border-radius: 2px;
  }
  .admin-title {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    line-height: 1.2; /* Увеличено от 1.08 */
    padding-bottom: 0.15em; /* Добавено място за букви като 'g', 'p', 'y' */
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-size: 200% auto;
    letter-spacing: -0.02em;
    animation: shimmer 4s linear infinite;
  }
  @keyframes shimmer {
    0% {
      background-position: -200% center;
    }
    100% {
      background-position: 200% center;
    }
  }
  .admin-subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 2px; /* Намалено леко, заради добавения padding на заглавието */
    max-width: 600px;
    line-height: 1.6;
  }

  /* ── Container ── */
  .container {
    width: 100%;
    margin-inline: auto;
    max-width: 1360px;
    padding: 20px 24px 80px;
    animation: fadeSlideUp 0.7s ease both;
  }

  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ── Bento Grid ── */
  .bento-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
    grid-auto-flow: dense;
  }

  /* ── Bento Card ── */
  .card {
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid rgba(255, 255, 255, 0.07);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4);
    position: relative;
    overflow: hidden;
  }
  .bento-card {
    --card-accent: #60a5fa;
    cursor: pointer;
    min-height: 200px;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transform: translateY(30px);
    transition:
      opacity 0.6s cubic-bezier(0.22, 1, 0.36, 1),
      transform 0.6s cubic-bezier(0.22, 1, 0.36, 1),
      border-color 0.3s ease,
      box-shadow 0.3s ease;
  }
  .bento-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .bento-card.visible {
    opacity: 1;
    transform: translateY(0);
  }
  .bento-card:hover,
  .bento-card.visible:hover {
    transform: translateY(-6px);
    border-color: var(--card-accent);
    box-shadow:
      0 20px 60px rgba(0, 0, 0, 0.45),
      0 0 30px color-mix(in srgb, var(--card-accent) 15%, transparent);
  }
  .bento-card:focus-visible {
    outline: 2px solid var(--card-accent);
    outline-offset: 2px;
  }

  /* Accent stripe */
  .card-accent-stripe {
    height: 4px;
    background: linear-gradient(
      90deg,
      var(--card-accent),
      color-mix(in srgb, var(--card-accent) 40%, transparent)
    );
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  /* Inner glow orb */
  .card-glow-orb {
    position: absolute;
    top: 0;
    right: 0;
    width: 180px;
    height: 180px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--card-accent), transparent 70%);
    opacity: 0.06;
    pointer-events: none;
    transform: translate(30%, -30%);
    transition: opacity 0.3s ease;
    z-index: 0;
  }
  .bento-card:hover .card-glow-orb {
    opacity: 0.12;
  }
  .bento-hero .card-glow-orb {
    width: 280px;
    height: 280px;
    opacity: 0.08;
  }
  .bento-hero:hover .card-glow-orb {
    opacity: 0.15;
  }

  /* Card inner content */
  .card-inner {
    padding: 24px 24px 20px;
    display: flex;
    flex-direction: column;
    flex: 1;
    position: relative;
    z-index: 1;
  }

  /* Badge (icon + label) */
  .card-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 14px;
  }
  .badge-icon {
    font-size: 22px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: 10px;
    background: color-mix(in srgb, var(--card-accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--card-accent) 25%, transparent);
    flex-shrink: 0;
  }
  .badge-label {
    font-size: 12px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: var(--card-accent);
  }

  /* Question text */
  .card-question {
    font-size: 18px;
    font-weight: 700;
    line-height: 1.4;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Answer preview */
  .card-answer {
    margin-top: 10px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--muted);
    flex: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  /* Click hint */
  .card-hint {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid rgba(255, 255, 255, 0.06);
    opacity: 0;
    transform: translateY(4px);
    transition:
      opacity 0.25s ease,
      transform 0.25s ease;
  }
  .bento-card:hover .card-hint {
    opacity: 1;
    transform: translateY(0);
  }
  .hint-text {
    font-size: 12px;
    font-weight: 500;
    color: var(--muted);
    letter-spacing: 0.3px;
  }
  .hint-arrow {
    color: var(--card-accent);
    transition: transform 0.2s ease;
  }
  .bento-card:hover .hint-arrow {
    transform: translateX(3px);
  }

  /* ── Card Sizes ── */
  .bento-hero {
    min-height: 240px;
  }
  .bento-hero .card-question {
    font-size: 22px;
    -webkit-line-clamp: 2;
    line-clamp: 2;
  }
  .bento-hero .card-answer {
    -webkit-line-clamp: 4;
    line-clamp: 4;
    font-size: 15px;
  }
  .bento-hero .badge-icon {
    width: 44px;
    height: 44px;
    font-size: 26px;
    border-radius: 12px;
  }
  .bento-hero .badge-label {
    font-size: 13px;
  }

  .bento-wide {
    min-height: 200px;
  }
  .bento-wide .card-question {
    font-size: 20px;
    -webkit-line-clamp: 2;
    line-clamp: 2;
  }
  .bento-wide .card-answer {
    -webkit-line-clamp: 3;
    line-clamp: 3;
    font-size: 15px;
  }

  /* ── Modal Overlay ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 2000;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    visibility: hidden;
    transition:
      opacity 0.3s ease,
      visibility 0.3s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    visibility: visible;
  }
  .modal-panel {
    position: relative;
    width: 100%;
    max-width: 640px;
    max-height: 85vh;
    overflow-y: auto;
    border-radius: 20px;
    border: 1px solid var(--panel-border);
    background: linear-gradient(170deg, rgba(15, 18, 35, 0.97) 0%, rgba(8, 10, 22, 0.98) 100%);
    box-shadow:
      0 40px 100px rgba(0, 0, 0, 0.6),
      0 0 60px rgba(96, 165, 250, 0.08);
    transform: scale(0.95) translateY(10px);
    transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .modal-overlay.active .modal-panel {
    transform: scale(1) translateY(0);
  }
  .modal-close {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    background: rgba(255, 255, 255, 0.05);
    color: var(--muted);
    font-size: 22px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition:
      background 0.2s,
      color 0.2s;
    z-index: 1;
    line-height: 1;
  }
  .modal-close:hover {
    background: rgba(239, 68, 68, 0.15);
    color: #fca5a5;
    border-color: rgba(239, 68, 68, 0.3);
  }
  .modal-accent-stripe {
    height: 4px;
    border-radius: 20px 20px 0 0;
  }
  .modal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 24px 28px 0;
  }
  .modal-icon {
    font-size: 28px;
    line-height: 1;
  }
  .modal-label {
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .modal-question {
    padding: 14px 28px 0;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.35;
    color: var(--text);
  }
  .modal-divider {
    margin: 18px 28px;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent,
      rgba(255, 255, 255, 0.1) 20%,
      rgba(255, 255, 255, 0.1) 80%,
      transparent
    );
  }
  .modal-answer {
    padding: 0 28px 28px;
    font-size: 16px;
    line-height: 1.8;
    color: #94a3b8;
  }

  /* ── Responsive ── */
  @media (min-width: 768px) {
    .bento-grid {
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }
    .bento-hero,
    .bento-wide {
      grid-column: span 2;
    }
  }
  @media (min-width: 1024px) {
    .bento-grid {
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .bento-hero,
    .bento-wide {
      grid-column: span 2;
    }
    .bento-hero {
      min-height: 270px;
    }
    .bento-hero .card-question {
      font-size: 26px;
    }
    .card-question {
      font-size: 20px;
    }
    .card-inner {
      padding: 28px 28px 22px;
    }
    .modal-question {
      font-size: 28px;
    }
    .modal-answer {
      font-size: 17px;
    }
  }
</style>
{% endblock %} {% block body %}
<body>
  <div id="navbar-slot"></div>

  <div
    class="dot-grid"
    aria-hidden="true"
  ></div>
  <div
    class="spotlight"
    id="spotlight"
    aria-hidden="true"
  ></div>
  <div
    class="blobs"
    aria-hidden="true"
  >
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div
    class="noise"
    aria-hidden="true"
  ></div>

  <div
    class="modal-overlay"
    id="modalOverlay"
  >
    <div
      class="modal-panel"
      id="modalPanel"
    >
      <button
        class="modal-close"
        id="modalClose"
        aria-label="Close"
      >
        &times;
      </button>
      <div
        class="modal-accent-stripe"
        id="modalStripe"
      ></div>
      <div class="modal-header">
        <span
          class="modal-icon"
          id="modalIcon"
        ></span>
        <span
          class="modal-label"
          id="modalLabel"
        ></span>
      </div>
      <h2
        class="modal-question"
        id="modalQuestion"
      ></h2>
      <div class="modal-divider"></div>
      <p
        class="modal-answer"
        id="modalAnswer"
      ></p>
    </div>
  </div>

  <div class="page-wrap">
    <div class="admin-header">
      <div class="admin-eyebrow">Information</div>
      <div class="admin-title">Regulations</div>
      <div class="admin-subtitle">
        Frequently asked questions and official rules for FMI{Codes} 2026.
      </div>
    </div>

    <div class="container">
      <div
        id="regulationsGrid"
        class="bento-grid"
      ></div>
      <div
        id="emptyState"
        style="
          display: none;
          color: var(--muted);
          text-align: center;
          padding: 40px 0;
          font-size: 16px;
        "
      >
        <div style="font-size: 48px; margin-bottom: 16px">📜</div>
        No regulations found.
      </div>
    </div>

    <script>
      const CARD_META = [
        { icon: '🎯', label: 'The Event', size: 'hero', accent: '#60a5fa' },
        { icon: '🎓', label: 'Eligibility', size: 'normal', accent: '#22d3ee' },
        { icon: '📝', label: 'Registration', size: 'normal', accent: '#a78bfa' },
        { icon: '👥', label: 'Teams', size: 'normal', accent: '#f472b6' },
        { icon: '💻', label: 'Development', size: 'wide', accent: '#60a5fa' },
        { icon: '🏢', label: 'Venue', size: 'normal', accent: '#22d3ee' },
        { icon: '⚖️', label: 'Responsibility', size: 'normal', accent: '#a78bfa' },
        { icon: '🚫', label: 'Disqualification', size: 'normal', accent: '#f472b6' },
        { icon: '🧑‍🏫', label: 'Mentors', size: 'normal', accent: '#60a5fa' },
        { icon: '🎤', label: 'Presentations', size: 'normal', accent: '#22d3ee' },
        { icon: '📊', label: 'Scoring', size: 'wide', accent: '#a78bfa' },
        { icon: '🏆', label: 'Prizes', size: 'hero', accent: '#f472b6' },
        { icon: '🔒', label: 'Privacy', size: 'normal', accent: '#60a5fa' },
      ];

      function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
      }

      function openModal(item, meta) {
        const overlay = document.getElementById('modalOverlay');
        const panel = document.getElementById('modalPanel');
        document.getElementById('modalStripe').style.background =
          'linear-gradient(90deg, ' + meta.accent + ', ' + meta.accent + '44)';
        document.getElementById('modalIcon').textContent = meta.icon;
        document.getElementById('modalLabel').textContent = meta.label;
        document.getElementById('modalLabel').style.color = meta.accent;
        document.getElementById('modalQuestion').textContent = item.question || '';
        document.getElementById('modalAnswer').textContent = item.answer || '';
        overlay.classList.add('active');
        document.body.style.overflow = 'hidden';
      }

      function closeModal() {
        const overlay = document.getElementById('modalOverlay');
        overlay.classList.remove('active');
        document.body.style.overflow = '';
      }

      document.getElementById('modalClose').addEventListener('click', closeModal);
      document.getElementById('modalOverlay').addEventListener('click', function (e) {
        if (e.target === this) closeModal();
      });
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closeModal();
      });

      async function loadRegulations() {
        const grid = document.getElementById('regulationsGrid');
        const empty = document.getElementById('emptyState');
        grid.innerHTML = '';
        empty.style.display = 'none';

        try {
          const res = await fetch('/api/regulations');
          const data = await res.json();
          const list =
            data && data.success && Array.isArray(data.regulations) ? data.regulations : [];

          if (list.length === 0) {
            empty.style.display = 'block';
            return;
          }

          list.forEach((item, idx) => {
            const meta = CARD_META[idx] || {
              icon: '📄',
              label: 'Info',
              size: 'normal',
              accent: '#60a5fa',
            };

            const card = document.createElement('div');
            card.className = 'card bento-card bento-' + meta.size;
            card.style.setProperty('--card-accent', meta.accent);
            card.setAttribute('tabindex', '0');
            card.setAttribute('role', 'button');

            card.innerHTML =
              '<div class="card-accent-stripe"></div>' +
              '<div class="card-inner">' +
              '<div class="card-badge">' +
              '<span class="badge-icon">' +
              meta.icon +
              '</span>' +
              '<span class="badge-label">' +
              escapeHtml(meta.label) +
              '</span>' +
              '</div>' +
              '<div class="card-question">' +
              escapeHtml(item.question || '') +
              '</div>' +
              '<div class="card-answer">' +
              escapeHtml(item.answer || '') +
              '</div>' +
              '<div class="card-hint">' +
              '<span class="hint-text">Click to read more</span>' +
              '<svg class="hint-arrow" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10m0 0L9 4m4 4L9 12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>' +
              '</div>' +
              '</div>' +
              '<div class="card-glow-orb"></div>';

            card.addEventListener('click', function () {
              openModal(item, meta);
            });
            card.addEventListener('keydown', function (e) {
              if (e.key === 'Enter' || e.key === ' ') {
                e.preventDefault();
                openModal(item, meta);
              }
            });

            grid.appendChild(card);
          });

          const observer = new IntersectionObserver(
            function (entries) {
              entries.forEach(function (entry) {
                if (entry.isIntersecting) {
                  entry.target.classList.add('visible');
                  observer.unobserve(entry.target);
                }
              });
            },
            { threshold: 0.1, rootMargin: '0px 0px -40px 0px' },
          );

          grid.querySelectorAll('.bento-card').forEach(function (card, i) {
            card.style.transitionDelay = i * 80 + 'ms';
            observer.observe(card);
          });
        } catch (e) {
          empty.innerHTML =
            '<div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>Error loading regulations. Please try again.';
          empty.style.display = 'block';
        }
      }

      document.addEventListener('DOMContentLoaded', loadRegulations);
    </script>
    <script>
      function ensureMentorLink(text, href) {
        const navLinks = document.querySelector('.nav-links');
        if (!navLinks) return;
        let link = document.querySelector('.nav-links .mentor-link');
        if (!link) {
          link = document.createElement('a');
          link.className = 'nav-link mentor-link';
          navLinks.appendChild(link);
        }
        link.textContent = text;
        link.href = href;
      }

      async function setMentorLinkBySelection() {
        try {
          const res = await fetch('/api/mentors/available');
          if (!res.ok) return;
          const data = await res.json();
          const selectedCount = Array.isArray(data.selected) ? data.selected.length : 0;
          if (selectedCount > 0) {
            ensureMentorLink('Selected Mentors', '/selectedMentors');
          } else {
            ensureMentorLink('Choose Mentor', '/chooseMentor');
          }
        } catch {}
      }

      function updateNavbar() {
        const teamName = window.loggedInTeam || '';
        const navActions = document.querySelector('.nav-actions');
        if (!navActions) return;
        if (teamName) {
          navActions.innerHTML = `
          <button onclick="logout()" class="login-btn" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">Logout</button>
        `;
          setMentorLinkBySelection();
        }
      }
      async function loadNavbar() {
        try {
          const res = await fetch('/navbar.html');
          if (!res.ok) return;
          const html = await res.text();
          const slot = document.getElementById('navbar-slot');
          if (!slot) return;
          slot.innerHTML = html;
          slot.querySelectorAll('script').forEach((old) => {
            const s = document.createElement('script');
            s.textContent = old.textContent;
            document.head.appendChild(s);
            s.remove();
          });
        } catch {}
      }
      async function logout() {
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          if (response.ok) window.location.reload();
        } catch (error) {
          console.error('Logout failed:', error);
        }
      }
      loadNavbar().then(updateNavbar);
    </script>
  </div>

  <script>
    document.addEventListener('mousemove', (e) => {
      const s = document.getElementById('spotlight');
      if (s) {
        s.style.setProperty('--mx', e.clientX + 'px');
        s.style.setProperty('--my', e.clientY + 'px');
      }
    });
  </script>
</body>
{% endblock %}
