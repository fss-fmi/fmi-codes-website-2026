<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — FMI Codes</title>
  </head>
  <body>
    <div id="navbar-slot"></div>
    <div class="container">
      <div class="form-card">
        <h1>Login</h1>
        <p class="subtitle">Sign in to your account</p>

        <div id="error-msg" class="error-msg" style="display: none"></div>

        <div class="role-toggle">
          <button type="button" class="role-btn active" data-role="participant">Participant</button>
          <button type="button" class="role-btn" data-role="mentor">Mentor</button>
          <button type="button" class="role-btn" data-role="admin">Admin</button>
        </div>

        <form id="loginForm" autocomplete="off">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="your@email.com" />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              placeholder="Your password"
            />
          </div>
          <button type="submit" class="submit-btn">Login</button>
        </form>

        <p class="alt-action">Don't have an account? <a href="/registration">Register here</a></p>
      </div>
    </div>

    <script>
      let selectedRole = 'participant';

      async function loadNavbar() {
        try {
          const res = await fetch('/navbar.html');
          if (!res.ok) return;
          const html = await res.text();
          const slot = document.getElementById('navbar-slot');
          if (!slot) return;
          slot.innerHTML = html;
          slot.querySelectorAll('script').forEach((old) => {
            const s = document.createElement('script');
            s.textContent = old.textContent;
            document.head.appendChild(s);
            s.remove();
          });
        } catch {}
      }
      loadNavbar();

      // Role toggle
      document.querySelectorAll('.role-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.role-btn').forEach((b) => b.classList.remove('active'));
          btn.classList.add('active');
          selectedRole = btn.dataset.role;
        });
      });

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('error-msg');
        errEl.style.display = 'none';

        const body = {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          role: selectedRole,
        };

        try {
          const res = await fetch('/api/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.role);
            localStorage.setItem('user_id', data.user_id);
            if (data.role === 'admin') window.location.href = '/admin/matching';
            else if (data.role === 'mentor') window.location.href = '/mentorDashboard';
            else window.location.href = '/team';
          } else {
            errEl.textContent = data.error || 'Login failed';
            errEl.style.display = 'block';
          }
        } catch (err) {
          errEl.textContent = 'Network error. Please try again.';
          errEl.style.display = 'block';
        }
      });
    </script>
  </body>
</html>

<style>
  :root {
    --bg: #060910;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #60a5fa;
    --accent-2: #22d3ee;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:
      radial-gradient(circle at 18% 22%, rgba(96, 165, 250, 0.12), transparent 40%),
      radial-gradient(circle at 82% 6%, rgba(34, 211, 238, 0.12), transparent 38%), var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 16px 28px;
  }
  .container {
    width: 100%;
    max-width: 440px;
    margin: 0 auto;
  }
  .form-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 15px;
  }
  .role-toggle {
    display: flex;
    gap: 8px;
    margin-bottom: 24px;
  }
  .role-btn {
    flex: 1;
    padding: 10px 12px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .role-btn.active {
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    color: #0b1021;
    border-color: transparent;
  }
  .role-btn:hover:not(.active) {
    border-color: var(--accent);
    color: var(--text);
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    border-color: var(--accent);
  }
  .submit-btn {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 8px;
    color: #0b1021;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition:
      transform 0.2s,
      box-shadow 0.2s;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
  }
  .error-msg {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .alt-action {
    text-align: center;
    margin-top: 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .alt-action a {
    color: var(--accent);
    text-decoration: none;
  }
  .alt-action a:hover {
    text-decoration: underline;
  }
  @media (max-width: 500px) {
    .form-card {
      padding: 28px 20px;
    }
  }
</style>
