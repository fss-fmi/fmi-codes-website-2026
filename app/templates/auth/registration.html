<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — FMI Codes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #050816;
        --bg-card: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.06);
        --border-glow: rgba(96, 165, 250, 0.25);
        --text: #e2e8f0;
        --muted: #64748b;
        --accent: #60a5fa;
        --accent-2: #22d3ee;
        --purple: #a78bfa;
        --pink: #f472b6;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        -webkit-font-smoothing: antialiased;
      }

      .dot-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
        -webkit-mask-image: radial-gradient(
          ellipse 80% 60% at 50% 40%,
          black 30%,
          transparent 100%
        );
      }
      .spotlight {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
          600px circle at var(--mx, 50%) var(--my, 30%),
          rgba(96, 165, 250, 0.07),
          rgba(34, 211, 238, 0.04) 40%,
          transparent 70%
        );
        transition: background 0.3s ease;
      }
      .blobs {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.15;
        will-change: transform;
      }
      .blob-1 {
        width: 700px;
        height: 700px;
        background: #60a5fa;
        top: -15%;
        left: -10%;
        animation: blobFloat1 18s ease-in-out infinite;
      }
      .blob-2 {
        width: 500px;
        height: 500px;
        background: #22d3ee;
        top: 40%;
        right: -12%;
        animation: blobFloat2 22s ease-in-out infinite;
      }
      .blob-3 {
        width: 450px;
        height: 450px;
        background: #a78bfa;
        bottom: -10%;
        left: 25%;
        animation: blobFloat3 20s ease-in-out infinite;
      }
      @keyframes blobFloat1 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(120px, 80px) scale(1.1);
        }
      }
      @keyframes blobFloat2 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-80px, -60px) scale(1.15);
        }
      }
      @keyframes blobFloat3 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(70px, -50px) scale(1.08);
        }
      }
      .noise {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 128px 128px;
      }
      .page-wrap {
        position: relative;
        z-index: 2;
        width: 100%;
      }

      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .container {
        width: 100%;
        max-width: 560px;
        margin: 0 auto;
        padding: 72px 16px 60px;
      }
      .form-card {
        position: relative;
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 40px 36px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(12px);
        animation: fadeSlideUp 0.8s ease both;
        overflow: hidden;
      }
      h1 {
        font-size: 28px;
        font-weight: 700;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 8px;
      }
      .subtitle {
        color: var(--muted);
        margin-bottom: 24px;
        font-size: 15px;
      }
      .form-row {
        display: flex;
        gap: 16px;
      }
      .form-row .form-group {
        flex: 1;
      }
      .form-group {
        margin-bottom: 18px;
      }
      .form-group label {
        display: block;
        font-size: 14px;
        color: var(--muted);
        margin-bottom: 6px;
      }
      .form-group input,
      .form-group select {
        width: 100%;
        padding: 12px 14px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        font-family: inherit;
        font-size: 15px;
        outline: none;
        transition: border-color 0.2s;
      }
      .form-group input:focus,
      .form-group select:focus {
        border-color: var(--accent);
      }
      .form-group select option {
        background: #0b1021;
        color: var(--text);
      }
      .form-group select optgroup {
        background: #0b1021;
        color: var(--accent);
        font-style: normal;
        font-weight: 600;
      }
      .submit-btn {
        width: 100%;
        padding: 14px;
        margin-top: 8px;
        background: linear-gradient(120deg, var(--accent), var(--accent-2));
        border: none;
        border-radius: 8px;
        color: #0b1021;
        font-family: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        position: relative;
        overflow: hidden;
      }
      .submit-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
      }
      .submit-btn::after {
        content: '';
        position: absolute;
        top: -50%;
        left: -60%;
        width: 200%;
        height: 200%;
        background: linear-gradient(
          120deg,
          transparent 30%,
          rgba(255, 255, 255, 0.15) 50%,
          transparent 70%
        );
        transform: rotate(25deg);
        transition: left 0.6s ease;
      }
      .submit-btn:hover::after {
        left: 120%;
      }
      .error-msg {
        background: rgba(239, 68, 68, 0.15);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #fca5a5;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .success-msg {
        background: rgba(34, 197, 94, 0.15);
        border: 1px solid rgba(34, 197, 94, 0.3);
        color: #86efac;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .alt-action {
        text-align: center;
        margin-top: 20px;
        color: var(--muted);
        font-size: 14px;
      }
      .alt-action a {
        color: var(--accent);
        text-decoration: none;
      }
      .alt-action a:hover {
        text-decoration: underline;
      }
      @media (max-width: 500px) {
        .form-row {
          flex-direction: column;
          gap: 0;
        }
        .form-card {
          padding: 28px 20px;
        }
        .container {
          padding: 100px 12px 40px;
        }
      }
    </style>
  </head>
  <body>
    <div class="dot-grid"></div>
    <div class="spotlight" id="spotlight"></div>
    <div class="blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="noise"></div>

    <div class="page-wrap">
      <div id="navbar-slot"></div>
      <div class="container">
        <div class="form-card">
          <h1>Participant Registration</h1>
          <p class="subtitle">Create your account to join the hackathon</p>

          <div id="error-msg" class="error-msg" style="display: none"></div>
          <div id="success-msg" class="success-msg" style="display: none"></div>

          <form id="registerForm" autocomplete="off">
            <div class="form-row">
              <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" name="first_name" required placeholder="Ivan" />
              </div>
              <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" name="last_name" required placeholder="Ivanov" />
              </div>
            </div>

            <div class="form-group">
              <label for="email">Email</label>
              <input type="email" id="email" name="email" required placeholder="ivan@example.com" />
            </div>

            <div class="form-group">
              <label for="password">Password</label>
              <input
                type="password"
                id="password"
                name="password"
                required
                minlength="6"
                placeholder="Min 6 characters"
              />
            </div>

            <div class="form-group">
              <label for="phone_number">Phone Number</label>
              <input
                type="tel"
                id="phone_number"
                name="phone_number"
                required
                placeholder="+359..."
              />
            </div>

            <div class="form-row">
              <div class="form-group">
                <label for="faculty_number">Faculty Number</label>
                <input
                  type="text"
                  id="faculty_number"
                  name="faculty_number"
                  required
                  placeholder="e.g. 1MI0700123"
                />
              </div>
              <div class="form-group">
                <label for="course">Course Year</label>
                <select id="course" name="course" required>
                  <option value="">Select</option>
                  <optgroup label="Bachelor">
                    <option value="Bachelor 1st Year">Bachelor 1st Year</option>
                    <option value="Bachelor 2nd Year">Bachelor 2nd Year</option>
                    <option value="Bachelor 3rd Year">Bachelor 3rd Year</option>
                    <option value="Bachelor 4th Year">Bachelor 4th Year</option>
                  </optgroup>
                  <optgroup label="Masters">
                    <option value="Masters 1st Year">Masters 1st Year</option>
                    <option value="Masters 2nd Year">Masters 2nd Year</option>
                    <option value="Masters 3rd Year">Masters 3rd Year</option>
                    <option value="Masters 4th Year">Masters 4th Year</option>
                    <option value="Masters 5th Year">Masters 5th Year</option>
                    <option value="Masters 6th Year">Masters 6th Year</option>
                  </optgroup>
                </select>
              </div>
            </div>

            <div class="form-group">
              <label for="university_id">University</label>
              <select id="university_id" name="university_id" required>
                <option value="">Loading...</option>
              </select>
            </div>

            <!-- Hidden fields for "Other" university -->
            <div id="other-uni-fields" style="display: none">
              <div class="form-group">
                <label for="other_uni_name">University Name</label>
                <input type="text" id="other_uni_name" placeholder="e.g. My University" />
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label for="other_uni_city">City</label>
                  <input type="text" id="other_uni_city" placeholder="e.g. Sofia" />
                </div>
                <div class="form-group">
                  <label for="other_uni_country">Country</label>
                  <input type="text" id="other_uni_country" placeholder="e.g. Bulgaria" />
                </div>
              </div>
            </div>

            <div class="form-group">
              <label for="specialty_id">Specialty</label>
              <select id="specialty_id" name="specialty_id" required>
                <option value="">Loading...</option>
              </select>
            </div>

            <!-- Hidden field for "Other" specialty -->
            <div id="other-spec-fields" style="display: none">
              <div class="form-group">
                <label for="other_spec_name">Specialty Name</label>
                <input type="text" id="other_spec_name" placeholder="e.g. Robotics" />
              </div>
            </div>

            <button type="submit" class="submit-btn">Register</button>
          </form>

          <p class="alt-action">Already have an account? <a href="/login">Login here</a></p>
        </div>
      </div>
    </div>
    <!-- /page-wrap -->

    <script>
      /* Spotlight tracking */
      document.addEventListener('mousemove', (e) => {
        const s = document.getElementById('spotlight');
        if (s) {
          s.style.setProperty('--mx', e.clientX + 'px');
          s.style.setProperty('--my', e.clientY + 'px');
        }
      });

      async function loadNavbar() {
        try {
          const res = await fetch('/navbar.html');
          if (!res.ok) return;
          const html = await res.text();
          const slot = document.getElementById('navbar-slot');
          if (!slot) return;
          slot.innerHTML = html;
          slot.querySelectorAll('script').forEach((old) => {
            const s = document.createElement('script');
            s.textContent = old.textContent;
            document.head.appendChild(s);
            s.remove();
          });
        } catch {}
      }
      loadNavbar();

      // Load dropdowns from API (only seed data shown)
      (async () => {
        try {
          const [uniRes, specRes] = await Promise.all([
            fetch('/api/universities').then((r) => r.json()),
            fetch('/api/specialties').then((r) => r.json()),
          ]);

          const uniSel = document.getElementById('university_id');
          if (uniRes.success) {
            uniSel.innerHTML =
              '<option value="">Select university</option>' +
              uniRes.universities
                .map((u) => `<option value="${u.id}">${u.name}</option>`)
                .join('') +
              '<option value="other">Other (add your own)</option>';
          } else {
            uniSel.innerHTML = '<option value="">Failed to load</option>';
          }

          const specSel = document.getElementById('specialty_id');
          if (specRes.success) {
            specSel.innerHTML =
              '<option value="">Select specialty</option>' +
              specRes.specialties
                .map((s) => `<option value="${s.id}">${s.name}</option>`)
                .join('') +
              '<option value="other">Other (add your own)</option>';
          } else {
            specSel.innerHTML = '<option value="">Failed to load</option>';
          }
        } catch {
          document.getElementById('university_id').innerHTML =
            '<option value="">Failed to load</option>';
          document.getElementById('specialty_id').innerHTML =
            '<option value="">Failed to load</option>';
        }
      })();

      // Toggle "Other" fields visibility
      document.getElementById('university_id').addEventListener('change', (e) => {
        document.getElementById('other-uni-fields').style.display =
          e.target.value === 'other' ? 'block' : 'none';
      });
      document.getElementById('specialty_id').addEventListener('change', (e) => {
        document.getElementById('other-spec-fields').style.display =
          e.target.value === 'other' ? 'block' : 'none';
      });

      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('error-msg');
        const sucEl = document.getElementById('success-msg');
        errEl.style.display = 'none';
        sucEl.style.display = 'none';

        let universityId = document.getElementById('university_id').value;
        let specialtyId = document.getElementById('specialty_id').value;

        try {
          // Handle "Other" university — create it first
          if (universityId === 'other') {
            const uniName = document.getElementById('other_uni_name').value.trim();
            const uniCity = document.getElementById('other_uni_city').value.trim();
            const uniCountry = document.getElementById('other_uni_country').value.trim();
            if (!uniName || !uniCity || !uniCountry) {
              errEl.textContent = 'Please fill in the university name, city, and country.';
              errEl.style.display = 'block';
              return;
            }
            const uniRes = await fetch('/api/universities', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: uniName, city: uniCity, country: uniCountry }),
            });
            const uniData = await uniRes.json();
            if (!uniData.success) {
              errEl.textContent = uniData.error || 'Failed to create university';
              errEl.style.display = 'block';
              return;
            }
            universityId = uniData.id;
          }

          // Handle "Other" specialty — create it first
          if (specialtyId === 'other') {
            const specName = document.getElementById('other_spec_name').value.trim();
            if (!specName) {
              errEl.textContent = 'Please fill in the specialty name.';
              errEl.style.display = 'block';
              return;
            }
            const specRes = await fetch('/api/specialties', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ name: specName }),
            });
            const specData = await specRes.json();
            if (!specData.success) {
              errEl.textContent = specData.error || 'Failed to create specialty';
              errEl.style.display = 'block';
              return;
            }
            specialtyId = specData.id;
          }

          const body = {
            first_name: document.getElementById('first_name').value.trim(),
            last_name: document.getElementById('last_name').value.trim(),
            email: document.getElementById('email').value.trim(),
            password: document.getElementById('password').value,
            phone_number: document.getElementById('phone_number').value.trim(),
            faculty_number: document.getElementById('faculty_number').value.trim(),
            course: document.getElementById('course').value,
            university_id: universityId,
            specialty_id: specialtyId,
          };

          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.role);
            localStorage.setItem('user_id', data.user_id);
            sucEl.textContent = 'Registration successful! Redirecting...';
            sucEl.style.display = 'block';
            setTimeout(() => (window.location.href = '/team'), 1000);
          } else {
            errEl.textContent = data.error || 'Registration failed';
            errEl.style.display = 'block';
          }
        } catch (err) {
          errEl.textContent = 'Network error. Please try again.';
          errEl.style.display = 'block';
        }
      });
    </script>
  </body>
</html>
