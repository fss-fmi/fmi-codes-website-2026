<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register — FMI Codes</title>
  </head>
  <body>
    <div id="navbar-slot"></div>
    <div class="container">
      <div class="form-card">
        <h1>Participant Registration</h1>
        <p class="subtitle">Create your account to join the hackathon</p>

        <div id="error-msg" class="error-msg" style="display: none"></div>
        <div id="success-msg" class="success-msg" style="display: none"></div>

        <form id="registerForm" autocomplete="off">
          <div class="form-row">
            <div class="form-group">
              <label for="first_name">First Name</label>
              <input type="text" id="first_name" name="first_name" required placeholder="Ivan" />
            </div>
            <div class="form-group">
              <label for="last_name">Last Name</label>
              <input type="text" id="last_name" name="last_name" required placeholder="Ivanov" />
            </div>
          </div>

          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" required placeholder="ivan@example.com" />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              name="password"
              required
              minlength="6"
              placeholder="Min 6 characters"
            />
          </div>

          <div class="form-group">
            <label for="phone_number">Phone Number</label>
            <input
              type="tel"
              id="phone_number"
              name="phone_number"
              required
              placeholder="+359..."
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="faculty_number">Faculty Number</label>
              <input
                type="text"
                id="faculty_number"
                name="faculty_number"
                required
                placeholder="e.g. 1MI0700123"
              />
            </div>
            <div class="form-group">
              <label for="course">Course Year</label>
              <select id="course" name="course" required>
                <option value="">Select</option>
                <option value="1">1st Year</option>
                <option value="2">2nd Year</option>
                <option value="3">3rd Year</option>
                <option value="4">4th Year</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="university_id">University</label>
            <select id="university_id" name="university_id" required>
              <option value="">Loading...</option>
            </select>
          </div>

          <div class="form-group">
            <label for="specialty_id">Specialty</label>
            <select id="specialty_id" name="specialty_id" required>
              <option value="">Loading...</option>
            </select>
          </div>

          <button type="submit" class="submit-btn">Register</button>
        </form>

        <p class="alt-action">Already have an account? <a href="/login">Login here</a></p>
      </div>
    </div>

    <script>
      async function loadNavbar() {
        try {
          const res = await fetch('/navbar.html');
          if (!res.ok) return;
          const html = await res.text();
          const slot = document.getElementById('navbar-slot');
          if (!slot) return;
          slot.innerHTML = html;
          slot.querySelectorAll('script').forEach((old) => {
            const s = document.createElement('script');
            s.textContent = old.textContent;
            document.head.appendChild(s);
            s.remove();
          });
        } catch {}
      }
      loadNavbar();

      // TODO: update this later to fetch from a new api endpoint to reflect new additions to the db in runtime
      // Load dropdowns (universities & specialties are seed data)
      (async () => {
        // We'll fetch from a simple endpoint. For now, hardcode the seed data options.
        const unis = [
          { id: 1, name: 'Sofia University "St. Kliment Ohridski"' },
          { id: 2, name: 'Technical University of Sofia' },
          { id: 3, name: 'University of Plovdiv "Paisii Hilendarski"' },
          { id: 4, name: 'Vasil Levski Military Academy' },
          { id: 5, name: 'American University in Bulgaria' },
          { id: 6, name: 'New Bulgarian University' },
        ];
        const specs = [
          { id: 1, name: 'Web Development' },
          { id: 2, name: 'AI/Machine Learning' },
          { id: 3, name: 'DevOps/Cloud' },
          { id: 4, name: 'Mobile Development' },
          { id: 5, name: 'Data Science' },
          { id: 6, name: 'Cybersecurity' },
          { id: 7, name: 'Blockchain/Web3' },
          { id: 8, name: 'Software Engineering' },
        ];
        const uniSel = document.getElementById('university_id');
        uniSel.innerHTML =
          '<option value="">Select university</option>' +
          unis.map((u) => `<option value="${u.id}">${u.name}</option>`).join('');
        const specSel = document.getElementById('specialty_id');
        specSel.innerHTML =
          '<option value="">Select specialty</option>' +
          specs.map((s) => `<option value="${s.id}">${s.name}</option>`).join('');
      })();

      document.getElementById('registerForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errEl = document.getElementById('error-msg');
        const sucEl = document.getElementById('success-msg');
        errEl.style.display = 'none';
        sucEl.style.display = 'none';

        const body = {
          first_name: document.getElementById('first_name').value.trim(),
          last_name: document.getElementById('last_name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          phone_number: document.getElementById('phone_number').value.trim(),
          faculty_number: document.getElementById('faculty_number').value.trim(),
          course: document.getElementById('course').value,
          university_id: document.getElementById('university_id').value,
          specialty_id: document.getElementById('specialty_id').value,
        };

        try {
          const res = await fetch('/api/auth/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body),
          });
          const data = await res.json();
          if (data.success) {
            localStorage.setItem('token', data.token);
            localStorage.setItem('role', data.role);
            localStorage.setItem('user_id', data.user_id);
            sucEl.textContent = 'Registration successful! Redirecting...';
            sucEl.style.display = 'block';
            setTimeout(() => (window.location.href = '/team'), 1000);
          } else {
            errEl.textContent = data.error || 'Registration failed';
            errEl.style.display = 'block';
          }
        } catch (err) {
          errEl.textContent = 'Network error. Please try again.';
          errEl.style.display = 'block';
        }
      });
    </script>
  </body>
</html>

<style>
  :root {
    --bg: #060910;
    --panel: rgba(255, 255, 255, 0.04);
    --panel-border: rgba(255, 255, 255, 0.08);
    --text: #e5e7eb;
    --muted: #9ca3af;
    --accent: #60a5fa;
    --accent-2: #22d3ee;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background:
      radial-gradient(circle at 18% 22%, rgba(96, 165, 250, 0.12), transparent 40%),
      radial-gradient(circle at 82% 6%, rgba(34, 211, 238, 0.12), transparent 38%), var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 16px 28px;
  }
  .container {
    width: 100%;
    max-width: 560px;
    margin: 0 auto;
  }
  .form-card {
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 16px;
    padding: 40px 36px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  h1 {
    font-size: 28px;
    font-weight: 700;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .subtitle {
    color: var(--muted);
    margin-bottom: 24px;
    font-size: 15px;
  }
  .form-row {
    display: flex;
    gap: 16px;
  }
  .form-row .form-group {
    flex: 1;
  }
  .form-group {
    margin-bottom: 18px;
  }
  .form-group label {
    display: block;
    font-size: 14px;
    color: var(--muted);
    margin-bottom: 6px;
  }
  .form-group input,
  .form-group select {
    width: 100%;
    padding: 12px 14px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    color: var(--text);
    font-size: 15px;
    outline: none;
    transition: border-color 0.2s;
  }
  .form-group input:focus,
  .form-group select:focus {
    border-color: var(--accent);
  }
  .form-group select option {
    background: #0b1021;
    color: var(--text);
  }
  .submit-btn {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 8px;
    color: #0b1021;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition:
      transform 0.2s,
      box-shadow 0.2s;
  }
  .submit-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
  }
  .error-msg {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .success-msg {
    background: rgba(34, 197, 94, 0.15);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #86efac;
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
  }
  .alt-action {
    text-align: center;
    margin-top: 20px;
    color: var(--muted);
    font-size: 14px;
  }
  .alt-action a {
    color: var(--accent);
    text-decoration: none;
  }
  .alt-action a:hover {
    text-decoration: underline;
  }
  @media (max-width: 500px) {
    .form-row {
      flex-direction: column;
      gap: 0;
    }
    .form-card {
      padding: 28px 20px;
    }
  }
</style>
