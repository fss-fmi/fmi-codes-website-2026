<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration</title>
    <style>
        :root {
      --bg: #060910;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --accent-2: #22d3ee;
      --glow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 18% 22%, rgba(96,165,250,0.12), transparent 40%),
                  radial-gradient(circle at 82% 6%, rgba(34, 211, 238, 0.12), transparent 38%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 96px 16px 28px; /* island navbar space, lower bottom padding */
      display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
    }
    .container {
            margin-top: 24px;
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            box-shadow: var(--glow);
            padding: 40px;
            max-width: 1100px;
            width: 100%;
        }

        h1 { text-align: center; margin-bottom: 10px; font-size: 40px; }
        .subtitle { text-align: center; color: var(--muted); margin-bottom: 28px; font-size: 20px; }

        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
        .full { grid-column: 1 / -1; }
        label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 18px; }
        input, select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 8px;
            border: 1px solid var(--panel-border);
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 18px;
        }
        .p-university option {
            color: #000;
        }

        .section-title {
            margin: 24px 0 14px;
            color: var(--accent-2);
            font-weight: 700;
            font-size: 24px;
        }

        .participant-card {
            border: 1px solid var(--panel-border);
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 18px;
            margin-bottom: 16px;
        }

        .actions { display: flex; gap: 12px; margin: 14px 0 22px; }
        button {
            border: 0;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 700;
        }
        .add-btn { background: rgba(34, 197, 94, 0.18); color: #86efac; padding: 13px 18px; border: 1px solid rgba(34,197,94,0.35); font-size: 18px; }
        .remove-btn { background: rgba(239,68,68,0.15); color: #fca5a5; padding: 8px 12px; border: 1px solid rgba(239,68,68,0.35); font-size: 15px; }
        .submit-btn { width: 100%; padding: 16px 18px; background: linear-gradient(120deg, #60a5fa, #22d3ee); color: #0b1021; font-size: 20px; }

        .message { margin-bottom: 16px; padding: 14px; border-radius: 8px; display: none; font-size: 18px; }
        .message.show { display: block; }

        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .container { padding: 22px; }
            body { padding: 92px 12px 36px; }
            .navbar-container { padding: 10px 16px; }
            h1 { font-size: 32px; }
            .subtitle { font-size: 18px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Регистрация</h1>
        <p class="subtitle">Регистрирайте своя екип с 3 до 6 участника</p>

        <div id="message" class="message"></div>

        <form id="registrationForm">
            <div class="grid">
                <div>
                    <label for="teamName">Име на отбор *</label>
                    <input id="teamName" required>
                </div>
                <div>
                    <label for="teamPassword">Парола *</label>
                    <input id="teamPassword" type="password" required>
                </div>
            </div>

            <div class="section-title">Участници</div>
            <div id="participants"></div>

            <div class="actions">
                <button type="button" class="add-btn" id="addBtn">+ Добави Участник</button>
            </div>

            <button type="submit" class="submit-btn">Регистриране</button>
        </form>
    </div>

    <script>
        const minParticipants = 3;
        const maxParticipants = 6;
        const bulgarianUniversities = [
            'Софийски университет „Св. Климент Охридски“',
            'Пловдивски университет „Паисий Хилендарски“',
            'Великотърновски университет „Св. св. Кирил и Методий“',
            'Югозападен университет „Неофит Рилски“',
            'Шуменски университет „Епископ Константин Преславски“',
            'Русенски университет „Ангел Кънчев“',
            'Технически университет – София',
            'Технически университет – Варна',
            'Технически университет – Габрово',
            'Университет по архитектура, строителство и геодезия',
            'Минно-геоложки университет „Св. Иван Рилски“',
            'Химикотехнологичен и металургичен университет',
            'Университет по хранителни технологии – Пловдив',
            'Лесотехнически университет',
            'Аграрен университет – Пловдив',
            'Тракийски университет – Стара Загора',
            'Медицински университет – София',
            'Медицински университет – Пловдив',
            'Медицински университет – Варна',
            'Медицински университет – Плевен',
            'Медицински университет „Проф. д-р Параскев Стоянов“ – Варна',
            'Национална спортна академия „Васил Левски“',
            'Национална художествена академия',
            'Национална музикална академия „Проф. Панчо Владигеров“',
            'НАТФИЗ „Кръстьо Сарафов“',
            'УНСС',
            'Икономически университет – Варна',
            'Стопанска академия „Д. А. Ценов“ – Свищов',
            'Американски университет в България',
            'Нов български университет',
            'Бургаски свободен университет',
            'Варненски свободен университет „Черноризец Храбър“',
            'Висше транспортно училище „Тодор Каблешков“',
            'Висше училище по телекомуникации и пощи',
            'Военна академия „Г. С. Раковски“',
            'Национален военен университет „Васил Левски“',
            'Висше военноморско училище „Н. Й. Вапцаров“',
            'Академия на МВР',
            'Академия за музикално, танцово и изобразително изкуство – Пловдив',
            'Юридически университет (частен) / Висше училище по сигурност и икономика',
            'Университет „Проф. д-р Асен Златаров“ – Бургас',
            'Пернишки университет (Европейски политехнически университет)',
            'Висше строително училище „Любен Каравелов“',
            'Висше училище по мениджмънт',
            'Висше училище по застраховане и финанси',
            'Международно висше бизнес училище',
            'Висше училище по агробизнес и развитие на регионите'
        ];

        function getUniversityOptions() {
            const options = bulgarianUniversities
                .map((name) => `<option value="${name}">${name}</option>`)
                .join('');
            return `<option value="">Изберете университет</option>${options}`;
        }

        function renderParticipant(index) {
                return `
                    <div class="participant-card" data-index="${index}">
                    <div class="grid">
                        <div>
                            <label>Първо име *</label>
                            <input class="p-first" required>
                        </div>
                        <div>
                            <label>Фамилия *</label>
                            <input class="p-last" required>
                        </div>
                        <div>
                            <label>Факултетен номер *</label>
                            <input class="p-fn" required>
                        </div>
                        <div>
                            <label>Discord Username *</label>
                            <input class="p-discord" required>
                        </div>
                        <div>
                            <label>Университет *</label>
                            <select class="p-university" required>
                                ${getUniversityOptions()}
                            </select>
                        </div>
                        <div>
                            <label>Година *</label>
                            <input class="p-year" required>
                        </div>
                        <div>
                            <label>Специалност *</label>
                            <input class="p-degree" required>
                        </div>
                    </div>
                    ${index >= minParticipants ? '<div class="actions"><button type="button" class="remove-btn">Премахни</button></div>' : ''}
                </div>
            `;
        }

        function setupParticipants() {
            const wrap = document.getElementById('participants');
            wrap.innerHTML = '';
            for (let i = 0; i < minParticipants; i++) {
                wrap.insertAdjacentHTML('beforeend', renderParticipant(i));
            }
        }

        function addParticipant() {
            const wrap = document.getElementById('participants');
            const count = wrap.querySelectorAll('.participant-card').length;
            if (count >= maxParticipants) return;
            wrap.insertAdjacentHTML('beforeend', renderParticipant(count));
        }

        function collectParticipants() {
            return Array.from(document.querySelectorAll('.participant-card')).map((card) => ({
                firstName: card.querySelector('.p-first').value.trim(),
                lastName: card.querySelector('.p-last').value.trim(),
                facultyNumber: card.querySelector('.p-fn').value.trim(),
                discord: card.querySelector('.p-discord').value.trim(),
                university: card.querySelector('.p-university').value.trim(),
                year: card.querySelector('.p-year').value.trim(),
                degree: card.querySelector('.p-degree').value.trim()
            }));
        }

        function showMessage(text, isError = false) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.classList.add('show');
            msg.style.background = isError ? 'rgba(239,68,68,0.15)' : 'rgba(34,197,94,0.15)';
            msg.style.color = isError ? '#fca5a5' : '#86efac';
            msg.style.border = isError ? '1px solid rgba(239,68,68,0.35)' : '1px solid rgba(34,197,94,0.35)';
        }

        function validateRegistrationForm(participants) {
            const teamName = document.getElementById('teamName').value.trim();
            const password = document.getElementById('teamPassword').value.trim();

            if (teamName.length < 1) {
                return 'Team name must be at least 1 character.';
            }

            if (password.length < 8) {
                return 'Password must be at least 8 characters.';
            }

            for (let i = 0; i < participants.length; i++) {
                const participant = participants[i];
                const firstNameLength = participant.firstName.length;
                const lastNameLength = participant.lastName.length;

                if (firstNameLength < 2 || firstNameLength > 50) {
                    return `Participant ${i + 1}: First name must be between 2 and 50 characters.`;
                }

                if (lastNameLength < 2 || lastNameLength > 50) {
                    return `Participant ${i + 1}: Surname must be between 2 and 50 characters.`;
                }
            }

            return '';
        }

        document.getElementById('addBtn').addEventListener('click', addParticipant);

        document.getElementById('participants').addEventListener('click', (e) => {
            if (!e.target.classList.contains('remove-btn')) return;
            const cards = document.querySelectorAll('.participant-card');
            if (cards.length <= minParticipants) return;
            e.target.closest('.participant-card').remove();
        });

        document.getElementById('registrationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const participants = collectParticipants();

            if (participants.length < minParticipants || participants.length > maxParticipants) {
                showMessage(`Participants must be between ${minParticipants} and ${maxParticipants}.`, true);
                return;
            }

            const validationError = validateRegistrationForm(participants);
            if (validationError) {
                showMessage(validationError, true);
                return;
            }

            const payload = {
                teamName: document.getElementById('teamName').value.trim(),
                password: document.getElementById('teamPassword').value.trim(),
                participants
            };

            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                if (!res.ok || !data.success) {
                    showMessage(data.error || 'Неуспешна регистрация.', true);
                    return;
                }
                showMessage(data.message || 'Регистрацията е успешна.');
            } catch (err) {
                showMessage('Network error while registering.', true);
            }
        });

        window.addEventListener('DOMContentLoaded', () => {
            setupParticipants();
            loadNavbar();
        });
    </script>
</body>
</html>
