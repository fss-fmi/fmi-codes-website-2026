{% extends "base.html" %} {% block title %}Profile — Mission Control{% endblock %} {% block head %}
<style>
  :root {
    --bg: #050816;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #60a5fa;
    --accent-2: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
    --emerald: #34d399;
    --danger: #ef4444;
    --panel-border: rgba(255, 255, 255, 0.08);
    --card-glow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html {
    scroll-behavior: smooth;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
  }

  /* ── Background layers (Dotted Grid & Original Blob Colors) ── */
  .dot-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
  }
  .spotlight {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(
      600px circle at var(--mx, 50%) var(--my, 30%),
      rgba(96, 165, 250, 0.07),
      rgba(34, 211, 238, 0.04) 40%,
      transparent 70%
    );
    transition: background 0.3s ease;
  }
  .blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.13;
    will-change: transform;
  }
  .blob-1 {
    width: 700px;
    height: 700px;
    background: #7dd3fc;
    top: -15%;
    left: -10%;
    animation: blobFloat1 18s ease-in-out infinite;
  }
  .blob-2 {
    width: 500px;
    height: 500px;
    background: #f9a8d4;
    top: 40%;
    right: -12%;
    animation: blobFloat2 22s ease-in-out infinite;
  }
  .blob-3 {
    width: 450px;
    height: 450px;
    background: #a78bfa;
    bottom: -10%;
    left: 25%;
    animation: blobFloat3 20s ease-in-out infinite;
  }
  @keyframes blobFloat1 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(120px, 80px) scale(1.1);
    }
  }
  @keyframes blobFloat2 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(-80px, -60px) scale(1.15);
    }
  }
  @keyframes blobFloat3 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(70px, -50px) scale(1.08);
    }
  }
  .noise {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 128px 128px;
  }

  .page-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
    padding-top: 76px;
  }

  /* ── Layout ── */
  .profile-container {
    width: 100%;
    max-width: 680px;
    margin: 0 auto;
    padding: 0 24px;
    animation: fadeSlideUp 0.7s ease both;
  }

  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(30px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ── Header ── */
  .admin-header {
    width: 100%;
    padding: 40px 0 32px;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .admin-eyebrow {
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }
  .admin-eyebrow::before,
  .admin-eyebrow::after {
    content: '';
    display: inline-block;
    width: 20px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--purple));
    border-radius: 2px;
  }
  .admin-title {
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 900;
    line-height: 1.2;
    padding-bottom: 0.15em;
    background: linear-gradient(135deg, #60a5fa, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.02em;
  }

  /* ── Glassmorphism Cards ── */
  .card {
    position: relative;
    background: rgba(255, 255, 255, 0.025);
    border: 1px solid var(--panel-border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 24px;
    box-shadow: var(--card-glow);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    overflow: hidden;
    transition:
      transform 0.3s ease,
      border-color 0.3s ease,
      box-shadow 0.3s ease;
  }
  .card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    background: linear-gradient(135deg, rgba(255, 255, 255, 0.04) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }
  .card > * {
    position: relative;
    z-index: 1;
  }
  .card:hover {
    border-color: rgba(96, 165, 250, 0.3);
    box-shadow:
      0 25px 60px rgba(0, 0, 0, 0.5),
      0 0 30px rgba(96, 165, 250, 0.1);
  }

  .card h2 {
    font-size: 20px;
    font-weight: 700;
    margin-bottom: 24px;
    color: var(--text);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ── Info Grid ── */
  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px 16px;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .info-item.full-width {
    grid-column: 1 / -1;
  }
  .info-item .label {
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-weight: 700;
  }
  .info-item .value {
    font-size: 15px;
    color: var(--text);
    word-break: break-word;
    font-weight: 500;
  }

  /* ── Form Elements ── */
  .form-group {
    margin-bottom: 20px;
  }
  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .form-group input {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 15px;
    outline: none;
    transition:
      border-color 0.2s,
      box-shadow 0.2s;
  }
  .form-group input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    margin-top: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    border: none;
    border-radius: 12px;
    color: #0b1021;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition:
      transform 0.2s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(96, 165, 250, 0.3);
  }
  .btn-primary:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(96, 165, 250, 0.45);
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  /* ── Alerts ── */
  .alert {
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 14px;
    font-weight: 500;
    margin-bottom: 20px;
    display: none;
  }
  .alert-error {
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }
  .alert-success {
    background: rgba(52, 211, 153, 0.15);
    border: 1px solid rgba(52, 211, 153, 0.3);
    color: var(--emerald);
  }

  .loading-spinner {
    text-align: center;
    padding: 80px 0;
    color: var(--muted);
    font-size: 15px;
  }

  @media (max-width: 600px) {
    .profile-container {
      padding: 0 16px;
    }
    .info-grid {
      grid-template-columns: 1fr;
    }
    .card {
      padding: 28px 20px;
    }
  }
</style>
{% endblock %} {% block body %}
<body>
  <div id="navbar-slot"></div>

  <div
    class="dot-grid"
    aria-hidden="true"
  ></div>
  <div
    class="spotlight"
    id="spotlight"
    aria-hidden="true"
  ></div>
  <div
    class="blobs"
    aria-hidden="true"
  >
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div
    class="noise"
    aria-hidden="true"
  ></div>

  <div class="page-wrap">
    <div class="profile-container">
      <div
        class="loading-spinner"
        id="loading"
      >
        <div style="font-size: 32px; margin-bottom: 12px; animation: spin 1s linear infinite">
          ⏳
        </div>
        Loading profile…
      </div>

      <div
        id="profile-content"
        style="display: none"
      >
        <div class="admin-header">
          <div
            class="admin-eyebrow"
            id="profile-role"
          >
            User
          </div>
          <div
            class="admin-title"
            id="profile-name"
          ></div>
        </div>

        <div class="card">
          <h2>
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--accent)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-right: 4px"
            >
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle
                cx="12"
                cy="7"
                r="4"
              ></circle>
            </svg>
            Account Information
          </h2>
          <div
            class="info-grid"
            id="info-grid"
          ></div>
        </div>

        <div class="card">
          <h2>
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="var(--purple)"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              style="margin-right: 4px"
            >
              <rect
                x="3"
                y="11"
                width="18"
                height="11"
                rx="2"
                ry="2"
              ></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            Change Password
          </h2>

          <div
            class="alert alert-error"
            id="pw-error"
          ></div>
          <div
            class="alert alert-success"
            id="pw-success"
          ></div>

          <form id="password-form">
            <div class="form-group">
              <label for="current-password">Current Password</label>
              <input
                type="password"
                id="current-password"
                autocomplete="current-password"
                required
                placeholder="Enter current password"
              />
            </div>
            <div class="form-group">
              <label for="new-password">New Password</label>
              <input
                type="password"
                id="new-password"
                minlength="6"
                autocomplete="new-password"
                required
                placeholder="Min 6 characters"
              />
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm New Password</label>
              <input
                type="password"
                id="confirm-password"
                minlength="6"
                autocomplete="new-password"
                required
                placeholder="Repeat new password"
              />
            </div>
            <button
              type="submit"
              class="btn-primary"
              id="pw-btn"
            >
              Update Password
            </button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* Spotlight tracking */
    document.addEventListener('mousemove', (e) => {
      const s = document.getElementById('spotlight');
      if (s) {
        s.style.setProperty('--mx', e.clientX + 'px');
        s.style.setProperty('--my', e.clientY + 'px');
      }
    });

    async function loadNavbar() {
      try {
        const res = await fetch('/navbar.html');
        if (!res.ok) return;
        const html = await res.text();
        const slot = document.getElementById('navbar-slot');
        if (!slot) return;
        slot.innerHTML = html;
        slot.querySelectorAll('script').forEach((old) => {
          const s = document.createElement('script');
          s.textContent = old.textContent;
          document.head.appendChild(s);
          s.remove();
        });
      } catch {}
    }

    (async function () {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      await loadNavbar();

      const loading = document.getElementById('loading');
      const content = document.getElementById('profile-content');
      loading.style.display = 'block';

      // Fetch profile
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
        .then((r) => r.json())
        .then((data) => {
          loading.style.display = 'none';
          if (!data.success) {
            window.location.href = '/login';
            return;
          }

          const u = data.user;
          content.style.display = 'block';

          const name =
            u.first_name && u.last_name
              ? u.first_name + ' ' + u.last_name
              : u.role === 'admin'
                ? 'Admin'
                : 'User';
          document.getElementById('profile-name').textContent = name;
          document.getElementById('profile-role').textContent = u.role;

          const grid = document.getElementById('info-grid');

          function addField(label, value, fullWidth) {
            if (value === undefined || value === null) return;
            const item = document.createElement('div');
            item.className = 'info-item' + (fullWidth ? ' full-width' : '');
            item.innerHTML =
              '<span class="label">' +
              escapeHtml(label) +
              '</span>' +
              '<span class="value">' +
              escapeHtml(String(value)) +
              '</span>';
            grid.appendChild(item);
          }

          function escapeHtml(str) {
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(str));
            return d.innerHTML;
          }

          addField('Email', u.email, true);

          if (u.role === 'participant') {
            addField('University', u.university);
            addField('Specialty', u.specialty);
            addField('Course', u.course);
            addField('Faculty Number', u.faculty_number);
            addField('Phone', u.phone_number);
            if (u.team_name) {
              addField('Team', u.team_name);
              addField('Join Code', u.join_code);
            }
          } else if (u.role === 'mentor') {
            addField('Company', u.company_name);
            addField('Phone', u.phone_number);
            if (u.bio) addField('Bio', u.bio, true);
          }
        })
        .catch(() => {
          loading.textContent = 'Failed to load profile. Please try again.';
        });

      // Password change
      const form = document.getElementById('password-form');
      const errBox = document.getElementById('pw-error');
      const okBox = document.getElementById('pw-success');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errBox.style.display = 'none';
        okBox.style.display = 'none';

        const cur = document.getElementById('current-password').value;
        const np = document.getElementById('new-password').value;
        const cp = document.getElementById('confirm-password').value;

        if (np.length < 6) {
          showError('New password must be at least 6 characters.');
          return;
        }
        if (np !== cp) {
          showError('New passwords do not match.');
          return;
        }

        const btn = document.getElementById('pw-btn');
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = 'Updating...';

        fetch('/api/auth/change-password', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ current_password: cur, new_password: np }),
        })
          .then((r) => r.json())
          .then((data) => {
            btn.disabled = false;
            btn.textContent = originalText;
            if (data.success) {
              okBox.textContent = 'Password updated successfully!';
              okBox.style.display = 'block';
              form.reset();
            } else {
              showError(data.error || 'Failed to update password.');
            }
          })
          .catch(() => {
            btn.disabled = false;
            btn.textContent = originalText;
            showError('Network error. Please try again.');
          });
      });

      function showError(msg) {
        errBox.textContent = msg;
        errBox.style.display = 'block';
      }
    })();
  </script>

  <style>
    @keyframes spin {
      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</body>
{% endblock %}
