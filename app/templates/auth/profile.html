{% extends "base.html" %} {% block title %}Profile — FMI{Codes} 2026{% endblock %} {% block head %}
<style>
  :root {
    --bg: #050816;
    --bg-card: rgba(255, 255, 255, 0.03);
    --border: rgba(255, 255, 255, 0.06);
    --border-glow: rgba(96, 165, 250, 0.25);
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #60a5fa;
    --accent-2: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
    --danger: #ef4444;
    --success: #22c55e;
    --glow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  *,
  *::before,
  *::after {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html {
    scroll-behavior: smooth;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  .dot-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
  }

  .spotlight {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(
      600px circle at var(--mx, 50%) var(--my, 30%),
      rgba(96, 165, 250, 0.07),
      rgba(34, 211, 238, 0.04) 40%,
      transparent 70%
    );
    transition: background 0.3s ease;
  }

  .page-wrapper {
    position: relative;
    z-index: 1;
    min-height: 100vh;
  }

  .profile-container {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .profile-header {
    text-align: center;
    margin-bottom: 32px;
  }
  .profile-header h1 {
    font-size: 2rem;
    font-weight: 800;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .profile-header .role-badge {
    display: inline-block;
    margin-top: 8px;
    padding: 4px 14px;
    border-radius: 20px;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    background: rgba(96, 165, 250, 0.12);
    border: 1px solid rgba(96, 165, 250, 0.25);
    color: var(--accent);
  }

  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 24px;
    backdrop-filter: blur(10px);
    box-shadow: var(--glow);
    transition: border-color 0.3s;
  }
  .card:hover {
    border-color: var(--border-glow);
  }

  .card h2 {
    font-size: 1.15rem;
    font-weight: 700;
    margin-bottom: 20px;
    color: var(--text);
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  .info-item {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .info-item .label {
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
  }
  .info-item .value {
    font-size: 0.95rem;
    color: var(--text);
    word-break: break-word;
  }
  .info-item.full-width {
    grid-column: 1 / -1;
  }

  .form-group {
    margin-bottom: 16px;
  }
  .form-group label {
    display: block;
    font-size: 0.8rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    font-weight: 600;
    margin-bottom: 6px;
  }
  .form-group input {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: rgba(255, 255, 255, 0.04);
    color: var(--text);
    font-size: 0.95rem;
    font-family: inherit;
    transition: border-color 0.2s;
  }
  .form-group input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(96, 165, 250, 0.15);
  }

  .btn-primary {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(120deg, var(--accent), var(--accent-2));
    color: #0b1021;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition:
      transform 0.2s,
      box-shadow 0.2s;
  }
  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
  }
  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .alert {
    padding: 12px 16px;
    border-radius: 10px;
    font-size: 0.9rem;
    margin-bottom: 16px;
    display: none;
  }
  .alert-error {
    background: rgba(239, 68, 68, 0.12);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #fca5a5;
  }
  .alert-success {
    background: rgba(34, 197, 94, 0.12);
    border: 1px solid rgba(34, 197, 94, 0.3);
    color: #86efac;
  }

  .loading-spinner {
    display: none;
    text-align: center;
    padding: 60px 0;
    color: var(--muted);
  }

  @media (max-width: 600px) {
    .info-grid {
      grid-template-columns: 1fr;
    }
    .profile-container {
      padding: 24px 16px 60px;
    }
  }
</style>
{% endblock %} {% block body %}
<body>
  <div class="dot-grid"></div>
  <div class="spotlight"></div>

  <div class="page-wrapper">
    {% include 'navbar.html' %}

    <div class="profile-container">
      <div class="loading-spinner" id="loading">Loading profile…</div>

      <div id="profile-content" style="display: none">
        <div class="profile-header">
          <h1 id="profile-name"></h1>
          <span class="role-badge" id="profile-role"></span>
        </div>

        <!-- Profile Info Card -->
        <div class="card">
          <h2>Account Information</h2>
          <div class="info-grid" id="info-grid"></div>
        </div>

        <!-- Password Change Card -->
        <div class="card">
          <h2>Change Password</h2>
          <div class="alert alert-error" id="pw-error"></div>
          <div class="alert alert-success" id="pw-success"></div>
          <form id="password-form">
            <div class="form-group">
              <label for="current-password">Current Password</label>
              <input
                type="password"
                id="current-password"
                autocomplete="current-password"
                required
              />
            </div>
            <div class="form-group">
              <label for="new-password">New Password</label>
              <input
                type="password"
                id="new-password"
                minlength="6"
                autocomplete="new-password"
                required
              />
            </div>
            <div class="form-group">
              <label for="confirm-password">Confirm New Password</label>
              <input
                type="password"
                id="confirm-password"
                minlength="6"
                autocomplete="new-password"
                required
              />
            </div>
            <button type="submit" class="btn-primary" id="pw-btn">Change Password</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      const token = localStorage.getItem('token');
      if (!token) {
        window.location.href = '/login';
        return;
      }

      const loading = document.getElementById('loading');
      const content = document.getElementById('profile-content');
      loading.style.display = 'block';

      // ── Fetch profile ──
      fetch('/api/auth/me', { headers: { Authorization: 'Bearer ' + token } })
        .then((r) => r.json())
        .then((data) => {
          loading.style.display = 'none';
          if (!data.success) {
            window.location.href = '/login';
            return;
          }

          const u = data.user;
          content.style.display = 'block';

          const name =
            u.first_name && u.last_name
              ? u.first_name + ' ' + u.last_name
              : u.role === 'admin'
                ? 'Admin'
                : 'User';
          document.getElementById('profile-name').textContent = name;
          document.getElementById('profile-role').textContent = u.role;

          const grid = document.getElementById('info-grid');

          function addField(label, value, fullWidth) {
            if (value === undefined || value === null) return;
            const item = document.createElement('div');
            item.className = 'info-item' + (fullWidth ? ' full-width' : '');
            item.innerHTML =
              '<span class="label">' +
              escapeHtml(label) +
              '</span>' +
              '<span class="value">' +
              escapeHtml(String(value)) +
              '</span>';
            grid.appendChild(item);
          }

          addField('Email', u.email, true);

          if (u.role === 'participant') {
            addField('University', u.university);
            addField('Specialty', u.specialty);
            addField('Course', u.course);
            addField('Faculty Number', u.faculty_number);
            addField('Phone', u.phone_number);
            if (u.team_name) {
              addField('Team', u.team_name);
              addField('Join Code', u.join_code);
            }
          } else if (u.role === 'mentor') {
            addField('Company', u.company_name);
            addField('Phone', u.phone_number);
            if (u.bio) addField('Bio', u.bio, true);
          }
        })
        .catch(() => {
          loading.textContent = 'Failed to load profile.';
        });

      // ── Password change ──
      const form = document.getElementById('password-form');
      const errBox = document.getElementById('pw-error');
      const okBox = document.getElementById('pw-success');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        errBox.style.display = 'none';
        okBox.style.display = 'none';

        const cur = document.getElementById('current-password').value;
        const np = document.getElementById('new-password').value;
        const cp = document.getElementById('confirm-password').value;

        if (np.length < 6) {
          showError('New password must be at least 6 characters.');
          return;
        }
        if (np !== cp) {
          showError('New passwords do not match.');
          return;
        }

        const btn = document.getElementById('pw-btn');
        btn.disabled = true;
        btn.textContent = 'Changing…';

        fetch('/api/auth/change-password', {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
          body: JSON.stringify({ current_password: cur, new_password: np }),
        })
          .then((r) => r.json())
          .then((data) => {
            btn.disabled = false;
            btn.textContent = 'Change Password';
            if (data.success) {
              okBox.textContent = 'Password changed successfully!';
              okBox.style.display = 'block';
              form.reset();
            } else {
              showError(data.error || 'Failed to change password.');
            }
          })
          .catch(() => {
            btn.disabled = false;
            btn.textContent = 'Change Password';
            showError('Network error. Please try again.');
          });
      });

      function showError(msg) {
        errBox.textContent = msg;
        errBox.style.display = 'block';
      }

      function escapeHtml(str) {
        const d = document.createElement('div');
        d.appendChild(document.createTextNode(str));
        return d.innerHTML;
      }

      // ── Spotlight follow ──
      document.addEventListener('mousemove', function (e) {
        document.querySelector('.spotlight').style.setProperty('--mx', e.clientX + 'px');
        document.querySelector('.spotlight').style.setProperty('--my', e.clientY + 'px');
      });
    })();
  </script>
</body>
{% endblock %}
