    <script>
      function ensureMentorLink(text, href) {
        const navLinks = document.querySelector(".nav-links");
        let link = document.querySelector(".nav-links .mentor-link");
        if (!link) {
          link = document.createElement("a");
          link.className = "nav-link mentor-link";
          navLinks.appendChild(link);
        }
        link.textContent = text;
        link.href = href;
      }

      async function setMentorLinkBySelection() {
        try {
          const res = await fetch("/api/mentors/available");
          if (!res.ok) return;
          const data = await res.json();
          const selectedCount = Array.isArray(data.selected)
            ? data.selected.length
            : 0;
          if (selectedCount > 0) {
            ensureMentorLink("Selected Mentors", "/selectedMentors");
          } else {
            ensureMentorLink("Choose Mentor", "/chooseMentor");
          }
        } catch {}
      }

      function updateNavbar() {
        const teamName = window.loggedInTeam || "";
        const navActions = document.querySelector(".nav-actions");
        if (!navActions) return;
        if (teamName) {
          navActions.innerHTML = `
          <button onclick="logout()" class="login-btn" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">Logout</button>
        `;
          setMentorLinkBySelection();
        }
      }

      async function loadNavbar() {
        try {
          const res = await fetch("/navbar.html");
          if (!res.ok) return;
          const html = await res.text();
          const slot = document.getElementById("navbar-slot");
          if (slot) slot.innerHTML = html;
        } catch {}
      }
      async function logout() {
        try {
          const response = await fetch("/api/logout", { method: "POST" });
          if (response.ok) window.location.reload();
        } catch (error) {
          console.error("Logout failed:", error);
        }
      }
      loadNavbar().then(updateNavbar);

      window.addEventListener("load", () => {
        const track = document.getElementById("track");
        const DURATION = 40000;

        // Clone all 12 items so we have 24 total for seamless loop
        Array.from(track.children).forEach((item) => {
          track.appendChild(item.cloneNode(true));
        });

        let startTime = null;
        let scrollDistance = 0;

        function measure() {
          const items = track.querySelectorAll(".carousel_item");
          const first = items[0].getBoundingClientRect();
          const thirteenth = items[12].getBoundingClientRect();
          scrollDistance = thirteenth.left - first.left;
        }

        function animate(ts) {
          if (!startTime) startTime = ts;
          const elapsed = (ts - startTime) % DURATION;
          const progress = elapsed / DURATION;
          track.style.transform = `translateX(${-progress * scrollDistance}px)`;
          requestAnimationFrame(animate);
        }

        measure();
        window.addEventListener("resize", () => {
          measure();
          startTime = null;
        });

        requestAnimationFrame(animate);
      });
    </script>
