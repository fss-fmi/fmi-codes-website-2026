<script>
  (function () {
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    const actions = document.getElementById('nav-actions');
    const navLinks = document.querySelector('.nav-links');
    if (!actions) return;

    if (token && role) {
      if (role === 'participant') {
        const teamLink = document.createElement('a');
        teamLink.href = '/team';
        teamLink.className = 'nav-link';
        teamLink.textContent = 'My Team';
        navLinks.appendChild(teamLink);
      } else if (role === 'mentor') {
        const dashLink = document.createElement('a');
        dashLink.href = '/mentorDashboard';
        dashLink.className = 'nav-link';
        dashLink.textContent = 'Dashboard';
        navLinks.appendChild(dashLink);
      } else if (role === 'admin') {
        const adminLink = document.createElement('a');
        adminLink.href = '/admin/matching';
        adminLink.className = 'nav-link';
        adminLink.textContent = 'Admin';
        navLinks.appendChild(adminLink);
      }

      actions.innerHTML = `
      <a href="/profile" class="profile-btn" aria-label="Profile" title="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <button onclick="(function(){localStorage.removeItem('token');localStorage.removeItem('role');localStorage.removeItem('user_id');window.location.href='/login';})()"
        class="login-btn logout-btn">
        Logout
      </button>`;
    }
  })();

  /* Scroll-aware navbar enhancement */
  (function () {
    var nav = document.getElementById('mainNavbar');
    if (!nav) return;
    var ticking = false;
    window.addEventListener('scroll', function () {
      if (!ticking) {
        requestAnimationFrame(function () {
          if (window.scrollY > 20) {
            nav.classList.add('scrolled');
          } else {
            nav.classList.remove('scrolled');
          }
          ticking = false;
        });
        ticking = true;
      }
    });
  })();

  /* Mobile side drawer */
  (function () {
    var openBtn = document.getElementById('navOpenBtn');
    var closeBtn = document.getElementById('navCloseBtn');
    var drawer = document.getElementById('navDrawer');
    var overlay = document.getElementById('drawerOverlay');
    if (!openBtn || !drawer) return;
    function openDrawer() {
      drawer.classList.add('drawer-open');
      if (overlay) overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
      openBtn.setAttribute('aria-expanded', 'true');
    }
    function closeDrawer() {
      drawer.classList.remove('drawer-open');
      if (overlay) overlay.classList.remove('active');
      document.body.style.overflow = '';
      openBtn.setAttribute('aria-expanded', 'false');
    }
    openBtn.addEventListener('click', openDrawer);
    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    if (overlay) overlay.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDrawer();
    });
    drawer.addEventListener('click', function (e) {
      if (e.target.closest('.nav-link')) closeDrawer();
    });

    /* Mark current page link as active in drawer */
    (function () {
      var path = window.location.pathname.replace(/\/$/, '') || '/';
      drawer.querySelectorAll('.nav-link').forEach(function (link) {
        var href = link.getAttribute('href').replace(/\/$/, '') || '/';
        if (href === path) link.classList.add('drawer-nav-active');
      });
    })();
  })();
</script>

        aria-hidden="true"
        >🐛</span
      >
      <h2
        id="bugModalTitle"
        class="bug-modal-title"
      >
        Report a Bug
      </h2>
      <button
        class="bug-modal-close"
        id="bugModalClose"
        aria-label="Close bug report"
      >
        &#10005;
      </button>
    </div>

    <p class="bug-modal-desc">Found something broken? Tell us what happened and we'll fix it. 🔧</p>

    <form
      id="bugReportForm"
      class="bug-form"
      novalidate
    >
      <div class="bug-form-group">
        <label
          for="bugWhatDid"
          class="bug-form-label"
          >What were you doing?</label
        >
        <textarea
          id="bugWhatDid"
          class="bug-form-textarea"
          rows="3"
          maxlength="2000"
          placeholder="Describe the steps you took before the issue occurred…"
        ></textarea>
        <span
          class="bug-char-count"
          id="bugWhatDidCount"
          aria-live="polite"
          >0 / 2000</span
        >
      </div>

      <div class="bug-form-group">
        <label
          for="bugWhatHappened"
          class="bug-form-label"
          >What went wrong?</label
        >
        <textarea
          id="bugWhatHappened"
          class="bug-form-textarea"
          rows="3"
          maxlength="2000"
          placeholder="Describe the unexpected behavior or error you saw…"
        ></textarea>
        <span
          class="bug-char-count"
          id="bugWhatHappenedCount"
          aria-live="polite"
          >0 / 2000</span
        >
      </div>

      <div
        id="bugFormStatus"
        class="bug-form-status"
        aria-live="polite"
        role="status"
      ></div>

      <button
        type="submit"
        id="bugSubmitBtn"
        class="bug-submit-btn"
      >
        <span id="bugSubmitLabel">Send Report</span>
      </button>
    </form>
  </div>
</div>

<style>
  /* ═══════════════════════════════════════════
     BUG BUBBLE BUTTON
     ═══════════════════════════════════════════ */
  .bug-bubble-btn {
    position: fixed;
    bottom: 24px;
    right: 24px;
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: linear-gradient(135deg, #f472b6 0%, #a78bfa 100%);
    border: none;
    cursor: pointer;
    /* Stay below the nav drawer overlay (z-index 1300) so that on mobile,
       opening the drawer naturally covers the button without any JS toggling. */
    z-index: 1200;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    box-shadow:
      0 4px 20px rgba(244, 114, 182, 0.35),
      0 2px 8px rgba(0, 0, 0, 0.4);

      transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.3s;
    flex-shrink: 0;
  }
  .bug-bubble-btn:hover {
    transform: scale(1.1) translateY(-3px);
    box-shadow:
      0 8px 32px rgba(244, 114, 182, 0.55),
      0 4px 16px rgba(0, 0, 0, 0.5);
  }
  .bug-bubble-btn:active {
    transform: scale(0.95);
  }
  .bug-bubble-btn:focus-visible {
    outline: 2px solid #f472b6;
    outline-offset: 3px;
  }

  /* ═══════════════════════════════════════════
     BUG MODAL OVERLAY + PANEL
     ═══════════════════════════════════════════ */
  .bug-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1201;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .bug-modal.bug-open {
    display: flex;
  }
  .bug-modal-backdrop {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    animation: bugFadeIn 0.2s ease;
  }
  .bug-modal-panel {
    position: relative;
    background: rgba(11, 16, 33, 0.98);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-top: 1px solid rgba(244, 114, 182, 0.2);
    border-radius: 16px;
    padding: 28px 32px;
    max-width: 480px;
    width: 100%;
    box-shadow:
      0 24px 64px rgba(0, 0, 0, 0.65),
      0 0 0 1px rgba(244, 114, 182, 0.08);
    animation: bugSlideUp 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    max-height: 90vh;
    overflow-y: auto;
  }
  @keyframes bugFadeIn {
    from {
      opacity: 0;
    }

      opacity: 1;
    }
  }
  @keyframes bugSlideUp {
    from {
      opacity: 0;
      transform: translateY(18px) scale(0.97);
    }

      opacity: 1;
      transform: translateY(0) scale(1);

  }

  /* Header */
  .bug-modal-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .bug-modal-icon {
    font-size: 24px;
    line-height: 1;
    flex-shrink: 0;
  }
  .bug-modal-title {
    margin: 0;
    flex: 1;
    font-size: 18px;

    background: linear-gradient(90deg, #f472b6, #a78bfa);

    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: -0.2px;
  }
  .bug-modal-close {
    flex-shrink: 0;
    background: rgba(255, 255, 255, 0.05);

  .bug-form-group {

<script>
  /* ── Bug Report Widget ───────────────────────────────────────────── */
  (function () {
    var bubbleBtn = document.getElementById('bugBubbleBtn');
    var modal = document.getElementById('bugModal');
    var backdrop = document.getElementById('bugModalBackdrop');
    var closeBtn = document.getElementById('bugModalClose');
    var form = document.getElementById('bugReportForm');
    var whatDid = document.getElementById('bugWhatDid');
    var whatHappened = document.getElementById('bugWhatHappened');
    var didCount = document.getElementById('bugWhatDidCount');
    var happenedCount = document.getElementById('bugWhatHappenedCount');
    var statusEl = document.getElementById('bugFormStatus');
    var submitBtn = document.getElementById('bugSubmitBtn');
    var submitLabel = document.getElementById('bugSubmitLabel');

    if (!bubbleBtn || !modal) return;

    /* ── Open / close ─────────────────────────────────────────────── */
    function openModal() {
      modal.classList.add('bug-open');
      modal.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      /* Reset status on each open */
      statusEl.textContent = '';
      statusEl.className = 'bug-form-status';
      setTimeout(function () {
        whatDid.focus();
      }, 50);
    }

    function closeModal() {
      modal.classList.remove('bug-open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    bubbleBtn.addEventListener('click', openModal);
    closeBtn.addEventListener('click', closeModal);
    backdrop.addEventListener('click', closeModal);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape' && modal.classList.contains('bug-open')) closeModal();
    });

    /* ── Character counters ───────────────────────────────────────── */
    whatDid.addEventListener('input', function () {
      didCount.textContent = whatDid.value.length + ' / 2000';
    });
    whatHappened.addEventListener('input', function () {
      happenedCount.textContent = whatHappened.value.length + ' / 2000';
    });

    /* ── Form submit ──────────────────────────────────────────────── */
    form.addEventListener('submit', function (e) {
      e.preventDefault();

      var did = whatDid.value.trim();
      var happened = whatHappened.value.trim();

      if (!did && !happened) {
        statusEl.textContent = 'Please describe the issue before sending.';
        statusEl.className = 'bug-form-status bug-error';
        return;
      }

      submitBtn.disabled = true;
      submitLabel.textContent = 'Sending…';
      statusEl.textContent = '';
      statusEl.className = 'bug-form-status';

      var headers = { 'Content-Type': 'application/json' };
      var token = localStorage.getItem('token');
      if (token) headers['Authorization'] = 'Bearer ' + token;

      fetch('/api/bug-report', {
        method: 'POST',
        headers: headers,
        body: JSON.stringify({
          what_did: did,
          what_happened: happened,
          page: window.location.href,
        }),
      })
        .then(function (res) {
          return res.json().then(function (body) {
            return { ok: res.ok, body: body };
          });
        })
        .then(function (result) {
          if (result.ok && result.body.success) {
            statusEl.textContent = '✓ Report sent — thank you for helping us improve!';
            statusEl.className = 'bug-form-status bug-success';
            submitLabel.textContent = 'Send Report';
            submitBtn.disabled = false;
            whatDid.value = '';
            whatHappened.value = '';
            didCount.textContent = '0 / 2000';
            happenedCount.textContent = '0 / 2000';
            /* Auto-close after a short delay */
            setTimeout(closeModal, 2800);
          } else {
            throw new Error(result.body.error || 'Failed to submit the report.');
          }
        })
        .catch(function (err) {
          statusEl.textContent = '✗ ' + (err.message || 'Something went wrong — please try again.');
          statusEl.className = 'bug-form-status bug-error';
          submitLabel.textContent = 'Send Report';
          submitBtn.disabled = false;
        });
    });
  })();
</script>
