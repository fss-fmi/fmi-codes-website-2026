<script>
  (function () {
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    const actions = document.getElementById('nav-actions');
    const navLinks = document.querySelector('.nav-links');
    if (!actions) return;

    if (token && role) {
      if (role === 'participant') {
        const teamLink = document.createElement('a');
        teamLink.href = '/team';
        teamLink.className = 'nav-link';
        teamLink.textContent = 'My Team';
        navLinks.appendChild(teamLink);
      } else if (role === 'mentor') {
        const dashLink = document.createElement('a');
        dashLink.href = '/mentorDashboard';
        dashLink.className = 'nav-link';
        dashLink.textContent = 'Dashboard';
        navLinks.appendChild(dashLink);
      } else if (role === 'admin') {
        const adminLink = document.createElement('a');
        adminLink.href = '/admin/matching';
        adminLink.className = 'nav-link';
        adminLink.textContent = 'Admin';
        navLinks.appendChild(adminLink);
      }

      actions.innerHTML = `
      <a href="/profile" class="profile-btn" aria-label="Profile" title="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <button onclick="(function(){localStorage.removeItem('token');localStorage.removeItem('role');localStorage.removeItem('user_id');window.location.href='/login';})()"
        class="login-btn logout-btn">
        Logout
      </button>`;
    }
  })();

  /* Scroll-aware navbar enhancement */
  (function () {
    var nav = document.getElementById('mainNavbar');
    if (!nav) return;
    var ticking = false;
    window.addEventListener('scroll', function () {
      if (!ticking) {
        requestAnimationFrame(function () {
          if (window.scrollY > 20) {
            nav.classList.add('scrolled');
          } else {
            nav.classList.remove('scrolled');
          }
          ticking = false;
        });
        ticking = true;
      }
    });
  })();

  /* Mobile side drawer */
  (function () {
    var openBtn = document.getElementById('navOpenBtn');
    var closeBtn = document.getElementById('navCloseBtn');
    var drawer = document.getElementById('navDrawer');
    var overlay = document.getElementById('drawerOverlay');
    if (!openBtn || !drawer) return;
    function openDrawer() {
      drawer.classList.add('drawer-open');
      if (overlay) overlay.classList.add('active');
      document.body.style.overflow = 'hidden';
      openBtn.setAttribute('aria-expanded', 'true');
    }
    function closeDrawer() {
      drawer.classList.remove('drawer-open');
      if (overlay) overlay.classList.remove('active');
      document.body.style.overflow = '';
      openBtn.setAttribute('aria-expanded', 'false');
    }
    openBtn.addEventListener('click', openDrawer);
    if (closeBtn) closeBtn.addEventListener('click', closeDrawer);
    if (overlay) overlay.addEventListener('click', closeDrawer);
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeDrawer();
    });
    drawer.addEventListener('click', function (e) {
      if (e.target.closest('.nav-link')) closeDrawer();
    });

    /* Mark current page link as active in drawer */
    (function () {
      var path = window.location.pathname.replace(/\/$/, '') || '/';
      drawer.querySelectorAll('.nav-link').forEach(function (link) {
        var href = link.getAttribute('href').replace(/\/$/, '') || '/';
        if (href === path) link.classList.add('drawer-nav-active');
      });
    })();
  })();
</script>
