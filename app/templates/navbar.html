<!-- Navigation Bar — JWT-aware -->
<nav class="navbar">
  <div class="navbar-container">
    <div class="navbar-logo">
      <a href="/" aria-label="Go to home">
        <img src="../static/images/FSS_logo_vector_trans_white.svg" alt="FSS" />
      </a>
    </div>

    <input type="checkbox" id="nav-toggle" class="nav-toggle" />
    <label for="nav-toggle" class="mobile-toggle" aria-label="Toggle navigation">&#9776;</label>

    <div class="navbar-menu">
      <div class="nav-links">
        <a href="/" class="nav-link">Home</a>
        <a href="/regulations" class="nav-link">Regulations</a>
        <a href="/schedule" class="nav-link">Schedule</a>
        <a href="/mentors" class="nav-link">Mentors</a>
      </div>
      <div class="nav-actions" id="nav-actions">
        <a href="/registration" class="login-btn">Register</a>
      </div>
    </div>
  </div>
</nav>

<script>
  (function () {
    const token = localStorage.getItem('token');
    const role = localStorage.getItem('role');
    const actions = document.getElementById('nav-actions');
    const navLinks = document.querySelector('.nav-links');
    if (!actions) return;

    if (token && role) {
      // Logged in — show role-specific links + logout
      if (role === 'participant') {
        const teamLink = document.createElement('a');
        teamLink.href = '/team';
        teamLink.className = 'nav-link';
        teamLink.textContent = 'My Team';
        navLinks.appendChild(teamLink);
      } else if (role === 'mentor') {
        const dashLink = document.createElement('a');
        dashLink.href = '/mentorDashboard';
        dashLink.className = 'nav-link';
        dashLink.textContent = 'Dashboard';
        navLinks.appendChild(dashLink);
      } else if (role === 'admin') {
        const adminLink = document.createElement('a');
        adminLink.href = '/admin/matching';
        adminLink.className = 'nav-link';
        adminLink.textContent = 'Admin';
        navLinks.appendChild(adminLink);
      }

      actions.innerHTML = `
      <a href="/profile" class="profile-btn" aria-label="Profile" title="Profile">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
          <circle cx="12" cy="7" r="4"/>
        </svg>
      </a>
      <button onclick="(function(){localStorage.removeItem('token');localStorage.removeItem('role');localStorage.removeItem('user_id');window.location.href='/login';})()"
        class="login-btn" style="background:rgba(239,68,68,0.15);border:1px solid rgba(239,68,68,0.3);color:#fca5a5;cursor:pointer;">
        Logout
      </button>`;
    }
  })();
</script>
