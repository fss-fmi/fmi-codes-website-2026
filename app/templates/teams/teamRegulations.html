<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Team Regulations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #050816;
        --bg-card: rgba(255, 255, 255, 0.03);
        --border: rgba(255, 255, 255, 0.06);
        --border-glow: rgba(96, 165, 250, 0.25);
        --text: #e2e8f0;
        --muted: #64748b;
        --accent: #60a5fa;
        --accent-2: #22d3ee;
        --purple: #a78bfa;
        --pink: #f472b6;
        --panel: rgba(255, 255, 255, 0.04);
        --panel-border: rgba(255, 255, 255, 0.08);
        --card-glow: 0 20px 60px rgba(0, 0, 0, 0.45);
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: 'Inter', system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 80px 16px 60px;
        display: flex;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }

      .navbar {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        background: rgba(5, 6, 13, 0.6);
        backdrop-filter: blur(20px) saturate(1.8);
        -webkit-backdrop-filter: blur(20px) saturate(1.8);
        border: none;
        border-radius: 0;
        z-index: 1000;
        box-shadow: none;
        transition:
          background 0.4s cubic-bezier(0.22, 1, 0.36, 1),
          box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .navbar::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          #60a5fa 20%,
          #22d3ee 40%,
          #a78bfa 60%,
          #f472b6 80%,
          transparent 100%
        );
        background-size: 200% 100%;
        animation: navGradientFlow 6s linear infinite;
        opacity: 0.5;
      }
      @keyframes navGradientFlow {
        0% {
          background-position: 100% 0;
        }
        100% {
          background-position: -100% 0;
        }
      }
      .navbar-container {
        max-width: 1400px;
        margin: 0 auto;
        padding: 12px 24px;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .navbar-logo {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 80px;
      }
      .logo-text {
        font-size: 20px;
        font-weight: 800;
        background: linear-gradient(120deg, #60a5fa, #22d3ee);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: 2px;
      }
      .nav-links {
        display: flex;
        gap: 24px;
        align-items: center;
        flex: 1;
        justify-content: center;
      }
      .nav-link {
        color: #e5e7eb;
        text-decoration: none;
        font-size: 14px;
        font-weight: 500;
        transition: color 0.2s ease;
        position: relative;
      }
      .nav-link:hover {
        color: #60a5fa;
      }
      .nav-link::after {
        content: '';
        position: absolute;
        bottom: -4px;
        left: 0;
        width: 0;
        height: 2px;
        background: linear-gradient(120deg, #60a5fa, #22d3ee);
        transition: width 0.2s ease;
      }
      .nav-link:hover::after {
        width: 100%;
      }
      .nav-actions {
        display: flex;
        gap: 12px;
        align-items: center;
        min-width: 140px;
        justify-content: flex-end;
      }
      .login-btn {
        background: linear-gradient(120deg, #60a5fa, #22d3ee);
        border: none;
        color: #0b1021;
        padding: 8px 18px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition:
          transform 0.2s ease,
          box-shadow 0.2s ease;
        text-decoration: none;
        display: inline-block;
      }
      .login-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
      }

      .container {
        width: 100%;
        max-width: 1000px;
      }
      .header {
        margin-bottom: 18px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
      }
      .header h1 {
        font-size: 26px;
        letter-spacing: 0.3px;
      }
      .header p {
        color: var(--muted);
        font-size: 14px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 18px;
      }
      .card {
        position: relative;
        padding: 24px;
        border-radius: 14px;
        border: 1px solid var(--panel-border);
        background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
        box-shadow: var(--card-glow);
        overflow: hidden;
        transition:
          transform 0.2s ease,
          border-color 0.2s ease;
        min-height: 160px;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: rgba(96, 165, 250, 0.35);
      }
      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(circle at 20% 20%, rgba(96, 165, 250, 0.12), transparent 45%);
        pointer-events: none;
      }
      .label {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px;
        border-radius: 999px;
        background: rgba(34, 211, 238, 0.12);
        border: 1px solid rgba(34, 211, 238, 0.3);
        color: #c7f9ff;
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .question {
        margin: 12px 0 8px;
        font-size: clamp(18px, 5vw, 22px);
        font-weight: 750;
      }
      .answer {
        color: var(--muted);
        font-size: clamp(13px, 3vw, 15px);
        line-height: 1.6;
      }

      @media (max-width: 768px) {
        body {
          padding: 76px 12px 40px;
        }
        .navbar-container {
          padding: 10px 16px;
        }
        .grid {
          gap: 14px;
        }
        .card {
          padding: 20px;
        }
      }
      /* Background layers */
      .dot-grid {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
        -webkit-mask-image: radial-gradient(
          ellipse 80% 60% at 50% 40%,
          black 30%,
          transparent 100%
        );
      }
      .spotlight {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        background: radial-gradient(
          600px circle at var(--mx, 50%) var(--my, 30%),
          rgba(96, 165, 250, 0.07),
          rgba(34, 211, 238, 0.04) 40%,
          transparent 70%
        );
        transition: background 0.3s ease;
      }
      .blobs {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
        overflow: hidden;
      }
      .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(120px);
        opacity: 0.15;
        will-change: transform;
      }
      .blob-1 {
        width: 700px;
        height: 700px;
        background: #60a5fa;
        top: -15%;
        left: -10%;
        animation: blobFloat1 18s ease-in-out infinite;
      }
      .blob-2 {
        width: 500px;
        height: 500px;
        background: #22d3ee;
        top: 40%;
        right: -12%;
        animation: blobFloat2 22s ease-in-out infinite;
      }
      .blob-3 {
        width: 450px;
        height: 450px;
        background: #a78bfa;
        bottom: -10%;
        left: 25%;
        animation: blobFloat3 20s ease-in-out infinite;
      }
      @keyframes blobFloat1 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(120px, 80px) scale(1.1);
        }
      }
      @keyframes blobFloat2 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(-80px, -60px) scale(1.15);
        }
      }
      @keyframes blobFloat3 {
        0%,
        100% {
          transform: translate(0, 0) scale(1);
        }
        50% {
          transform: translate(70px, -50px) scale(1.08);
        }
      }
      .noise {
        position: fixed;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        opacity: 0.035;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        background-repeat: repeat;
        background-size: 128px 128px;
      }
      .page-wrap {
        position: relative;
        z-index: 2;
        width: 100%;
      }
      @keyframes fadeSlideUp {
        from {
          opacity: 0;
          transform: translateY(24px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .container {
        animation: fadeSlideUp 0.7s ease both;
      }
    </style>
  </head>
  <body>
    <div class="dot-grid"></div>
    <div class="spotlight"></div>
    <div class="blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="noise"></div>
    <div class="page-wrap">
      <!-- Navigation Bar -->
      <nav class="navbar">
        <div class="navbar-container">
          <div class="navbar-logo"><div class="logo-text">FSS</div></div>
          <div class="nav-links">
            <a href="/team" class="nav-link">Home</a>
            <a href="/teamRegulations" class="nav-link">Regulations</a>
            <a href="/teamSchedule" class="nav-link">Schedule</a>
            <a href="/teamMentors" class="nav-link">Mentors</a>
            <a href="/teamRanking" class="nav-link">Ranking</a>
            <a href="/chooseMentor" class="nav-link mentor-link">Choose Mentor</a>
          </div>
          <div class="nav-actions">
            <a
              href="#"
              onclick="
                logout();
                return false;
              "
              class="login-btn"
              style="
                background: rgba(239, 68, 68, 0.15);
                border: 1px solid rgba(239, 68, 68, 0.3);
                color: #fca5a5;
              "
              >Logout</a
            >
          </div>
        </div>
      </nav>

      <div class="container">
        <div class="header">
          <h1>Regulations</h1>
          <p>Frequently asked questions and official rules.</p>
        </div>
        <div id="regulationsGrid" class="grid"></div>
        <div
          id="emptyState"
          style="display: none; color: #cbd5e1; text-align: center; padding: 40px 0"
        >
          No regulations found.
        </div>
      </div>

      <script>
        async function loadRegulations() {
          const grid = document.getElementById('regulationsGrid');
          const empty = document.getElementById('emptyState');
          grid.innerHTML = '';
          empty.style.display = 'none';

          try {
            const res = await fetch('/api/regulations');
            const data = await res.json();
            const list =
              data && data.success && Array.isArray(data.regulations) ? data.regulations : [];

            if (list.length === 0) {
              empty.style.display = 'block';
              return;
            }

            list.forEach((item, idx) => {
              const card = document.createElement('div');
              card.className = 'card';
              card.innerHTML = `
            <div class="label">Regulation ${idx + 1}</div>
            <div class="question">${item.question || ''}</div>
            <div class="answer">${item.answer || ''}</div>
          `;
              grid.appendChild(card);
            });
          } catch (e) {
            empty.textContent = 'Error loading regulations. Please try again.';
            empty.style.display = 'block';
          }
        }

        document.addEventListener('DOMContentLoaded', loadRegulations);
      </script>
      <script>
        async function logout() {
          try {
            const response = await fetch('/api/logout', { method: 'POST' });
            if (response.ok) window.location.href = '/';
          } catch (error) {
            console.error('Logout failed:', error);
          }
        }
        async function setMentorLinkBySelection() {
          try {
            const res = await fetch('/api/mentors/available');
            if (!res.ok) return;
            const data = await res.json();
            const selectedCount = Array.isArray(data.selected) ? data.selected.length : 0;
            const link = document.querySelector('.nav-links .mentor-link');
            if (!link) return;
            if (selectedCount > 0) {
              link.textContent = 'Selected Mentors';
              link.href = '/selectedMentors';
            } else {
              link.textContent = 'Choose Mentor';
              link.href = '/chooseMentor';
            }
          } catch {}
        }
        setMentorLinkBySelection();
      </script>
    </div>
    <!-- /page-wrap -->
    <script>
      document.addEventListener('mousemove', (e) => {
        const s = document.querySelector('.spotlight');
        if (s) {
          s.style.setProperty('--mx', e.clientX + 'px');
          s.style.setProperty('--my', e.clientY + 'px');
        }
      });
    </script>
  </body>
</html>
