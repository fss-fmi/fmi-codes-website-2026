<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="navbar-slot"></div>
    <div class="dot-grid"></div>
    <div class="spotlight"></div>
    <div class="blobs">
      <div class="blob blob-1"></div>
      <div class="blob blob-2"></div>
      <div class="blob blob-3"></div>
    </div>
    <div class="noise"></div>
    <div class="page-wrap">
      <!-- STAY TUNED SECTION -->
      <div class="stay-tuned-wrap">
        <div class="st-rings">
          <div class="st-ring st-ring-1"></div>
          <div class="st-ring st-ring-2"></div>
          <div class="st-ring st-ring-3"></div>
        </div>
        <div class="st-particles" id="stParticles"></div>
        <div class="st-content">
          <div class="st-badge">
            <span class="st-badge-dot"></span>
            Coming Soon
          </div>
          <h1 class="st-title">
            <span class="st-word" data-word="Stay">Stay</span>
            <span class="st-word st-word-accent" data-word="Tuned">Tuned</span>
          </h1>
          <p class="st-sub">
            Our mentors are being carefully selected.<br class="st-br" />
            Check back soon — it'll be worth the wait.
          </p>
          <div class="st-dots">
            <span class="st-dot"></span>
            <span class="st-dot"></span>
            <span class="st-dot"></span>
          </div>
        </div>
      </div>
      <!-- /STAY TUNED SECTION -->

      <script>
        async function loadNavbar() {
          try {
            const res = await fetch('/navbar.html');
            if (!res.ok) return;
            const html = await res.text();
            const slot = document.getElementById('navbar-slot');
            if (!slot) return;
            slot.innerHTML = html;
            slot.querySelectorAll('script').forEach((old) => {
              const s = document.createElement('script');
              s.textContent = old.textContent;
              document.head.appendChild(s);
              s.remove();
            });
          } catch {}
        }

        async function logout() {
          try {
            const response = await fetch('/api/logout', { method: 'POST' });
            if (response.ok) window.location.reload();
          } catch (error) {
            console.error('Logout failed:', error);
          }
        }

        function spawnParticles() {
          const container = document.getElementById('stParticles');
          if (!container) return;
          const colors = ['#60a5fa', '#22d3ee', '#a78bfa', '#f472b6', '#34d399'];
          for (let i = 0; i < 28; i++) {
            const p = document.createElement('div');
            p.className = 'st-particle';
            const size = 3 + Math.random() * 5;
            const x = Math.random() * 100;
            const delay = Math.random() * 6;
            const dur = 5 + Math.random() * 7;
            const color = colors[Math.floor(Math.random() * colors.length)];
            p.style.cssText = `
              width:${size}px; height:${size}px;
              left:${x}%; bottom:-10px;
              background:${color};
              animation-delay:${delay}s;
              animation-duration:${dur}s;
              box-shadow: 0 0 ${size * 3}px ${color};
            `;
            container.appendChild(p);
          }
        }

        document.addEventListener('DOMContentLoaded', async () => {
          await loadNavbar();
          spawnParticles();
        });
      </script>
    </div>
    <!-- /page-wrap -->
    <script>
      document.addEventListener('mousemove', (e) => {
        const s = document.querySelector('.spotlight');
        if (s) {
          s.style.setProperty('--mx', e.clientX + 'px');
          s.style.setProperty('--my', e.clientY + 'px');
        }
      });
    </script>
  </body>
</html>

<style>
  :root {
    --bg: #050816;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #60a5fa;
    --accent-2: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 80px 16px 60px;
    display: flex;
    justify-content: center;
    -webkit-font-smoothing: antialiased;
  }

  .navbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    background: rgba(5, 6, 13, 0.6);
    backdrop-filter: blur(20px) saturate(1.8);
    -webkit-backdrop-filter: blur(20px) saturate(1.8);
    border: none;
    border-radius: 0;
    z-index: 1000;
    box-shadow: none;
    transition:
      background 0.4s cubic-bezier(0.22, 1, 0.36, 1),
      box-shadow 0.4s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .navbar::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: linear-gradient(
      90deg,
      transparent 0%,
      #60a5fa 20%,
      #22d3ee 40%,
      #a78bfa 60%,
      #f472b6 80%,
      transparent 100%
    );
    background-size: 200% 100%;
    animation: navGradientFlow 6s linear infinite;
    opacity: 0.5;
  }
  @keyframes navGradientFlow {
    0% {
      background-position: 100% 0;
    }
    100% {
      background-position: -100% 0;
    }
  }
  .navbar-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px 48px;
    display: flex;
    align-items: center;
    gap: 36px;
  }
  .navbar-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 60px;
  }
  .navbar-logo a {
    display: inline-flex;
    align-items: center;
    transition: filter 0.3s;
  }
  .navbar-logo a:hover {
    filter: drop-shadow(0 0 10px rgba(96, 165, 250, 0.4));
  }
  .navbar-logo img {
    height: 44px;
    width: auto;
    display: block;
  }
  .logo-text {
    font-size: 20px;
    font-weight: 800;
    background: linear-gradient(120deg, #60a5fa, #22d3ee);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 2px;
  }
  .nav-links {
    display: flex;
    gap: 24px;
    align-items: center;
    flex: 1;
    justify-content: center;
  }
  .nav-link {
    color: #e5e7eb;
    text-decoration: none;
    font-size: 14px;
    font-weight: 500;
    transition: color 0.2s ease;
    position: relative;
  }
  .nav-link:hover {
    color: #60a5fa;
  }
  .nav-link::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: 0;
    width: 0;
    height: 2px;
    background: linear-gradient(120deg, #60a5fa, #22d3ee);
    transition: width 0.2s ease;
  }
  .nav-link:hover::after {
    width: 100%;
  }
  .nav-actions {
    display: flex;
    gap: 12px;
    align-items: center;
    min-width: 140px;
    justify-content: flex-end;
  }
  .login-btn {
    background: linear-gradient(120deg, #60a5fa, #22d3ee);
    border: none;
    color: #0b1021;
    padding: 8px 18px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 14px;
    cursor: pointer;
    transition:
      transform 0.2s ease,
      box-shadow 0.2s ease;
  }
  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
  }

  /* Background layers */
  .dot-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
  }
  .spotlight {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background: radial-gradient(
      600px circle at var(--mx, 50%) var(--my, 30%),
      rgba(96, 165, 250, 0.07),
      rgba(34, 211, 238, 0.04) 40%,
      transparent 70%
    );
    transition: background 0.3s ease;
  }
  .blobs {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.15;
    will-change: transform;
  }
  .blob-1 {
    width: 700px;
    height: 700px;
    background: #60a5fa;
    top: -15%;
    left: -10%;
    animation: blobFloat1 18s ease-in-out infinite;
  }
  .blob-2 {
    width: 500px;
    height: 500px;
    background: #22d3ee;
    top: 40%;
    right: -12%;
    animation: blobFloat2 22s ease-in-out infinite;
  }
  .blob-3 {
    width: 450px;
    height: 450px;
    background: #a78bfa;
    bottom: -10%;
    left: 25%;
    animation: blobFloat3 20s ease-in-out infinite;
  }
  @keyframes blobFloat1 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(120px, 80px) scale(1.1);
    }
  }
  @keyframes blobFloat2 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(-80px, -60px) scale(1.15);
    }
  }
  @keyframes blobFloat3 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(70px, -50px) scale(1.08);
    }
  }
  .noise {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-repeat: repeat;
    background-size: 128px 128px;
  }
  .page-wrap {
    position: relative;
    z-index: 2;
    width: 100%;
  }
  @keyframes fadeSlideUp {
    from {
      opacity: 0;
      transform: translateY(24px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ══ STAY TUNED STYLES ══ */
  .stay-tuned-wrap {
    position: relative;
    min-height: calc(100vh - 96px);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .st-rings {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  .st-ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid transparent;
    animation: stRingPulse 4s ease-in-out infinite;
  }
  .st-ring-1 {
    width: 280px;
    height: 280px;
    border-color: rgba(96, 165, 250, 0.25);
    animation-delay: 0s;
    box-shadow:
      0 0 40px rgba(96, 165, 250, 0.08),
      inset 0 0 40px rgba(96, 165, 250, 0.04);
  }
  .st-ring-2 {
    width: 480px;
    height: 480px;
    border-color: rgba(34, 211, 238, 0.15);
    animation-delay: 0.8s;
    box-shadow:
      0 0 60px rgba(34, 211, 238, 0.06),
      inset 0 0 60px rgba(34, 211, 238, 0.03);
  }
  .st-ring-3 {
    width: 680px;
    height: 680px;
    border-color: rgba(167, 139, 250, 0.1);
    animation-delay: 1.6s;
    box-shadow: 0 0 80px rgba(167, 139, 250, 0.04);
  }
  @keyframes stRingPulse {
    0%,
    100% {
      transform: scale(1);
      opacity: 0.7;
    }
    50% {
      transform: scale(1.06);
      opacity: 1;
    }
  }
  .st-particles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .st-particle {
    position: absolute;
    border-radius: 50%;
    opacity: 0;
    animation: stParticleRise linear infinite;
  }
  @keyframes stParticleRise {
    0% {
      transform: translateY(0) scale(1);
      opacity: 0;
    }
    10% {
      opacity: 0.9;
    }
    80% {
      opacity: 0.5;
    }
    100% {
      transform: translateY(-90vh) scale(0.4);
      opacity: 0;
    }
  }
  .st-content {
    position: relative;
    z-index: 2;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    animation: fadeSlideUp 0.9s ease both;
  }
  .st-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 16px;
    border-radius: 999px;
    background: rgba(34, 211, 238, 0.08);
    border: 1px solid rgba(34, 211, 238, 0.28);
    color: #67e8f9;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    animation: fadeSlideUp 0.7s ease both;
  }
  .st-badge-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22d3ee;
    box-shadow: 0 0 8px #22d3ee;
    animation: stDotPulse 1.6s ease-in-out infinite;
  }
  @keyframes stDotPulse {
    0%,
    100% {
      box-shadow: 0 0 6px #22d3ee;
    }
    50% {
      box-shadow:
        0 0 16px #22d3ee,
        0 0 32px rgba(34, 211, 238, 0.4);
    }
  }
  .st-title {
    font-size: clamp(54px, 12vw, 110px);
    font-weight: 900;
    line-height: 1.05;
    letter-spacing: -2px;
    display: flex;
    gap: 0.35em;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeSlideUp 0.8s 0.15s ease both;
  }
  .st-word {
    display: inline-block;
    color: #e2e8f0;
    animation: stWordBounce 6s ease-in-out infinite;
  }
  .st-word-accent {
    background: linear-gradient(120deg, #60a5fa 0%, #22d3ee 40%, #a78bfa 80%, #f472b6 100%);
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation:
      stGradientShift 4s linear infinite,
      stWordBounce 6s 0.3s ease-in-out infinite;
  }
  @keyframes stGradientShift {
    0% {
      background-position: 0% center;
    }
    100% {
      background-position: 200% center;
    }
  }
  @keyframes stWordBounce {
    0%,
    100% {
      transform: translateY(0);
    }
    50% {
      transform: translateY(-8px);
    }
  }
  .st-sub {
    font-size: clamp(16px, 2.5vw, 22px);
    color: #64748b;
    line-height: 1.7;
    max-width: 520px;
    animation: fadeSlideUp 0.8s 0.3s ease both;
  }
  .st-br {
    display: none;
  }
  @media (min-width: 640px) {
    .st-br {
      display: block;
    }
  }
  .st-dots {
    display: flex;
    gap: 10px;
    align-items: center;
    animation: fadeSlideUp 0.8s 0.45s ease both;
  }
  .st-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #60a5fa, #22d3ee);
    animation: stDotBounce 1.4s ease-in-out infinite;
  }
  .st-dot:nth-child(2) {
    animation-delay: 0.2s;
    background: linear-gradient(135deg, #a78bfa, #22d3ee);
  }
  .st-dot:nth-child(3) {
    animation-delay: 0.4s;
    background: linear-gradient(135deg, #f472b6, #a78bfa);
  }
  @keyframes stDotBounce {
    0%,
    80%,
    100% {
      transform: translateY(0) scale(1);
    }
    40% {
      transform: translateY(-10px) scale(1.3);
    }
  }
</style>
