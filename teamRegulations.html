<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Team Regulations</title>
  <style>
    :root {
      --bg: #060910;
      --panel: rgba(255, 255, 255, 0.04);
      --panel-border: rgba(255, 255, 255, 0.08);
      --text: #e5e7eb;
      --muted: #9ca3af;
      --accent: #60a5fa;
      --accent-2: #22d3ee;
      --card-glow: 0 20px 60px rgba(0, 0, 0, 0.45);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      background: radial-gradient(circle at 20% 20%, rgba(96,165,250,0.12), transparent 40%),
                  radial-gradient(circle at 80% 0%, rgba(34, 211, 238, 0.10), transparent 36%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 96px 16px 60px;
      display: flex;
      justify-content: center;
    }

    .navbar {
      position: fixed;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1200px, calc(100% - 40px));
      background: rgba(5, 6, 13, 0.95);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      z-index: 1000;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
      overflow: hidden;
    }
    .navbar-container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .navbar-logo { display: flex; align-items: center; gap: 8px; min-width: 80px; }
    .logo-text {
      font-size: 20px; font-weight: 800;
      background: linear-gradient(120deg, #60a5fa, #22d3ee);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
      letter-spacing: 2px;
    }
    .nav-links { display: flex; gap: 24px; align-items: center; flex: 1; justify-content: center; }
    .nav-link { color: #e5e7eb; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s ease; position: relative; }
    .nav-link:hover { color: #60a5fa; }
    .nav-link::after {
      content: ""; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px;
      background: linear-gradient(120deg, #60a5fa, #22d3ee); transition: width 0.2s ease;
    }
    .nav-link:hover::after { width: 100%; }
    .nav-actions { display: flex; gap: 12px; align-items: center; min-width: 140px; justify-content: flex-end; }
    .login-btn {
      background: linear-gradient(120deg, #60a5fa, #22d3ee); border: none; color: #0b1021; padding: 8px 18px;
      border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none; display: inline-block;
    }
    .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3); }

    .container { width: 100%; max-width: 1000px; }
    .header { margin-bottom: 18px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    .header h1 { font-size: 26px; letter-spacing: 0.3px; }
    .header p { color: var(--muted); font-size: 14px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; }
    .card {
      position: relative;
      padding: 24px;
      border-radius: 14px;
      border: 1px solid var(--panel-border);
      background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
      box-shadow: var(--card-glow);
      overflow: hidden;
      transition: transform 0.2s ease, border-color 0.2s ease;
      min-height: 160px;
    }
    .card:hover { transform: translateY(-4px); border-color: rgba(96,165,250,0.35); }
    .card::after { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 20% 20%, rgba(96,165,250,0.12), transparent 45%); pointer-events: none; }
    .label { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(34,211,238,0.12); border: 1px solid rgba(34,211,238,0.3); color: #c7f9ff; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .question { margin: 12px 0 8px; font-size: clamp(18px, 5vw, 22px); font-weight: 750; }
    .answer { color: var(--muted); font-size: clamp(13px, 3vw, 15px); line-height: 1.6; }

    @media (max-width: 768px) {
      body { padding: 92px 12px 40px; }
      .navbar-container { padding: 10px 16px; }
      .grid { gap: 14px; }
      .card { padding: 20px; }
    }
  </style>
</head>
<body>
  <!-- Navigation Bar -->
  <nav class="navbar">
    <div class="navbar-container">
      <div class="navbar-logo"><div class="logo-text">FSS</div></div>
      <div class="nav-links">
        <a href="/team" class="nav-link">Home</a>
        <a href="/teamRegulations" class="nav-link">Regulations</a>
        <a href="/teamSchedule" class="nav-link">Schedule</a>
        <a href="/teamMentors" class="nav-link">Mentors</a>
        <a href="/teamRanking" class="nav-link">Ranking</a>
        <a href="/chooseMentor" class="nav-link mentor-link">Choose Mentor</a>
      </div>
      <div class="nav-actions">
        <a href="#" onclick="logout(); return false;" class="login-btn" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">Logout</a>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="header">
      <h1>Regulations</h1>
      <p>Frequently asked questions and official rules.</p>
    </div>
    <div id="regulationsGrid" class="grid"></div>
    <div id="emptyState" style="display:none; color:#cbd5e1; text-align:center; padding: 40px 0;">No regulations found.</div>
  </div>

  <script>
    async function loadRegulations() {
      const grid = document.getElementById('regulationsGrid');
      const empty = document.getElementById('emptyState');
      grid.innerHTML = '';
      empty.style.display = 'none';

      try {
        const res = await fetch('/api/regulations');
        const data = await res.json();
        const list = (data && data.success && Array.isArray(data.regulations)) ? data.regulations : [];

        if (list.length === 0) {
          empty.style.display = 'block';
          return;
        }

        list.forEach((item, idx) => {
          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="label">Regulation ${idx + 1}</div>
            <div class="question">${item.question || ''}</div>
            <div class="answer">${item.answer || ''}</div>
          `;
          grid.appendChild(card);
        });
      } catch (e) {
        empty.textContent = 'Error loading regulations. Please try again.';
        empty.style.display = 'block';
      }
    }

    document.addEventListener('DOMContentLoaded', loadRegulations);
  </script>
  <script>
    async function logout() {
      try {
        const response = await fetch('/api/logout', { method: 'POST' });
        if (response.ok) window.location.href = '/';
      } catch (error) {
        console.error('Logout failed:', error);
      }
    }
    async function setMentorLinkBySelection() {
      try {
        const res = await fetch('/api/mentors/available');
        if (!res.ok) return;
        const data = await res.json();
        const selectedCount = Array.isArray(data.selected) ? data.selected.length : 0;
        const link = document.querySelector('.nav-links .mentor-link');
        if (!link) return;
        if (selectedCount > 0) {
          link.textContent = 'Selected Mentors';
          link.href = '/selectedMentors';
        } else {
          link.textContent = 'Choose Mentor';
          link.href = '/chooseMentor';
        }
      } catch {}
    }
    setMentorLinkBySelection();
  </script>
</body>
</html>
