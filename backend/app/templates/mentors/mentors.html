{% extends "base.html" %} {% block title %}Mentors — Mission Control{% endblock %} {% block head %}
<style>
  :root {
    --bg: #050816;
    --text: #e2e8f0;
    --muted: #64748b;
    --accent: #60a5fa;
    --accent-2: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
    --green: #22c55e;
    --amber: #f59e0b;
    --panel-border: rgba(255, 255, 255, 0.08);
    --card-glow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 0 0 80px;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  /* --- Background Layers (Original Dotted Grid) --- */
  .bg-layer {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .dot-grid {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
    -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, black 30%, transparent 100%);
  }

  .bg-blobs {
    overflow: hidden;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(130px);
    opacity: 0.12;
    will-change: transform;
  }
  .blob-1 {
    width: 800px;
    height: 800px;
    background: #60a5fa;
    top: -20%;
    left: -15%;
    animation: bf1 20s ease-in-out infinite;
  }
  .blob-2 {
    width: 600px;
    height: 600px;
    background: #22d3ee;
    top: 35%;
    right: -15%;
    animation: bf2 25s ease-in-out infinite;
  }
  .blob-3 {
    width: 500px;
    height: 500px;
    background: #a78bfa;
    bottom: -12%;
    left: 20%;
    animation: bf3 22s ease-in-out infinite;
  }
  @keyframes bf1 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(100px, 80px) scale(1.1);
    }
  }
  @keyframes bf2 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(-70px, -50px) scale(1.12);
    }
  }
  @keyframes bf3 {
    0%,
    100% {
      transform: translate(0, 0) scale(1);
    }
    50% {
      transform: translate(60px, -40px) scale(1.08);
    }
  }
  .spotlight {
    position: fixed;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(
      600px circle at var(--mx, 50%) var(--my, 30%),
      rgba(96, 165, 250, 0.06),
      transparent 65%
    );
  }
  .noise {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.035;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    background-size: 128px 128px;
  }
  .page-wrap {
    position: relative;
    z-index: 3;
    width: 100%;
    padding-top: 76px;
  }

  /* --- Header --- */
  .admin-header {
    max-width: 1700px;
    margin: 0 auto;
    padding: 40px 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }
  .admin-eyebrow {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .admin-eyebrow::before {
    content: '';
    display: inline-block;
    width: 20px;
    height: 2px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 2px;
  }
  .admin-title {
    font-size: clamp(28px, 5vw, 48px);
    font-weight: 900;
    line-height: 1.08;
    background: linear-gradient(135deg, #fff 0%, #93c5fd 40%, #a5f3fc 70%, #c4b5fd 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -0.02em;
  }
  .admin-subtitle {
    color: var(--muted);
    font-size: 14px;
    margin-top: 8px;
  }

  /* --- Grid (Original Spacing) --- */
  .container {
    width: 100%;
    margin-inline: auto;
    max-width: 1700px;
    padding: 0 24px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 24px;
    margin-top: 20px;
  }
  .empty-state {
    display: none;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-size: 17px;
    font-weight: 600;
  }

  /* --- Cards (Original Styling & Layout) --- */
  .card {
    position: relative;
    padding: 34px;
    border-radius: 14px;
    border: 1px solid var(--panel-border);
    background: linear-gradient(145deg, rgba(255, 255, 255, 0.05), rgba(255, 255, 255, 0.02));
    box-shadow: var(--card-glow);
    overflow: hidden;
    transition:
      transform 0.25s ease,
      border-color 0.25s ease,
      box-shadow 0.25s ease;
    min-height: 280px;
    animation: cardAppear 0.5s ease both;
  }
  .card:hover {
    transform: translateY(-6px);
    border-color: rgba(96, 165, 250, 0.35);
    box-shadow:
      0 24px 70px rgba(0, 0, 0, 0.5),
      0 0 40px rgba(96, 165, 250, 0.08);
  }
  .card::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(96, 165, 250, 0.12), transparent 45%);
    pointer-events: none;
  }
  @keyframes cardAppear {
    from {
      opacity: 0;
      transform: translateY(30px) scale(0.97);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* --- Mentor Specific Styles (Original Spacing) --- */
  .mentor-head {
    display: flex;
    align-items: center;
    gap: 18px;
  }
  .avatar {
    width: 94px;
    height: 94px;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.16);
    object-fit: cover;
    flex-shrink: 0;
    background: linear-gradient(145deg, #1f2937, #111827);
  }
  .avatar.placeholder {
    display: grid;
    place-items: center;
    font-size: 34px;
    color: #c7d2fe;
    background: linear-gradient(145deg, rgba(124, 58, 237, 0.2), rgba(34, 211, 238, 0.1));
  }
  .name {
    margin: 0;
    font-size: clamp(20px, 5vw, 24px);
    font-weight: 750;
    line-height: 1.2;
  }
  .workplace {
    margin-top: 8px;
    color: #67e8f9;
    font-size: clamp(14px, 3vw, 16px);
    line-height: 1.5;
  }
  .description {
    margin-top: 16px;
    color: var(--muted);
    font-size: 17px;
    line-height: 1.65;
    position: relative;
    z-index: 1;
  }

  /* ══ TECHNOLOGY PILLS (Squircle, No Glow) ══ */
  .tech-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 18px;
    position: relative;
    z-index: 1;
    max-height: 150px;
    overflow-y: auto;
    overflow-x: hidden;
    padding-right: 4px;
  }
  .tech-pills::-webkit-scrollbar {
    width: 4px;
  }
  .tech-pills::-webkit-scrollbar-track {
    background: rgba(255, 255, 255, 0.04);
    border-radius: 99px;
  }
  .tech-pills::-webkit-scrollbar-thumb {
    background: rgba(96, 165, 250, 0.35);
    border-radius: 99px;
  }
  .tech-pills::-webkit-scrollbar-thumb:hover {
    background: rgba(96, 165, 250, 0.6);
  }

  .tech-pill {
    display: inline-flex;
    align-items: center;
    padding: 5px 14px;
    border-radius: 10px; /* Squircle/Less round */
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    background: var(--pill-bg);
    border: 1px solid var(--pill-border);
    color: var(--pill-text);
    box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.03); /* Keep inset for slight depth */
    transition:
      transform 0.2s ease,
      background 0.2s ease,
      border-color 0.2s ease;
    animation: pillAppear 0.4s ease both;
    cursor: default;
    white-space: nowrap;
  }
  .tech-pill:hover {
    transform: translateY(-3px) scale(1.06);
    background: color-mix(
      in srgb,
      var(--pill-bg) 200%,
      transparent
    ); /* Slightly highlight background on hover */
    border-color: color-mix(in srgb, var(--pill-border) 200%, transparent);
  }
  @keyframes pillAppear {
    from {
      opacity: 0;
      transform: translateY(8px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* ══ AVAILABILITY CHIPS (Squircle, No Glow) ══ */
  .avail-section {
    margin-top: 18px;
    position: relative;
    z-index: 1;
  }
  .avail-header {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 9px;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .avail-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .avail-chip {
    display: inline-flex;
    align-items: center;
    padding: 5px 14px;
    border-radius: 10px; /* Squircle/Less round */
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.3px;
    background: var(--ac-bg);
    border: 1px solid var(--ac-border);
    color: var(--ac-text);
    box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.03); /* Keep inset for slight depth */
    transition:
      transform 0.2s ease,
      background 0.2s ease,
      border-color 0.2s ease;
    animation: availChipAppear 0.4s ease both;
    cursor: default;
    white-space: nowrap;
  }
  .avail-chip:hover {
    transform: translateY(-3px) scale(1.06);
    background: color-mix(
      in srgb,
      var(--ac-bg) 200%,
      transparent
    ); /* Slightly highlight background on hover */
    border-color: color-mix(in srgb, var(--ac-border) 200%, transparent);
  }
  @keyframes availChipAppear {
    from {
      opacity: 0;
      transform: translateY(8px) scale(0.9);
    }
    to {
      opacity: 1;
      transform: translateY(0) scale(1);
    }
  }

  /* --- Responsive settings from original --- */
  @media (max-width: 768px) {
    .admin-header,
    .container {
      padding-left: 12px;
      padding-right: 12px;
    }
    .grid {
      gap: 14px;
    }
    .card {
      padding: 24px;
      min-height: 240px;
    }
    .tech-pill {
      font-size: 11px;
      padding: 4px 11px;
    }
  }
  @media (max-width: 480px) {
    .grid {
      grid-template-columns: 1fr;
    }
  }
  @media (min-width: 1024px) {
    .grid {
      grid-template-columns: repeat(4, minmax(0, 1fr));
    }
    .card {
      padding: 36px;
      min-height: 300px;
    }
    .name {
      font-size: 30px;
    }
    .workplace {
      font-size: 19px;
    }
    .description {
      font-size: 18px;
    }
  }
</style>
{% endblock %} {% block body %}
<body>
  <div id="navbar-slot"></div>

  <div
    class="dot-grid"
    aria-hidden="true"
  ></div>
  <div
    class="bg-layer bg-blobs"
    aria-hidden="true"
  >
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
  </div>
  <div
    class="spotlight"
    id="spotlight"
    aria-hidden="true"
  ></div>
  <div
    class="noise"
    aria-hidden="true"
  ></div>

  <div class="page-wrap">
    <div class="admin-header">
      <div class="admin-eyebrow">Personnel</div>
      <div class="admin-title">Mentors</div>
      <div class="admin-subtitle">Meet the experts guiding FMI{Codes} 2026.</div>
    </div>

    <div class="container">
      <div
        id="mentorGrid"
        class="grid"
      ></div>
      <div
        id="emptyState"
        class="empty-state"
      >
        <div style="font-size: 48px; margin-bottom: 16px">👨‍💻</div>
        No mentors found.
      </div>
    </div>

    <script>
      // Clean Design Colors (removed glow property, using solid theme bases)
      const PILL_COLORS = [
        { bg: 'rgba(96,165,250,0.12)', border: 'rgba(96,165,250,0.35)', text: '#93c5fd' },
        { bg: 'rgba(34,211,238,0.12)', border: 'rgba(34,211,238,0.35)', text: '#67e8f9' },
        { bg: 'rgba(167,139,250,0.12)', border: 'rgba(167,139,250,0.35)', text: '#c4b5fd' },
        { bg: 'rgba(244,114,182,0.12)', border: 'rgba(244,114,182,0.35)', text: '#f9a8d4' },
        { bg: 'rgba(52,211,153,0.12)', border: 'rgba(52,211,153,0.35)', text: '#6ee7b7' },
        { bg: 'rgba(251,191,36,0.12)', border: 'rgba(251,191,36,0.35)', text: '#fcd34d' },
      ];

      function escapeHtml(str) {
        const d = document.createElement('div');
        d.textContent = str;
        return d.innerHTML;
      }

      function buildTechPills(technologies) {
        if (!Array.isArray(technologies) || technologies.length === 0) return '';
        return (
          '<div class="tech-pills">' +
          technologies
            .map((tech, i) => {
              const c = PILL_COLORS[i % PILL_COLORS.length];
              return `<span class="tech-pill" style="--pill-bg:${c.bg};--pill-border:${c.border};--pill-text:${c.text};animation-delay:${i * 0.07}s">${escapeHtml(tech)}</span>`;
            })
            .join('') +
          '</div>'
        );
      }

      // Clean Colors for Avail Section (removed glow property)
      const AVAIL_COLORS = [
        { bg: 'rgba(251,191,36,0.12)', border: 'rgba(251,191,36,0.35)', text: '#fcd34d' },
        { bg: 'rgba(251,146,60,0.12)', border: 'rgba(251,146,60,0.35)', text: '#fdba74' },
        { bg: 'rgba(52,211,153,0.12)', border: 'rgba(52,211,153,0.35)', text: '#6ee7b7' },
      ];

      function buildAvailabilityChips(text) {
        if (!text || typeof text !== 'string') return '';
        const slots = text
          .split(',')
          .map((s) => s.trim())
          .filter(Boolean);
        if (slots.length === 0) return '';
        const clockSvg =
          '<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:5px;flex-shrink:0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>';
        return (
          '<div class="avail-section"><div class="avail-header">' +
          clockSvg +
          'Availability</div><div class="avail-chips">' +
          slots
            .map((s, i) => {
              const c = AVAIL_COLORS[i % AVAIL_COLORS.length];
              return `<span class="avail-chip" style="--ac-bg:${c.bg};--ac-border:${c.border};--ac-text:${c.text};animation-delay:${i * 0.09}s">${clockSvg}${escapeHtml(s)}</span>`;
            })
            .join('') +
          '</div></div>'
        );
      }

      async function loadMentors() {
        const grid = document.getElementById('mentorGrid');
        const empty = document.getElementById('emptyState');
        grid.innerHTML = '';
        empty.style.display = 'none';

        try {
          const res = await fetch('/api/mentors');
          const data = await res.json();
          const list = Array.isArray(data.mentors) ? data.mentors : [];

          if (list.length === 0) {
            empty.style.display = 'block';
            return;
          }

          list.forEach((m, idx) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.style.animationDelay = `${idx * 0.08}s`;

            const mentorName = escapeHtml(`${m.first_name || ''} ${m.last_name || ''}`.trim());
            const mentorCompany = escapeHtml((m.company_name || '').trim());
            const description = escapeHtml(
              (m.bio || '').trim() ||
                'Experienced mentor available for technical guidance and project feedback.',
            );
            const imgSrc = (m.picture_url || '').trim();
            const hasPic = Boolean(imgSrc);
            const techPills = buildTechPills(m.technologies);
            const availChips = buildAvailabilityChips(m.availability_text);

            card.innerHTML = `
                <div class="mentor-head">
                  ${
                    hasPic
                      ? '<img class="avatar" src="' +
                        escapeHtml(imgSrc) +
                        '" alt="' +
                        mentorName +
                        '" onerror="this.style.visibility=\'hidden\'">'
                      : '<div class="avatar placeholder">👨‍💻</div>'
                  }
                  <div>
                    <div class="name">${mentorName}</div>
                    <div class="workplace">${mentorCompany}</div>
                  </div>
                </div>
                <div class="description">${description}</div>
                ${techPills}
                ${availChips}
              `;
            grid.appendChild(card);
          });
        } catch (e) {
          empty.innerHTML =
            '<div style="font-size: 48px; margin-bottom: 16px;">⚠️</div>Error loading mentors. Please try again.';
          empty.style.display = 'block';
        }
      }

      function ensureMentorLink(text, href) {
        const navLinks = document.querySelector('.nav-links');
        if (!navLinks) return;
        let link = document.querySelector('.nav-links .mentor-link');
        if (!link) {
          link = document.createElement('a');
          link.className = 'nav-link mentor-link';
          navLinks.appendChild(link);
        }
        link.textContent = text;
        link.href = href;
      }

      async function setMentorLinkBySelection() {
        try {
          const res = await fetch('/api/mentors/available');
          if (!res.ok) return;
          const data = await res.json();
          const selectedCount = Array.isArray(data.selected) ? data.selected.length : 0;
          if (selectedCount > 0) {
            ensureMentorLink('Selected Mentors', '/selectedMentors');
          } else {
            ensureMentorLink('Choose Mentor', '/chooseMentor');
          }
        } catch {}
      }

      function updateNavbar() {
        const teamName = window.loggedInTeam || '';
        const navActions = document.querySelector('.nav-actions');
        if (!navActions) return;
        if (teamName) {
          navActions.innerHTML = `
              <button onclick="logout()" class="login-btn" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">Logout</button>
            `;
          setMentorLinkBySelection();
        }
      }

      async function loadNavbar() {
        try {
          const res = await fetch('/navbar.html');
          if (!res.ok) return;
          const html = await res.text();
          const slot = document.getElementById('navbar-slot');
          if (!slot) return;
          slot.innerHTML = html;
          slot.querySelectorAll('script').forEach((old) => {
            const s = document.createElement('script');
            s.textContent = old.textContent;
            document.head.appendChild(s);
            s.remove();
          });
        } catch {}
      }

      async function logout() {
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          if (response.ok) window.location.reload();
        } catch (error) {
          console.error('Logout failed:', error);
        }
      }

      document.addEventListener('DOMContentLoaded', async () => {
        await loadNavbar();
        updateNavbar();
        await loadMentors();
      });
    </script>
  </div>

  <script>
    document.addEventListener('mousemove', (e) => {
      const s = document.querySelector('.spotlight');
      if (s) {
        s.style.setProperty('--mx', e.clientX + 'px');
        s.style.setProperty('--my', e.clientY + 'px');
      }
    });
  </script>
</body>
{% endblock %}
