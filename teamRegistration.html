<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Registration Form</title>
    <style>
        :root {
            --bg: #060910;
            --panel: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #60a5fa;
            --accent-2: #22d3ee;
            --glow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 18% 22%, rgba(96,165,250,0.12), transparent 40%),
                        radial-gradient(circle at 82% 6%, rgba(34, 211, 238, 0.12), transparent 38%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 96px 16px 48px;
            display: flex;
            justify-content: center;
        }

        /* Island Navbar */
        .navbar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1200px, calc(100% - 40px));
            background: rgba(5, 6, 13, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        .navbar-container { max-width: 1400px; margin: 0 auto; padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; }
        .navbar-logo { display: flex; align-items: center; gap: 8px; min-width: 80px; }
        .logo-text { font-size: 20px; font-weight: 800; background: linear-gradient(120deg, #60a5fa, #22d3ee); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: 2px; text-decoration: none; }
        .nav-links { display: flex; gap: 24px; align-items: center; flex: 1; justify-content: center; }
        .nav-link { color: #e5e7eb; text-decoration: none; font-size: 14px; font-weight: 500; transition: color 0.2s ease; position: relative; }
        .nav-link:hover { color: #60a5fa; }
        .nav-link::after { content: ""; position: absolute; bottom: -4px; left: 0; width: 0; height: 2px; background: linear-gradient(120deg, #60a5fa, #22d3ee); transition: width 0.2s ease; }
        .nav-link:hover::after { width: 100%; }
        .nav-actions { display: flex; gap: 12px; align-items: center; min-width: 140px; justify-content: flex-end; }
        .login-btn { background: linear-gradient(120deg, #60a5fa, #22d3ee); border: none; color: #0b1021; padding: 8px 18px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; text-decoration: none; display: inline-block; }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3); }

        .container {
            background: linear-gradient(145deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            box-shadow: var(--glow);
            padding: 36px;
            max-width: 800px;
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .container::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(96,165,250,0.12), transparent 45%);
            pointer-events: none;
        }

        h1 {
            color: var(--text);
            margin-bottom: 10px;
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .subtitle {
            color: var(--muted);
            text-align: center;
            margin-bottom: 30px;
            font-size: 14px;
            position: relative;
            z-index: 1;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: var(--text);
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            background: rgba(255,255,255,0.04);
            color: var(--text);
            font-size: 14px;
            transition: border-color 0.2s, background 0.2s;
        }

        .form-group input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(255,255,255,0.06);
        }

        .form-group input::placeholder {
            color: #6b7280;
        }

        .team-info {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            border: 1px solid var(--panel-border);
            position: relative;
            z-index: 1;
        }

        .team-info .form-group {
            margin-bottom: 0;
        }

        .section-title {
            color: var(--accent-2);
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            margin-top: 30px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(34,211,238,0.3);
            position: relative;
            z-index: 1;
        }

        .participant-card {
            background: rgba(255,255,255,0.03);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-left: 4px solid var(--accent);
            border: 1px solid var(--panel-border);
            border-left: 4px solid var(--accent);
            position: relative;
            z-index: 1;
        }

        .participant-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .participant-title {
            font-weight: 600;
            color: var(--text);
        }

        .remove-btn {
            background: rgba(239, 68, 68, 0.15);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .remove-btn:hover {
            background: rgba(239, 68, 68, 0.25);
            transform: translateY(-1px);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
            position: relative;
            z-index: 1;
        }

        .add-btn {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .add-btn:hover {
            background: rgba(34, 197, 94, 0.25);
            transform: translateY(-2px);
        }

        .add-btn:disabled {
            background: rgba(156, 163, 175, 0.1);
            color: #6b7280;
            border-color: rgba(156, 163, 175, 0.2);
            cursor: not-allowed;
            transform: none;
        }

        .submit-btn {
            background: linear-gradient(120deg, #60a5fa, #22d3ee);
            color: #0b1021;
            border: none;
            padding: 14px 30px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            width: 100%;
            transition: transform 0.2s, box-shadow 0.2s;
            position: relative;
            z-index: 1;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(96, 165, 250, 0.4);
        }

        .error-message {
            color: #fca5a5;
            font-size: 12px;
            margin-top: 5px;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: rgba(34, 197, 94, 0.15);
            color: #86efac;
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            position: relative;
            z-index: 1;
        }

        .success-message.show {
            display: block;
        }

        .participant-count {
            background: rgba(34,211,238,0.1);
            border: 1px solid rgba(34,211,238,0.2);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            color: var(--text);
            position: relative;
            z-index: 1;
        }

        @media (max-width: 768px) {
            body { padding: 92px 12px 36px; }
            .navbar-container { padding: 10px 16px; }
            .container { padding: 28px 22px; }
            .form-row { grid-template-columns: 1fr; }
            .button-group { flex-direction: column; }
            .button-group button { width: 100%; }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <div class="navbar-logo"><a href="/team" class="logo-text">FSS</a></div>
            <div class="nav-links">
                <a href="/team" class="nav-link">Home</a>
                <a href="/teamRegulations" class="nav-link">Regulations</a>
                <a href="/teamSchedule" class="nav-link">Schedule</a>
                <a href="/teamMentors" class="nav-link">Mentors</a>
                <a href="/teamRanking" class="nav-link">Ranking</a>
                <a href="/chooseMentor" class="nav-link mentor-link">Choose Mentor</a>
            </div>
            <div class="nav-actions">
                <a href="#" onclick="logout(); return false;" class="login-btn" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">Logout</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <h1>Team Registration</h1>
        <p class="subtitle">Register your team with 3-6 participants</p>

        <div id="successMessage" class="success-message"></div>

        <form id="registrationForm">
            <!-- Team Information -->
            <div class="team-info">
                <div class="form-group">
                    <label for="teamName">Team Name *</label>
                    <input type="text" id="teamName" name="teamName" required placeholder="Enter your team name">
                    <div class="error-message" id="teamNameError"></div>
                </div>
                <div class="form-group">
                    <label for="teamPassword">Password *</label>
                    <input type="password" id="teamPassword" name="teamPassword" required placeholder="Enter team password">
                    <div class="error-message" id="teamPasswordError"></div>
                </div>
            </div>

            <!-- Participants Section -->
            <div class="section-title">Participants</div>
            <div class="participant-count">
                Current participants: <span id="participantCount">0</span> / 6
            </div>

            <div id="participantsContainer"></div>

            <!-- Button Group -->
            <div class="button-group">
                <button type="button" class="add-btn" id="addBtn" onclick="addParticipant()">+ Add Participant</button>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit Registration</button>
        </form>
    </div>

    <script>
        const MIN_PARTICIPANTS = 3;
        const MAX_PARTICIPANTS = 6;

        function initializeForm() {
            const container = document.getElementById('participantsContainer');
            container.innerHTML = '';
            for (let i = 0; i < MIN_PARTICIPANTS; i++) {
                addParticipant();
            }
        }

        function addParticipant() {
            const container = document.getElementById('participantsContainer');
            const participantCount = container.children.length;

            if (participantCount >= MAX_PARTICIPANTS) {
                alert(`Maximum ${MAX_PARTICIPANTS} participants allowed`);
                return;
            }

            const participantCard = document.createElement('div');
            participantCard.className = 'participant-card';
            participantCard.innerHTML = `
                <div class="participant-header">
                    <span class="participant-title">Participant ${participantCount + 1}</span>
                    ${participantCount >= MIN_PARTICIPANTS ? `<button type="button" class="remove-btn" onclick="removeParticipant(this)">Remove</button>` : ''}
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName${participantCount}">First Name *</label>
                        <input type="text" id="firstName${participantCount}" name="firstName${participantCount}" required placeholder="First name">
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group">
                        <label for="lastName${participantCount}">Last Name *</label>
                        <input type="text" id="lastName${participantCount}" name="lastName${participantCount}" required placeholder="Last name">
                        <div class="error-message"></div>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="facultyNumber${participantCount}">Faculty Number *</label>
                        <input type="text" id="facultyNumber${participantCount}" name="facultyNumber${participantCount}" required placeholder="Faculty number">
                        <div class="error-message"></div>
                    </div>
                    <div class="form-group">
                        <label for="discord${participantCount}">Discord Username *</label>
                        <input type="text" id="discord${participantCount}" name="discord${participantCount}" required placeholder="Discord username">
                        <div class="error-message"></div>
                    </div>
                </div>
            `;

            container.appendChild(participantCard);
            updateParticipantCount();
        }

        function removeParticipant(button) {
            const container = document.getElementById('participantsContainer');
            const participantCount = container.children.length;

            if (participantCount <= MIN_PARTICIPANTS) {
                alert(`Minimum ${MIN_PARTICIPANTS} participants required`);
                return;
            }

            button.closest('.participant-card').remove();
            updateParticipantCount();
        }

        function updateParticipantCount() {
            const container = document.getElementById('participantsContainer');
            const count = container.children.length;
            document.getElementById('participantCount').textContent = count;

            const cards = container.querySelectorAll('.participant-card');
            cards.forEach((card, index) => {
                const removeBtn = card.querySelector('.remove-btn');
                if (count <= MIN_PARTICIPANTS) {
                    if (removeBtn) removeBtn.style.display = 'none';
                } else {
                    if (removeBtn) removeBtn.style.display = 'block';
                }
            });

            const addBtn = document.getElementById('addBtn');
            addBtn.disabled = count >= MAX_PARTICIPANTS;
        }

        function validateForm() {
            let isValid = true;
            const form = document.getElementById('registrationForm');
            const inputs = form.querySelectorAll('input[required]');

            inputs.forEach(input => {
                const errorDiv = input.parentElement.querySelector('.error-message');
                if (!input.value.trim()) {
                    errorDiv.textContent = 'This field is required';
                    errorDiv.classList.add('show');
                    isValid = false;
                } else {
                    errorDiv.classList.remove('show');
                }
            });

            const participantCount = document.getElementById('participantsContainer').children.length;
            if (participantCount < MIN_PARTICIPANTS || participantCount > MAX_PARTICIPANTS) {
                alert(`Please have between ${MIN_PARTICIPANTS} and ${MAX_PARTICIPANTS} participants`);
                isValid = false;
            }

            return isValid;
        }

        function collectFormData() {
            const form = document.getElementById('registrationForm');
            const container = document.getElementById('participantsContainer');
            const participantCount = container.children.length;

            const data = {
                teamName: document.getElementById('teamName').value,
                password: document.getElementById('teamPassword').value,
                participants: []
            };

            for (let i = 0; i < participantCount; i++) {
                data.participants.push({
                    firstName: document.getElementById(`firstName${i}`).value,
                    lastName: document.getElementById(`lastName${i}`).value,
                    facultyNumber: document.getElementById(`facultyNumber${i}`).value,
                    discord: document.getElementById(`discord${i}`).value
                });
            }

            return data;
        }

        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            if (!validateForm()) {
                return;
            }

            const data = collectFormData();
            const successMessage = document.getElementById('successMessage');

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (result.success) {
                    successMessage.innerHTML = `✓ ${result.message}`;
                    successMessage.style.background = 'rgba(34, 197, 94, 0.15)';
                    successMessage.style.color = '#86efac';
                    successMessage.style.border = '1px solid rgba(34, 197, 94, 0.3)';
                    successMessage.classList.add('show');

                    // Automatically log in newly registered team and redirect to team page
                    try {
                        const loginRes = await fetch('/api/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ teamName: data.teamName, password: data.password })
                        });
                        const loginJson = await loginRes.json();
                        if (loginJson.success) {
                            window.location.href = '/team';
                            return;
                        }
                    } catch (e) {
                        console.error('Auto-login after registration failed:', e);
                    }

                    // Fallback: Reset form and keep success message if auto-login fails
                    document.getElementById('registrationForm').reset();
                    document.getElementById('participantsContainer').innerHTML = '';
                    initializeForm();

                    setTimeout(() => {
                        successMessage.classList.remove('show');
                    }, 5000);
                } else {
                    successMessage.innerHTML = `✗ Error: ${result.error}`;
                    successMessage.style.background = 'rgba(239, 68, 68, 0.15)';
                    successMessage.style.color = '#fca5a5';
                    successMessage.style.border = '1px solid rgba(239, 68, 68, 0.3)';
                    successMessage.classList.add('show');
                }

                window.scrollTo({ top: 0, behavior: 'smooth' });

            } catch (error) {
                console.error('Error:', error);
                successMessage.innerHTML = `✗ Error: ${error.message}`;
                successMessage.style.background = '#f8d7da';
                successMessage.style.color = '#721c24';
                successMessage.classList.add('show');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });

        window.addEventListener('DOMContentLoaded', initializeForm);
    </script>
    <script>
      async function logout() {
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          if (response.ok) window.location.href = '/';
        } catch (error) {
          console.error('Logout failed:', error);
        }
      }
            async function setMentorLinkBySelection() {
                try {
                    const res = await fetch('/api/mentors/available');
                    if (!res.ok) return;
                    const data = await res.json();
                    const selectedCount = Array.isArray(data.selected) ? data.selected.length : 0;
                    const link = document.querySelector('.nav-links .mentor-link');
                    if (!link) return;
                    if (selectedCount > 0) {
                        link.textContent = 'Selected Mentors';
                        link.href = '/selectedMentors';
                    } else {
                        link.textContent = 'Choose Mentor';
                        link.href = '/chooseMentor';
                    }
                } catch {}
            }
            setMentorLinkBySelection();
    </script>
</body>
</html>
