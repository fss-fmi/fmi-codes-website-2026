<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentors</title>
    <style>
        :root {
            --bg: #060910;
            --panel: rgba(255, 255, 255, 0.04);
            --panel-border: rgba(255, 255, 255, 0.08);
            --text: #e5e7eb;
            --muted: #9ca3af;
            --accent: #7c3aed;
            --accent-2: #22d3ee;
            --card-glow: 0 20px 60px rgba(0, 0, 0, 0.45);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 20%, rgba(124, 58, 237, 0.14), transparent 40%),
                        radial-gradient(circle at 80% 0%, rgba(34, 211, 238, 0.12), transparent 36%),
                        var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 70px 16px 60px;
            display: flex;
            justify-content: center;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin-top: 20px;
        }
        .header {
            background: var(--panel);
            border: 1px solid var(--panel-border);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 22px;
            box-shadow: var(--card-glow);
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: space-between;
            align-items: center;
        }
        .title-block h1 {
            font-size: 26px;
            letter-spacing: 0.4px;
            margin-bottom: 6px;
        }
        .title-block p { color: var(--muted); font-size: 14px; }
        .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .pill {
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid var(--panel-border);
            background: rgba(255,255,255,0.03);
            color: var(--text);
            font-size: 13px;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .pill:hover { border-color: var(--accent-2); color: #e0f2fe; }
        .pill.accent {
            background: linear-gradient(120deg, var(--accent), var(--accent-2));
            border: none;
            color: #0b1021;
            font-weight: 700;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 18px;
        }
        .card {
            position: relative;
            padding: 22px;
            border-radius: 14px;
            border: 1px solid var(--panel-border);
            background: linear-gradient(145deg, rgba(255,255,255,0.05), rgba(255,255,255,0.02));
            box-shadow: var(--card-glow);
            overflow: hidden;
            min-height: 220px;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }
        .card:hover { transform: translateY(-4px); border-color: rgba(124,58,237,0.35); }
        .card::after {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 20% 20%, rgba(124,58,237,0.12), transparent 45%);
            pointer-events: none;
        }
        .card-header { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 14px; position: relative; z-index: 1; }
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            border: 1px solid var(--panel-border);
            object-fit: cover;
            background: linear-gradient(145deg, #1f2937, #111827);
            flex-shrink: 0;
        }
        .avatar.placeholder {
            display: grid;
            place-items: center;
            font-size: 32px;
            color: #c7d2fe;
            background: linear-gradient(145deg, rgba(124, 58, 237, 0.2), rgba(34, 211, 238, 0.1));
        }
        .name { font-size: 20px; font-weight: 750; margin-bottom: 4px; }
        .workplace { color: var(--muted); font-size: 14px; }
        .tag {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 10px;
            border-radius: 999px;
            font-size: 13px;
            background: rgba(124, 58, 237, 0.14);
            color: #d8b4fe;
            border: 1px solid rgba(124,58,237,0.35);
        }
        .empty {
            text-align: center;
            color: #cbd5e1;
            padding: 60px 0;
            font-size: 14px;
        }
        @media (max-width: 640px) {
            body { padding: 70px 12px 40px; }
            .header { padding: 18px; }
            .card { padding: 16px; }
        }
        /* Navbar Styles */
        .navbar {
            position: fixed;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1200px, calc(100% - 40px));
            background: rgba(5, 6, 13, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            z-index: 1000;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
            overflow: hidden;
        }
        .navbar-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar-logo {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 80px;
        }
        .logo-text {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(120deg, #60a5fa, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 2px;
        }
        .nav-links {
            display: flex;
            gap: 24px;
            align-items: center;
            flex: 1;
            justify-content: center;
        }
        .nav-link {
            color: #e5e7eb;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: color 0.2s ease;
            position: relative;
        }
        .nav-link:hover {
            color: #60a5fa;
        }
        .nav-link::after {
            content: "";
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 2px;
            background: linear-gradient(120deg, #60a5fa, #22d3ee);
            transition: width 0.2s ease;
        }
        .nav-link:hover::after {
            width: 100%;
        }
        .nav-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            min-width: 140px;
            justify-content: flex-end;
        }
        .settings-btn {
            background: none;
            border: none;
            font-size: 18px;
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }
        .settings-btn:hover {
            background: rgba(96, 165, 250, 0.1);
        }
        .login-btn {
            background: linear-gradient(120deg, #60a5fa, #22d3ee);
            border: none;
            color: #0b1021;
            padding: 8px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(96, 165, 250, 0.3);
        }
        @media (max-width: 900px) {
            .nav-links {
                gap: 16px;
            }
            .nav-link {
                font-size: 13px;
            }
        }
        @media (max-width: 768px) {
            .navbar-container {
                padding: 10px 16px;
            }
            .nav-links {
                gap: 12px;
                font-size: 12px;
            }
            .nav-link {
                font-size: 12px;
            }
            .login-btn {
                padding: 6px 12px;
                font-size: 12px;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <div class="navbar-container">
            <!-- Logo -->
            <div class="navbar-logo">
                <div class="logo-text">FSS</div>
            </div>

            <!-- Navigation Links -->
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/regulations" class="nav-link">Regulations</a>
                <a href="/schedule" class="nav-link">Schedule</a>
                <a href="/mentors" class="nav-link">Mentors</a>
                <a href="/ranking" class="nav-link">Ranking</a>
            </div>

            <!-- Right Side Actions -->
            <div class="nav-actions">
                <a href="/login" class="login-btn">Login</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div id="mentorGrid" class="grid"></div>
        <div id="emptyState" class="empty" style="display:none;">No mentors found. Add entries to mentors.json and restart the server.</div>
    </div>

    <script>
        async function loadMentors() {
            const grid = document.getElementById('mentorGrid');
            const empty = document.getElementById('emptyState');
            grid.innerHTML = '';
            empty.style.display = 'none';

            try {
                const res = await fetch('/api/mentors');
                const data = await res.json();

                if (!data.success || !Array.isArray(data.mentors) || data.mentors.length === 0) {
                    empty.style.display = 'block';
                    return;
                }

                data.mentors.forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'card';
                    const hasPic = Boolean(m.picture_filename);
                    const imgSrc = hasPic ? `/api/mentors/${m.id}/picture` : null;

                    card.innerHTML = `
                        <div class="card-header">
                            ${hasPic
                                ? `<img class="avatar" src="${imgSrc}" alt="${m.name} ${m.surname}" onerror="this.parentElement.innerHTML='<div class=\\'avatar placeholder\\'>👤</div>'">`
                                : `<div class="avatar placeholder">👤</div>`
                            }
                            <div>
                                <div class="name">${m.name} ${m.surname}</div>
                                <div class="workplace">${m.workplace}</div>
                            </div>
                        </div>
                    `;

                    grid.appendChild(card);
                });
            } catch (err) {
                empty.textContent = 'Error loading mentors. Please try again.';
                empty.style.display = 'block';
            }
        }

        document.addEventListener('DOMContentLoaded', loadMentors);
    </script>
    <script>
            function ensureMentorLink(text, href) {
                const navLinks = document.querySelector('.nav-links');
                let link = document.querySelector('.nav-links .mentor-link');
                if (!link) {
                    link = document.createElement('a');
                    link.className = 'nav-link mentor-link';
                    navLinks.appendChild(link);
                }
                link.textContent = text;
                link.href = href;
            }

            async function setMentorLinkBySelection() {
                try {
                    const res = await fetch('/api/mentors/available');
                    if (!res.ok) return;
                    const data = await res.json();
                    const selectedCount = Array.isArray(data.selected) ? data.selected.length : 0;
                    if (selectedCount > 0) {
                        ensureMentorLink('Selected Mentors', '/selectedMentors');
                    } else {
                        ensureMentorLink('Choose Mentor', '/chooseMentor');
                    }
                } catch {}
            }

            function updateNavbar() {
        const teamName = window.loggedInTeam || '';
        const navActions = document.querySelector('.nav-actions');
        if (teamName) {
          navActions.innerHTML = `
            <button onclick="logout()" class="login-btn" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5;">Logout</button>
          `;
                    setMentorLinkBySelection();
        }
      }
      async function logout() {
        try {
          const response = await fetch('/api/logout', { method: 'POST' });
          if (response.ok) window.location.reload();
        } catch (error) {
          console.error('Logout failed:', error);
        }
      }
      updateNavbar();
    </script>
</body>
</html>
