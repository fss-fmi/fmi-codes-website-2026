# Applied by hand for a load test run on staging (docs/testing.md, "Load test"); no
# kustomization references this file, so Flux never applies or prunes it. The script comes
# from the registration-rush ConfigMap, created from tests/load/registration_rush.py just
# before the run.
apiVersion: batch/v1
kind: Job
metadata:
  name: registration-rush
  namespace: fmi-codes-staging
  labels:
    app.kubernetes.io/name: fmi-codes-load-test
    app.kubernetes.io/part-of: fmi-codes-website-2026
    app.kubernetes.io/managed-by: kubectl
spec:
  # A rerun would register a second set of accounts on top of the first.
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fmi-codes-load-test
        app.kubernetes.io/part-of: fmi-codes-website-2026
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: python:3.12-slim
          command: ["python", "-u", "/load/registration_rush.py"]
          # The trailing dot makes the name absolute: with the pod's ndots:5 every new
          # connection would otherwise try each search domain first.
          args:
            - --base-url=http://ingress-nginx-staging-controller.ingress-nginx-staging.svc.cluster.local.
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: script
              mountPath: /load
              readOnly: true
      volumes:
        - name: script
          configMap:
            name: registration-rush
