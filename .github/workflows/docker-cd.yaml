name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'infra/**'
      - 'docs/**'
      - '**.md'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    # Holds the Docker Hub credentials, which only main can use (#163), so every
    # action is pinned by SHA (repo-wide pinning: #164).
    environment:
      name: dockerhub
      deployment: false

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        run: echo "value=$(date -u +%s)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build and push backend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./backend
          push: true
          tags: |
            fssfmi/fmi-codes-backend:latest
            fssfmi/fmi-codes-backend:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
          no-cache: ${{ github.event_name == 'schedule' }}

      - name: Build and push frontend
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ./frontend
          push: true
          tags: |
            fssfmi/fmi-codes-frontend:latest
            fssfmi/fmi-codes-frontend:${{ steps.tag.outputs.value }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          no-cache: ${{ github.event_name == 'schedule' }}
