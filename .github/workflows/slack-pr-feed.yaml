name: Slack PR feed

# Posts ready PRs to #pr-updates: one parent message per PR, later events (its
# opening commits and every push included) in its thread, Flux bumps as a single
# edited one-liner (.github/scripts/pr_feed.py).
#
# pull_request_target runs with secrets even for fork PRs, so this workflow must
# never check out or run PR code: it checks out the default branch's scripts only
# and reads the PR from the event payload. issue_comment runs from the default
# branch for every issue and PR comment; the job skips plain issues and bot
# comments, and the script posts only commenters who can push.
#
# The Slack token lives in the slack environment, which only main can use (#163).
# A pull_request_review run runs on the PR's merge ref, so it can't have it:
# reviews come through the PR review relay instead, a secretless workflow whose
# file is taken from the PR's merge ref. Its finished run starts this one on
# workflow_run, from main, and the script reads the PR's reviews from the API. That
# also posts reviews on fork PRs.
# Skips quietly while SLACK_BOT_TOKEN or SLACK_PR_CHANNEL_ID is unset.

on:
  pull_request_target:
    types: [opened, ready_for_review, converted_to_draft, closed, reopened, edited, synchronize]
  issue_comment:
    types: [created]
  workflow_run:
    # Must match the relay's `name:` exactly.
    workflows: [PR review relay]
    types: [completed]

# Pushes to one PR run one at a time, so their replies post in order, and so do
# relay scans for one head branch. GitHub keeps only the newest pending run per
# group and cancels the others; the script then lists their commits in the next
# push reply, and the newest scan posts every review the cancelled ones would
# have. The head repo and branch are joined by ':', which neither name can hold,
# so two forks' branches never share a group. Every other event gets a group of
# its own, so a burst of comments is never cancelled.
concurrency:
  group: slack-pr-feed-${{ github.event_name == 'workflow_run' && format('review-{0}:{1}', github.event.workflow_run.head_repository.full_name, github.event.workflow_run.head_branch) || github.event.action == 'synchronize' && format('push-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  # A relay scan reads the PR's issue events to find when it was a draft.
  issues: read
  pull-requests: read

jobs:
  post:
    if: (github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.type != 'Bot')) && (github.event_name != 'workflow_run' || github.event.workflow_run.event == 'pull_request_review')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: slack
      deployment: false

    steps:
      - name: Checkout the default branch's scripts
        # Pinned by SHA: this job holds the Slack token (repo-wide pinning: #164).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PR_CHANNEL_ID: ${{ vars.SLACK_PR_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_feed.py
