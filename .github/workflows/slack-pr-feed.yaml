name: Slack PR feed

# Posts ready PRs to #pr-updates: one parent message per PR, later events in its
# thread, Flux bumps as a single edited one-liner (.github/scripts/pr_feed.py).
#
# pull_request_target runs with secrets even for fork PRs, so this workflow must
# never check out or run PR code: it checks out the default branch's scripts only
# and reads the PR from the event payload. GitHub withholds secrets from
# pull_request_review runs on fork PRs, so reviews on those are not posted.
# Skips quietly while SLACK_BOT_TOKEN or SLACK_PR_CHANNEL_ID is unset.

on:
  pull_request_target:
    types: [opened, ready_for_review, converted_to_draft, closed, reopened, edited]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: read

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout the default branch's scripts
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PR_CHANNEL_ID: ${{ vars.SLACK_PR_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_feed.py
