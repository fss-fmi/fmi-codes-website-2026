name: Slack PR feed

# Posts ready PRs to #pr-updates: one parent message per PR, later events (new
# commits included) in its thread, Flux bumps as a single edited one-liner
# (.github/scripts/pr_feed.py).
#
# pull_request_target runs with secrets even for fork PRs, so this workflow must
# never check out or run PR code: it checks out the default branch's scripts only
# and reads the PR from the event payload. GitHub withholds secrets from
# pull_request_review runs on fork PRs, so reviews on those are not posted.
# issue_comment runs from the default branch for every issue and PR comment; the
# job skips plain issues and bot comments, and the script posts only commenters who
# can push.
# Skips quietly while SLACK_BOT_TOKEN or SLACK_PR_CHANNEL_ID is unset.

on:
  pull_request_target:
    types: [opened, ready_for_review, converted_to_draft, closed, reopened, edited, synchronize]
  pull_request_review:
    types: [submitted]
  issue_comment:
    types: [created]

# Pushes to one PR run one at a time, so their replies post in order. GitHub keeps
# only the newest pending run per group and cancels the others; the script then
# lists their commits in the next reply. Every other event gets a group of its own,
# so a burst of reviews or comments is never cancelled.
concurrency:
  group: slack-pr-feed-${{ github.event.action == 'synchronize' && format('push-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

jobs:
  post:
    if: github.event_name != 'issue_comment' || (github.event.issue.pull_request && github.event.comment.user.type != 'Bot')
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout the default branch's scripts
        # Pinned by SHA: this job holds the Slack token (repo-wide pinning: #164).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Post to Slack
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_PR_CHANNEL_ID: ${{ vars.SLACK_PR_CHANNEL_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/pr_feed.py
