name: Open PR for Flux image bump

# Runs as the fmi-codes-bot GitHub App, not GITHUB_TOKEN: CI on a PR opened with
# GITHUB_TOKEN waits for a manual "Approve workflows to run", and GITHUB_TOKEN can't
# enable auto-merge here. With the app token CI starts by itself and the bump
# squash-merges as soon as the required checks pass.
#
# The PR opens, and auto-merge stays on, only while every staging image is on the
# same tag (.github/scripts/flux_bump_gate.py). Flux can commit the backend's bump
# before the frontend image exists; that half bump waits for the next scan.

on:
  push:
    branches:
      - flux-image-updates

# Never cancel a run in progress: each run reads the live branch, so the last one
# to run has the final say on auto-merge.
concurrency:
  group: flux-auto-pr
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout the default branch's scripts
        # Pinned by SHA: this job holds the bot token (repo-wide pinning: #164).
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Get a fmi-codes-bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}

      - name: Open the PR and enable auto-merge once the release is whole
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: python3 .github/scripts/flux_bump_gate.py
