name: Open PR for Flux image bump

on:
  push:
    branches:
      - flux-image-updates

jobs:
  open-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - name: Open pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head flux-image-updates \
            --title "deploy: bump image tags" \
            --body "Automated tag bump by Flux image-automation. Review and merge to roll the updated image(s) to the cluster." \
            || echo "PR already open, skipping"
