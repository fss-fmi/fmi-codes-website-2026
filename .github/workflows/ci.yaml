name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fmi_hackathon_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        run: pytest tests/ --ignore=tests/e2e -v

      - name: Run E2E tests
        env:
          TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/fmi_hackathon_db
          REDIS_URL: redis://localhost:6379
        run: pytest tests/e2e/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      # Advisory only: the existing codebase predates ruff-format, so a full
      # reformat is a separate opt-in cleanup. Surfaced in the log, not blocking.
      - name: Ruff format check (advisory)
        run: ruff format --check .
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # package-lock.json is intentionally gitignored, so there's no committed
      # lockfile to cache against or to feed `npm ci`; install from package.json.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: ESLint
        working-directory: frontend
        run: npx eslint .

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit
