name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit & E2E tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password
          POSTGRES_DB: fmi_hackathon_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run unit tests
        env:
          REDIS_URL: redis://localhost:6379
        run: pytest tests/ --ignore=tests/e2e -v

      - name: Run E2E tests
        env:
          TEST_DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/fmi_hackathon_db
          REDIS_URL: redis://localhost:6379
        run: pytest tests/e2e/ -v

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install ruff
        run: pip install ruff

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check (advisory)
        run: ruff format --check .
        continue-on-error: true

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: ESLint
        working-directory: frontend
        run: npx eslint .

      - name: TypeScript type check
        working-directory: frontend
        run: npx tsc -p tsconfig.app.json --noEmit

  flux-validate:
    name: Flux kustomize build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build flux kustomization
        run: kubectl kustomize infra/k8s/flux

      - name: Build app overlays
        run: |
          for env in staging prod; do
            kubectl kustomize "infra/k8s/overlays/$env" > /dev/null
          done

      - name: Build every path a Flux Kustomization reconciles
        run: |
          paths=$(grep -E '^\s+path: \./' infra/k8s/flux/source.yaml | awk '{print $2}')
          [ -n "$paths" ] || { echo "no Kustomization paths found in source.yaml" >&2; exit 1; }
          for p in $paths; do
            echo "kustomize $p"
            kubectl kustomize "$p" > /dev/null
          done

      - name: Validate the rendered db-migrate Job
        run: |
          tmp=$(mktemp -d)
          cp -r infra/k8s "$tmp/"
          for env in staging prod; do
            bash infra/k8s/scripts/render-migrate-job.sh "$env" 1 1700000000-abc1234 "$tmp/k8s"
            out=$(kubectl kustomize "$tmp/k8s/overlays/$env")
            grep -q 'image: docker.io/fssfmi/fmi-codes-backend:1700000000-abc1234' <<< "$out" \
              || { echo "Job image tag was rewritten in $env" >&2; exit 1; }
          done
          # The staging overlay's Flux image-policy markers must survive the render.
          grep -c '\$imagepolicy' "$tmp/k8s/overlays/staging/kustomization.yaml" | grep -qx 2 \
            || { echo "render-migrate-job.sh dropped the staging \$imagepolicy markers" >&2; exit 1; }
